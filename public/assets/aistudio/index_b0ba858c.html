/* ---------------------------- lookups ---------------------------- */

function categoryById(id) {
  return state.categories.find((c) => c.id === id) || { id, name: 'Uncategorised', group: 'needs', icon: 'bag', budgetCents: 0 };
}
function accountById(id) {
  return state.accounts.find((a) => a.id === id) || null;
}
function goalById(id) {
  return state.goals.find((g) => g.id === id) || null;
}
function activeAccounts() { return state.accounts.filter((a) => !a.archived); }
function tradeNet(t) { return (Number(t.pnlCents) || 0) - (Number(t.feesCents) || 0); }
function payoutNet(p) {
  const gross = Number(p.grossCents) || 0;
  const split = Number(p.splitPct) || 0;
  return Math.round(gross * split / 100) - (Number(p.feeCents) || 0);
}
function payoutTax(p) { return Math.round(payoutNet(p) * (Number(p.taxPct) || 0) / 100); }
function incomeTax(i) { return Math.round((Number(i.amountCents) || 0) * (Number(i.taxPct) || 0) / 100); }
// Household-currency (home) views — blueprint §6/§7: only reviewed amounts,
// and only payouts that actually reached personal money (status 'converted').
function payoutHomeNet(p) {
  if (p.status !== 'converted') return null;
  const h = Number(p.homeCents);
  return Number.isFinite(h) && p.homeCents != null && h > 0 ? Math.round(h) : null;
}
function payoutHomeTax(p) { const h = payoutHomeNet(p); return h == null ? 0 : Math.round(h * (Number(p.taxPct) || 0) / 100); }
function incomeHome(i) {
  if (i.currencyUnreviewed) return null;
  if (i.homeCents != null) { const h = Number(i.homeCents); return Number.isFinite(h) ? Math.round(h) : null; }
  if (i.currency === homeCode()) return Math.round(Number(i.amountCents) || 0);
  return null;
}
function incomeHomeTax(i) { const h = incomeHome(i); return h == null ? 0 : Math.round(h * (Number(i.taxPct) || 0) / 100); }
function expenseHome(e) {
  if (e.currencyUnreviewed) return null;
  if (e.homeCents != null) { const h = Number(e.homeCents); return Number.isFinite(h) ? Math.round(h) : null; }
  if (e.currency === homeCode()) return Math.round(Number(e.amountCents) || 0);
  return null;
}
function unreviewedMoney() {
  const incomes = state.incomes.filter((i) => incomeHome(i) == null && (Number(i.amountCents) || 0) > 0);
  const expenses = state.expenses.filter((e) => expenseHome(e) == null && (Number(e.amountCents) || 0) > 0);
  const payouts = state.payouts.filter((p) => payoutHomeNet(p) == null && p.status === 'converted' && (Number(p.grossCents) || 0) > 0);
  return { incomes, expenses, payouts, count: incomes.length + expenses.length + payouts.length };
}
function accountKindLabel(kind) {
  return kind === 'funded' ? 'Funded' : kind === 'personal' ? 'Personal' : 'Challenge';
}
function sortTradesAsc(a, b) {
  const d = String(a.date || '').localeCompare(String(b.date || ''));
  if (d !== 0) return d;
  const hm = String(a.startHM || '').localeCompare(String(b.startHM || ''));
  if (hm !== 0) return hm;
  return String(a.createdAt || '').localeCompare(String(b.createdAt || ''));
}
function sortTradesDesc(a, b) { return sortTradesAsc(b, a); }

/* ---------------------------- account engine ---------------------------- */

function calcAccount(acc, trades = state.trades, payouts = state.payouts, adjustments = state.adjustments, today = todayISO()) {
  const ownTrades = trades
    .filter((t) => t.accountId === acc.id)
    .sort(sortTradesAsc);
  const ownPayouts = payouts
    .filter((p) => p.accountId === acc.id)
    .sort((a, b) => String(a.date).localeCompare(String(b.date)));
  const ownAdjustments = adjustments.filter((a) => a.accountId === acc.id);

  const starting = Number(acc.startingCents ?? acc.sizeCents) || 0;
  const size = Number(acc.sizeCents) || 0;
  const pnl = sum(ownTrades, tradeNet);
  const grossPayouts = sum(ownPayouts, (p) => p.grossCents);
  const adjustmentTotal = sum(ownAdjustments, (a) => a.amountCents);
  const equity = starting + pnl - grossPayouts + adjustmentTotal;

  const runningEquity = [];
  let run = starting + adjustmentTotal;
  let peak = run;
  ownTrades.forEach((t) => {
    run += tradeNet(t);
    peak = Math.max(peak, run);
    runningEquity.push({ date: t.date, value: run, tradeId: t.id });
  });

  const targetCents = Math.round(size * (Number(acc.targetPct) || 0) / 100);
  const dailyLimitCents = Math.round(size * (Number(acc.dailyDdPct) || 0) / 100);
  const maxLossCents = Math.round(size * (Number(acc.maxDdPct) || 0) / 100);
  const floorCents = acc.ddBasis === 'trailing'
    ? peak - maxLossCents
    : size - maxLossCents;
  const bufferCents = equity - floorCents;
  const bufferRatio = maxLossCents > 0 ? bufferCents / maxLossCents : 1;

  const todayTrades = ownTrades.filter((t) => t.date === today);
  const todayPnl = sum(todayTrades, tradeNet);
  const dailyUsedCents = Math.max(0, -todayPnl);
  const dailyRemainingCents = Math.max(0, dailyLimitCents - dailyUsedCents);
  const dailyUsedPct = dailyLimitCents > 0 ? dailyUsedCents / dailyLimitCents : 0;

  const lastPayout = ownPayouts.length ? ownPayouts[ownPayouts.length - 1] : null;
  const cycleTrades = lastPayout
    ? ownTrades.filter((t) => t.date > lastPayout.date)
    : ownTrades;
  const cycleNet = sum(cycleTrades, tradeNet);
  const cycleDays = new Set(cycleTrades.map((t) => t.date)).size;
  const profitSinceStart = equity - starting;
  const splitPct = Number(acc.splitPct) || 0;
  const expectedPayoutCents = Math.round(Math.max(0, cycleNet) * splitPct / 100);
  const daysTraded = new Set(ownTrades.map((t) => t.date)).size;
  const targetProgress = targetCents > 0 ? Math.max(0, profitSinceStart) / targetCents : 0;
  const payoutMin = Number(acc.payoutMinCents) || 0;

  const hasRules = dailyLimitCents > 0 || maxLossCents > 0;
  const breached = (maxLossCents > 0 && equity <= floorCents) || (dailyLimitCents > 0 && dailyUsedCents >= dailyLimitCents);
  const payoutEligible = (acc.kind === 'funded' || acc.kind === 'personal')
    && cycleNet > 0
    && expectedPayoutCents >= payoutMin
    && !breached;

  let level = 'ok';
  if (breached) level = 'breach';
  else if (dailyUsedPct >= 0.8 || bufferRatio <= 0.25) level = 'danger';
  else if (dailyUsedPct >= 0.5 || bufferRatio <= 0.45) level = 'watch';

  const ddBase = acc.ddBasis === 'trailing' ? Math.max(peak, starting + adjustmentTotal) : starting;
  const drawdownPct = ddBase > 0 ? Math.max(0, (ddBase - equity) / ddBase) * 100 : 0;
  let healthScore = 100;
  if (dailyLimitCents > 0) healthScore -= clamp(dailyUsedPct, 0, 1) * 45;
  if (maxLossCents > 0) healthScore -= (1 - clamp(bufferRatio, 0, 1)) * 45;
  healthScore -= Math.min(10, drawdownPct * 1.5);
  healthScore = breached ? 0 : Math.round(clamp(healthScore, 0, 100));

  return {
    account: acc,
    trades: ownTrades,
    payouts: ownPayouts,
    starting, size, pnl, grossPayouts, adjustmentTotal, equity, peak,
    runningEquity,
    targetCents, targetProgress,
    profitSinceStart,
    dailyLimitCents, dailyUsedCents, dailyRemainingCents, dailyUsedPct, todayPnl,
    maxLossCents, floorCents, bufferCents, bufferRatio,
    cycleNet, cycleDays, expectedPayoutCents, daysTraded,
    lastPayout, payoutMin, payoutEligible,
    hasRules, breached, level,
    drawdownPct, healthScore,
    splitPct
  };
}

function accountBaseRiskPct(acc) {
  const fallback = Number(state.settings.riskPct) || 0.5;
  const raw = acc ? acc.baseRiskPct : null;
  if (raw === null || raw === undefined || raw === '') return fallback;
  const n = Number(raw);
  return Number.isFinite(n) && n >= 0 ? n : fallback;
}

function riskForAccount(acc, drawdownPct) {
  const basePct = accountBaseRiskPct(acc);
  const ladder = Array.isArray(acc && acc.riskLadder) ? acc.riskLadder : [];
  let rule = null;
  ladder.forEach((r) => {
    const t = Number(r && r.thresholdPct);
    const p = Number(r && r.riskPct);
    if (!(t > 0) || !Number.isFinite(p)) return;
    if (drawdownPct + 1e-9 >= t && (!rule || t > Number(rule.thresholdPct))) {
      rule = { thresholdPct: t, riskPct: Math.max(0, p) };
    }
  });
  return { basePct, pct: rule ? rule.riskPct : basePct, rule };
}

function accountsWithMetrics() {
  return activeAccounts().map((a) => calcAccount(a));
}

/* ---------------------------- monthly money ---------------------------- */

function monthFinancials(mk = currentMonthKey()) {
  const payoutsIn = state.payouts.filter((p) => monthKeyOf(p.date) === mk);
  const incomesIn = state.incomes.filter((i) => monthKeyOf(i.date) === mk);
  const expensesIn = state.expenses.filter((e) => monthKeyOf(e.date) === mk);

  // All money below is in the household base currency (homeCode()).
  const cashedPayouts = payoutsIn.filter((p) => payoutHomeNet(p) != null);
  const bridgingPayouts = payoutsIn.filter((p) => p.status !== 'converted');
  const payoutHomeTotal = sum(cashedPayouts, payoutHomeNet);
  const payoutTaxTotal = sum(cashedPayouts, payoutHomeTax);
  const otherIncome = sum(incomesIn.filter((i) => !i.funding && incomeHome(i) != null), incomeHome);
  const otherTax = sum(incomesIn.filter((i) => !i.funding), incomeHomeTax);
  const drawdown = sum(incomesIn.filter((i) => i.funding && incomeHome(i) != null), incomeHome);
  const income = payoutHomeTotal + otherIncome;
  const tax = payoutTaxTotal + otherTax;
  const spendable = income - tax;
  const homeExpenses = expensesIn.filter((e) => expenseHome(e) != null);
  const expenses = sum(homeExpenses, expenseHome);
  const business = sum(homeExpenses.filter((e) => categoryById(e.categoryId).group === 'business'), expenseHome);
  const personal = expenses - business;
  const net = spendable - expenses;
  const cashLeft = net + drawdown;
  const toGoals = goalContribIn(mk);
  const savingsRate = spendable > 0 ? net / spendable : 0;

  return {
    month: mk,
    payoutsIn, incomesIn, expensesIn,
    cashedPayouts, bridgingPayouts,
    payoutHomeTotal, payoutTaxTotal,
    otherIncome, otherTax, drawdown,
    income, tax, spendable, expenses, business, personal, net, cashLeft, toGoals, savingsRate,
    hasIncome: income > 0
  };
}

function goalContribIn(mk) {
  if (!mk) return sum(state.goalLog, (l) => Number(l.amountCents) || 0);
  return sum(state.goalLog.filter((l) => monthKeyOf(l.date) === mk), (l) => Number(l.amountCents) || 0);
}

function moneyBasket() {
  const months = new Set();
  state.payouts.forEach((p) => months.add(monthKeyOf(p.date)));
  state.incomes.forEach((i) => months.add(monthKeyOf(i.date)));
  state.expenses.forEach((e) => months.add(monthKeyOf(e.date)));
  let takeHome = 0; let spent = 0; let drawn = 0;
  [...months].sort().forEach((mk) => {
    const f = monthFinancials(mk);
    takeHome += f.spendable;
    spent += f.expenses;
    drawn += f.drawdown;
  });
  const toGoals = goalContribIn(null);
  const unreviewed = state.incomes.filter((i) => i.currencyUnreviewed).length
    + state.expenses.filter((e) => e.currencyUnreviewed).length
    + state.payouts.filter((p) => p.currencyUnreviewed).length;
  return { takeHome, spent, drawn, toGoals, left: takeHome - spent - toGoals, unreviewed };
}

function yearFinancials(year = new Date().getFullYear()) {
  const prefix = String(year) + '-';
  const payoutsIn = state.payouts.filter((p) => p.date.startsWith(prefix));
  const incomesIn = state.incomes.filter((i) => i.date.startsWith(prefix));
  const expensesIn = state.expenses.filter((e) => e.date.startsWith(prefix));
  const cashedPayouts = payoutsIn.filter((p) => payoutHomeNet(p) != null);
  const payoutHomeTotal = sum(cashedPayouts, payoutHomeNet);
  const payoutTaxTotal = sum(cashedPayouts, payoutHomeTax);
  const otherIncome = sum(incomesIn.filter((i) => !i.funding && incomeHome(i) != null), incomeHome);
  const otherTax = sum(incomesIn.filter((i) => !i.funding), incomeHomeTax);
  const drawdown = sum(incomesIn.filter((i) => i.funding && incomeHome(i) != null), incomeHome);
  const income = payoutHomeTotal + otherIncome;
  const tax = payoutTaxTotal + otherTax;
  const homeExpenses = expensesIn.filter((e) => expenseHome(e) != null);
  const expenses = sum(homeExpenses, expenseHome);
  const business = sum(homeExpenses.filter((e) => categoryById(e.categoryId).group === 'business'), expenseHome);
  return {
    year, payoutsIn, incomesIn, expensesIn,
    payoutHomeTotal, otherIncome, income, tax, expenses, business, drawdown,
    personal: expenses - business,
    spendable: income - tax,
    net: income - tax - expenses
  };
}

function taxReservedTotal() {
  return sum(state.payouts.filter((p) => payoutHomeNet(p) != null), payoutHomeTax)
    + sum(state.incomes.filter((i) => incomeHome(i) != null), incomeHomeTax);
}

function monthlySeries(months = 6) {
  return lastMonths(months).map((mk) => {
    const f = monthFinancials(mk);
    return { month: mk, label: monthLabel(mk, true), income: f.spendable, expenses: f.expenses, net: f.net };
  });
}

function totalEquity() {
  return sum(accountsWithMetrics(), (m) => m.equity);
}
function totalFundedCapital() {
  return sum(activeAccounts().filter((a) => a.kind === 'funded' || a.kind === 'personal'), (a) => a.sizeCents);
}
function expectedPayoutTotal() {
  return sum(accountsWithMetrics(), (m) => m.expectedPayoutCents);
}

/* ---------------------------- budget engine ---------------------------- */

function budgetSnapshot(mk = currentMonthKey()) {
  const rows = state.categories.map((c) => {
    const spent = sum(state.expenses.filter((e) => e.categoryId === c.id && monthKeyOf(e.date) === mk), (e) => expenseHome(e));
    const limit = Number(c.budgetCents) || 0;
    return {
      category: c,
      spent,
      limit,
      remaining: limit - spent,
      pct: limit > 0 ? spent / limit : 0,
      over: limit > 0 && spent > limit
    };
  });
  const groups = {};
  ['needs', 'wants', 'business'].forEach((g) => {
    const gr = rows.filter((r) => r.category.group === g);
    groups[g] = {
      label: CATEGORY_GROUPS[g].label,
      rows: gr,
      limit: sum(gr, (r) => r.limit),
      spent: sum(gr, (r) => r.spent)
    };
  });
  const totalLimit = sum(rows, (r) => r.limit);
  const totalSpent = sum(rows, (r) => r.spent);
  const budgeted = rows.filter((r) => r.limit > 0);
  const within = budgeted.filter((r) => !r.over).length;
  return {
    rows, groups, totalLimit, totalSpent,
    remaining: totalLimit - totalSpent,
    personalLimit: groups.needs.limit + groups.wants.limit,
    personalSpent: groups.needs.spent + groups.wants.spent,
    businessLimit: groups.business.limit,
    businessSpent: groups.business.spent,
    budgetedCount: budgeted.length,
    withinCount: within,
    overCount: budgeted.length - within
  };
}

function budgetHealth() {
  const snap = budgetSnapshot(currentMonthKey());
  if (!snap.budgetedCount) return { score: 0, detail: 'No budgets set' };
  return {
    score: (snap.withinCount / snap.budgetedCount) * 15,
    detail: `${snap.withinCount} of ${snap.budgetedCount} categories within limit`
  };
}

/* ---------------------------- goals ---------------------------- */

function goalProgress(g) {
  const target = Number(g.targetCents) || 0;
  return target > 0 ? clamp((Number(g.savedCents) || 0) / target, 0, 1.5) : 0;
}
function goalMonthlyNeeded(g) {
  const target = Number(g.targetCents) || 0;
  const saved = Number(g.savedCents) || 0;
  const remaining = Math.max(0, target - saved);
  if (!g.deadline) return null;
  const days = Math.max(1, daysBetween(todayISO(), g.deadline));
  const months = Math.max(1, days / 30.44);
  return remaining / months;
}
function emergencyGoal() {
  return state.goals.find((g) => g.type === 'emergency') || null;
}
function taxGoal() {
  return state.goals.find((g) => g.type === 'tax') || null;
}
function monthlyBurn(months = 3) {
  const series = lastMonths(months).map((mk) => monthFinancials(mk).expenses);
  const withData = series.filter((v) => v > 0);
  if (withData.length) return avg(withData);
  const snap = budgetSnapshot();
  return snap.totalLimit;
}
function runwayMonths() {
  const em = emergencyGoal();
  const burn = monthlyBurn();
  if (!em || burn <= 0) return null;
  return (Number(em.savedCents) || 0) / burn;
}

/* ---------------------------- stats ---------------------------- */

const HOUR_BAND_H = 4;
// Four-hour buckets, labelled by UTC start so the key sorts chronologically.
function sessionFromHM(hm) {
  const s = String(hm || '');
  if (!/^\d{1,2}:\d{2}$/.test(s)) return '';
  const mins = Number(s.slice(0, 2)) * 60 + Number(s.slice(3, 5));
  const inWindow = (key) => {
    const w = SESSION_UTC[key];
    if (!w) return false;
    const from = Number(w[0].slice(0, 2)) * 60 + Number(w[0].slice(3, 5));
    const to = Number(w[1].slice(0, 2)) * 60 + Number(w[1].slice(3, 5));
    return mins >= from && mins < to;
  };
  if (inWindow('London/NY overlap')) return 'London/NY overlap';
  if (inWindow('New York')) return 'New York';
  if (inWindow('London')) return 'London';
  if (inWindow('Asia')) return 'Asia';
  return 'Other';
}

// Time is the more honest field — he already knows what clock he clicked at, and
// asking which session that is makes him do desk maths while holding a live position.
function wireSessionFromTime(form, { hintId = '', untouched = true, note = '' } = {}) {
  const timeEl = form.elements.namedItem('startHM');
  const sessEl = form.elements.namedItem('session');
  if (!timeEl || !sessEl) return;
  let chosen = !untouched;
  sessEl.addEventListener('change', () => { chosen = true; });
  timeEl.addEventListener('change', () => {
    const picked = sessionFromHM(timeEl.value);
    if (!picked) return;
    const hint = hintId ? document.getElementById(hintId) : null;
    if (chosen) {
      if (hint) hint.textContent = `Keeping ${sessEl.value}, because you set it. Your entry time sits in ${picked}. ${note}`;
      return;
    }
    sessEl.value = picked;
    if (hint) hint.textContent = `${picked}, read off ${timeEl.value} on your platform clock. ${note}`;
  });
}

function hourBandKey(hm) {
  const s = String(hm || '');
  if (!/^\d{1,2}:\d{2}$/.test(s)) return null;
  const band = Math.floor(Number(s.slice(0, 2)) / HOUR_BAND_H) * HOUR_BAND_H;
  const pad = (n) => String(n).padStart(2, '0');
  return `${pad(band)}:00–${pad(band + HOUR_BAND_H)}:00`;
}

function statsFor(tradeList) {
  const rows = [...tradeList].sort(sortTradesAsc).map((t) => ({ ...t, net: tradeNet(t) }));
  const wins = rows.filter((t) => t.net > 0);
  const losses = rows.filter((t) => t.net < 0);
  const breakeven = rows.filter((t) => t.net === 0);
  const grossWin = sum(wins, (t) => t.net);
  const grossLoss = Math.abs(sum(losses, (t) => t.net));
  const winRate = wins.length + losses.length > 0 ? wins.length / (wins.length + losses.length) : 0;
  const avgWin = wins.length ? grossWin / wins.length : 0;
  const avgLoss = losses.length ? grossLoss / losses.length : 0;
  const net = sum(rows, (t) => t.net);
  const rRows = rows.filter((t) => t.r != null && Number.isFinite(Number(t.r)));
  const totalR = sum(rRows, (t) => Number(t.r));
  const avgR = rRows.length ? totalR / rRows.length : null;
  const expectancy = winRate * avgWin - (1 - winRate) * avgLoss;

  let cum = 0;
  let peak = 0;
  let maxDD = 0;
  const curve = [{ date: rows.length ? rows[0].date : todayISO(), value: 0, label: 'Start' }];
  rows.forEach((t) => {
    cum += t.net;
    peak = Math.max(peak, cum);
    maxDD = Math.max(maxDD, peak - cum);
    curve.push({ date: t.date, value: cum, label: t.pair || '' });
  });

  let bestWinStreak = 0, bestLossStreak = 0, winStreak = 0, lossStreak = 0;
  rows.forEach((t) => {
    if (t.net > 0) { winStreak += 1; lossStreak = 0; }
    else if (t.net < 0) { lossStreak += 1; winStreak = 0; }
    bestWinStreak = Math.max(bestWinStreak, winStreak);
    bestLossStreak = Math.max(bestLossStreak, lossStreak);
  });
  let currentStreak = 0;
  if (rows.length) {
    const sign = rows[rows.length - 1].net > 0 ? 1 : rows[rows.length - 1].net < 0 ? -1 : 0;
    if (sign !== 0) {
      for (let i = rows.length - 1; i >= 0; i--) {
        const s = rows[i].net > 0 ? 1 : rows[i].net < 0 ? -1 : 0;
        if (s === sign) currentStreak += sign; else break;
      }
    }
  }

  const best = rows.reduce((a, b) => (!a || b.net > a.net ? b : a), null);
  const worst = rows.reduce((a, b) => (!a || b.net < a.net ? b : a), null);

  const bySession = Object.create(null);
  const byGrade = Object.create(null);
  const byPair = Object.create(null);
  const byHour = Object.create(null);
  const bySetup = Object.create(null);
  rows.forEach((t) => {
    const add = (map, key) => {
      if (!map[key]) map[key] = { key, count: 0, net: 0, wins: 0, losses: 0, rTotal: 0, rCount: 0 };
      const row = map[key];
      row.count += 1; row.net += t.net;
      if (t.net > 0) row.wins += 1;
      if (t.net < 0) row.losses += 1;
      if (t.r != null && Number.isFinite(Number(t.r))) { row.rTotal += Number(t.r); row.rCount += 1; }
    };
    add(bySession, t.session || 'Other');
    add(byGrade, t.grade || '—');
    add(byPair, t.pair || '—');
    add(bySetup, t.setup || '—');
    const band = hourBandKey(t.startHM);
    if (band) add(byHour, band);
  });

  return {
    rows, wins, losses, breakeven,
    count: rows.length,
    winRate, grossWin, grossLoss, avgWin, avgLoss,
    profitFactor: grossLoss > 0 ? grossWin / grossLoss : (grossWin > 0 ? Infinity : null),
    net, expectancy,
    rRows, totalR, avgR, rMeasured: rRows.length, rUnknown: rows.length - rRows.length,
    maxDD, curve, bestWinStreak, bestLossStreak, currentStreak,
    best, worst,
    bySession, byGrade, byPair, byHour, bySetup,
    avgNet: rows.length ? net / rows.length : 0
  };
}
function pfLabel(pf) {
  if (pf == null) return '—';
  return Number.isFinite(pf) ? pf.toFixed(2) : '∞';
}

/* ---------------------------- business engine ---------------------------- */
// Every number below is derived from records already in the ledger. The charter
// sets policy; it never invents money.

function charter() { return state.charter && typeof state.charter === 'object' ? state.charter : { ...CHARTER_DEFAULTS }; }
function charterAdopted() { return isDateISO(charter().adoptedOn); }
function tradingBase() {
  const c = state.settings ? state.settings.currency : 'USD';
  return CURRENCIES[c] ? c : 'USD';
}

function allocationRows() {
  const c = charter();
  return [
    { pool: 'owner_draw', pct: c.ownerDrawPct },
    { pool: 'personal_capital', pct: c.personalCapitalPct },
    { pool: 'reserve', pct: c.reservePct },
    { pool: 'research', pct: c.researchPct }
  ];
}
function allocationTotalPct() { return Math.round(sum(allocationRows(), (r) => r.pct) * 100) / 100; }

// Cumulative rounding keeps the parts summing to the whole, with no drift.
function splitByPct(amount, rows) {
  const total = sum(rows, (r) => Math.max(0, Number(r.pct) || 0));
  if (!(amount > 0) || total <= 0) return rows.map((r) => ({ pool: r.pool, pct: Number(r.pct) || 0, cents: 0 }));
  let running = 0;
  let assigned = 0;
  return rows.map((r) => {
    running += Math.max(0, Number(r.pct) || 0);
    const upto = Math.round(amount * running / total);
    const cents = upto - assigned;
    assigned = upto;
    return { pool: r.pool, pct: Number(r.pct) || 0, cents };
  });
}

function payoutDistributable(p) {
  return Math.max(0, payoutNet(p) - payoutTax(p));
}
function payoutAllocation(p) {
  return {
    amount: payoutDistributable(p),
    currency: payoutCurrency(p),
    items: splitByPct(payoutDistributable(p), allocationRows())
  };
}

function removePayoutPools(payoutId) {
  state.pools = state.pools.filter((x) => !(x.source === 'payout' && x.payoutId === payoutId));
}
// Rebuilds the auto entries for one payout. Manual movements are never touched.
function syncPayoutPools(p) {
  removePayoutPools(p.id);
  if (!p.id || !['received', 'converted'].includes(p.status)) return 0;
  const alloc = payoutAllocation(p);
  if (!(alloc.amount > 0)) return 0;
  alloc.items.forEach((item) => {
    if (item.cents <= 0) return;
    state.pools.push({
      id: uid('pool'),
      date: p.date,
      pool: item.pool,
      direction: 'in',
      cents: item.cents,
      currency: alloc.currency,
      source: 'payout',
      payoutId: p.id,
      note: `Charter split ${item.pct}% of ${money(alloc.amount, { code: alloc.currency })}`,
      createdAt: new Date().toISOString()
    });
  });
  return alloc.items.filter((i) => i.cents > 0).length;
}
function poolSigned(entry) { return entry.direction === 'out' ? -entry.cents : entry.cents; }
function poolBalance(code, currency) {
  return sum(state.pools.filter((p) => p.pool === code && (!currency || p.currency === currency)), poolSigned);
}
function poolCurrencies() {
  const set = new Set(state.pools.map((p) => p.currency));
  if (!set.size) set.add(tradingBase());
  return [...set].sort();
}

function balanceSheet() {
  const metrics = accountsWithMetrics().filter((m) => !m.account.archived);
  const byCur = {};
  const ensure = (cur) => {
    if (!byCur[cur]) {
      byCur[cur] = { currency: cur, propEquity: 0, personalEquity: 0, pools: {}, distributions: 0, tradeFees: 0, payoutFees: 0, realisedNet: 0 };
      Object.keys(POOL_KEYS).forEach((k) => { byCur[cur].pools[k] = 0; });
    }
    return byCur[cur];
  };
  ensure(tradingBase());
  metrics.forEach((m) => {
    const b = ensure(accountCurrency(m.account));
    b.realisedNet += m.pnl;
    if (m.account.kind === 'personal') b.personalEquity += m.equity;
    else b.propEquity += m.equity;
  });
  state.pools.forEach((p) => {
    const b = ensure(p.currency);
    b.pools[p.pool] += poolSigned(p);
  });
  state.trades.forEach((t) => {
    const acc = accountById(t.accountId);
    ensure(acc ? accountCurrency(acc) : tradingBase()).tradeFees += (Number(t.feesCents) || 0);
  });
  state.payouts.forEach((p) => {
    const b = ensure(payoutCurrency(p));
    b.payoutFees += (Number(p.feeCents) || 0);
  });
  Object.keys(byCur).forEach((cur) => {
    const b = byCur[cur];
    b.distributions = b.pools.owner_draw || 0;
    b.retained = (b.pools.reserve || 0) + (b.pools.personal_capital || 0) + (b.pools.research || 0);
    b.totalCosts = b.tradeFees + b.payoutFees;
  });
  return { byCurrency: byCur, currencies: Object.keys(byCur).sort() };
}

function operatingCostMonthly(currency, months = 3) {
  const keys = lastMonths(months);
  const fees = sum(state.trades.filter((t) => keys.includes(monthKeyOf(t.date))), (t) => (Number(t.feesCents) || 0))
    + sum(state.payouts.filter((p) => keys.includes(monthKeyOf(p.date)) && p.currency === currency), (p) => (Number(p.feeCents) || 0));
  if (!keys.length) return 0;
  return Math.round(fees / months);
}
function reserveRunway(currency) {
  const cur = currency || tradingBase();
  const monthly = operatingCostMonthly(cur, 3);
  const reserve = poolBalance('reserve', cur);
  const target = charter().reserveTargetMonths;
  if (monthly <= 0) return { monthly, reserve, months: null, target };
  return { monthly, reserve, months: roundTo(reserve / monthly, 1), target };
}
function monthNetPnl(mk, currency) {
  return sum(state.trades.filter((t) => {
    if (monthKeyOf(t.date) !== mk) return false;
    if (!currency) return true;
    const acc = accountById(t.accountId);
    return (acc ? accountCurrency(acc) : tradingBase()) === currency;
  }), tradeNet);
}
function profitableMonthStreak(currency) {
  const keys = [...new Set(state.trades.map((t) => monthKeyOf(t.date)))].sort();
  let best = 0;
  let run = 0;
  keys.forEach((mk) => {
    if (monthNetPnl(mk, currency) > 0) { run += 1; best = Math.max(best, run); } else run = 0;
  });
  const current = keys.length && monthNetPnl(keys[keys.length - 1], currency) > 0 ? run : 0;
  return { best, current, months: keys.length };
}

/* ---------------------------- duties and rhythm ---------------------------- */

function mondayOf(iso) {
  const d = parseISODate(iso);
  if (isNaN(d.getTime())) return iso;
  const day = (d.getDay() + 6) % 7;
  d.setDate(d.getDate() - day);
  return isoOf(d);
}
function quarterKeyOf(iso) {
  const mk = monthKeyOf(iso);
  if (!mk) return '';
  const parts = mk.split('-').map(Number);
  return `${parts[0]}-Q${Math.ceil(parts[1] / 3)}`;
}
function dutyPeriod(cadence, iso) {
  const date = isDateISO(iso) ? iso : todayISO();
  if (cadence === 'daily') return date;
  if (cadence === 'weekly') return mondayOf(date);
  if (cadence === 'quarterly') return quarterKeyOf(date);
  return monthKeyOf(date);
}
function shiftPeriod(cadence, key, delta) {
  if (cadence === 'daily') return addDaysISO(key, delta);
  if (cadence === 'weekly') return addDaysISO(key, delta * 7);
  if (cadence === 'quarterly') {
    const parts = String(key).split('-Q');
    const total = Number(parts[0]) * 4 + (Number(parts[1]) - 1) + delta;
    return `${Math.floor(total / 4)}-Q${(total % 4) + 1}`;
  }
  return shiftMonthKey(key, delta);
}
function periodLabel(cadence, key) {
  if (!key) return '—';
  if (cadence === 'quarterly') return key.replace('-Q', ' quarter ');
  if (cadence === 'daily') return fmtDate(key);
  if (cadence === 'weekly') return `week of ${fmtDate(key)}`;
  return monthLabel(key);
}
function dutyIsDone(duty, iso = todayISO()) {
  const period = dutyPeriod(duty.cadence, iso);
  return state.dutyLog.some((l) => l.dutyId === duty.id && l.period === period);
}
function lastDoneOn(duty) {
  const rows = state.dutyLog.filter((l) => l.dutyId === duty.id).sort((a, b) => String(b.date).localeCompare(String(a.date)));
  return rows.length ? rows[0].date : '';
}
function dutyStreak(duty) {
  const done = new Set(state.dutyLog.filter((l) => l.dutyId === duty.id).map((l) => l.period));
  let key = dutyPeriod(duty.cadence, todayISO());
  let streak = 0;
  for (let i = 0; i < 400; i++) {
    if (!done.has(key)) break;
    streak += 1;
    key = shiftPeriod(duty.cadence, key, -1);
  }
  return streak;
}
function activeDuties() { return state.duties.filter((d) => d.active); }
function dutiesPending(iso = todayISO()) { return activeDuties().filter((d) => !dutyIsDone(d, iso)); }
function dutiesByDept() {
  const map = {};
  DEPARTMENTS.forEach((dept) => { map[dept.id] = []; });
  activeDuties().forEach((d) => { (map[d.dept] = map[d.dept] || []).push(d); });
  return map;
}
function rhythmStatus() {
  return [
    { cadence: 'daily', label: 'Daily close', text: 'Journal, rule check, no impulsive strategy change.' },
    { cadence: 'weekly', label: 'Weekly review', text: 'Setup quality, execution errors, costs, one improvement.' },
    { cadence: 'monthly', label: 'Monthly statement', text: 'Full P/L, expectancy, drawdown, reconciliation, expenses.' },
    { cadence: 'quarterly', label: 'Quarterly governance', text: 'Robustness, prop exposure, reserve, scale decision.' }
  ].map((r) => {
    const duties = activeDuties().filter((d) => d.cadence === r.cadence);
    const done = duties.filter((d) => dutyIsDone(d)).length;
    return { ...r, total: duties.length, done, complete: duties.length > 0 && done === duties.length };
  });
}

/* ---------------------------- breach register ---------------------------- */

function tradeCurrency(t) {
  const acc = t && t.accountId ? accountById(t.accountId) : null;
  return acc ? accountCurrency(acc) : tradingBase();
}
function journalBreaches() {
  return state.trades.filter((t) => t.plan === false).map((t) => ({
    id: `journal_${t.id}`,
    date: t.date,
    rule: 'Off-plan entry',
    tradeId: t.id,
    accountId: t.accountId,
    note: String(t.notes || ''),
    costR: t.r == null || !Number.isFinite(Number(t.r)) ? null : Number(t.r),
    costCents: tradeNet(t),
    currency: tradeCurrency(t),
    source: 'journal',
    removable: false
  }));
}
function breachRows() {
  const journal = journalBreaches();
  const covered = new Set(journal.map((r) => r.tradeId));
  const manual = state.breaches.filter((b) => !b.tradeId || !covered.has(b.tradeId));
  return [...journal, ...manual].sort((a, b) => String(b.date).localeCompare(String(a.date)));
}
function breachSummary(mk) {
  const rows = mk ? breachRows().filter((r) => monthKeyOf(r.date) === mk) : breachRows();
  const costR = sum(rows.filter((r) => Number(r.costR) < 0), (r) => Number(r.costR));
  const costCents = sum(rows.filter((r) => Number(r.costCents) < 0), (r) => Number(r.costCents));
  const byRule = {};
  rows.forEach((r) => { byRule[r.rule] = (byRule[r.rule] || 0) + 1; });
  return {
    rows,
    count: rows.length,
    costR: roundTo(costR, 2),
    costCents,
    worst: rows.reduce((a, b) => (!a || Number(b.costR) < Number(a.costR) ? b : a), null),
    byRule: Object.entries(byRule).sort((a, b) => b[1] - a[1])
  };
}
function adherenceRate(trades = state.trades) {
  // Only trades that actually answered the question count. Counting a silent
  // trade as "not false" used to lift adherence on every MT5 import.
  const asked = trades.filter((t) => t.plan === true || t.plan === false);
  if (!asked.length) return null;
  return (asked.filter((t) => t.plan === true).length / asked.length) * 100;
}

/* ---------------------------- evidence gates ---------------------------- */

function rDrawdown(rows) {
  let cum = 0;
  let peak = 0;
  let trough = 0;
  rows.forEach((t) => {
    cum += Number.isFinite(Number(t.r)) ? Number(t.r) : 0;
    peak = Math.max(peak, cum);
    trough = Math.min(trough, cum - peak);
  });
  return Math.abs(trough);
}
function pairEvidence() {
  const c = charter();
  const groups = {};
  state.trades.forEach((t) => {
    const key = t.pair || '—';
    (groups[key] = groups[key] || []).push(t);
  });
  return Object.keys(groups).map((pair) => {
    const list = groups[pair].slice().sort(sortTradesAsc);
    const st = statsFor(list);
    const adherencePct = adherenceRate(list) ?? 0;
    const ddR = rDrawdown(list);
    const avgR = st.avgR == null ? 0 : st.avgR;
    const currency = tradeCurrency(list[0]);
    const gates = [
      { label: 'Sample', pass: st.count >= c.minPairSample, detail: `${st.count} of ${c.minPairSample} closed trades` },
      { label: 'Expectancy', pass: avgR > c.minPairExpectancyR, detail: `${avgR >= 0 ? '+' : ''}${avgR.toFixed(2)}R per trade against a ${c.minPairExpectancyR}R floor` },
      { label: 'Drawdown', pass: ddR <= c.maxPairDdR, detail: `${ddR.toFixed(1)}R peak-to-trough against a ${c.maxPairDdR}R cap` },
      { label: 'Adherence', pass: adherencePct >= c.minAdherencePct, detail: `${adherencePct.toFixed(0)}% on-plan against a ${c.minAdherencePct}% floor` },
      { label: 'Net after costs', pass: st.net > 0, detail: `${money(st.net, { sign: true, code: currency })} net` }
    ];
    return {
      pair, count: st.count, net: st.net, avgR, winRate: st.winRate, pf: st.profitFactor,
      maxDD: st.maxDD, ddR, adherencePct, gates, currency,
      passed: gates.filter((g) => g.pass).length,
      pass: gates.every((g) => g.pass)
    };
  }).sort((a, b) => (b.pass === a.pass ? b.net - a.net : (b.pass ? 1 : -1)));
}
function scaleGates() {
  const c = charter();
  const cur = tradingBase();
  const pairs = pairEvidence();
  const earned = pairs.filter((p) => p.pass);
  const streak = profitableMonthStreak(cur);
  const adh = adherenceRate(state.trades);
  const monthBreaches = breachSummary(currentMonthKey()).count;
  const runway = reserveRunway(cur);
  const unreviewed = unreviewedMoney().count;
  return [
    {
      label: 'Written charter adopted',
      pass: charterAdopted(),
      detail: charterAdopted() ? `Adopted ${fmtDate(c.adoptedOn)} · version ${c.version}` : 'Decisions are still defaults until you adopt them in writing'
    },
    {
      label: 'Profitable months',
      pass: streak.best >= c.minProfitMonths,

    },
    {

        ? `${earned.slice(0, 3).map((p) => p.pair).join(', ')} cleared every gate`
        : `No pair has cleared all ${pairs.length ? pairs[0].gates.length : 5} gates yet`
    },

    },

        ? `No operating costs recorded yet, so the ${runway.target}-month target cannot be measured`

    },

    }

}

function documentStatus(d, today = todayISO()) {
  if (!d.expiresOn) return { key: 'none', label: 'No expiry', tone: 'muted' };
  const days = daysBetween(today, d.expiresOn);
  if (days <= 0) return { key: 'expired', label: days === 0 ? 'Expires today' : `Expired ${Math.abs(days)}d ago`, tone: 'rose' };
  if (days <= 30) return { key: 'expiring', label: `Expires in ${days}d`, tone: 'amber' };
  return { key: 'current', label: `Valid · ${days}d left`, tone: 'mint' };
}
function complianceSummary() {
  const docs = state.documents;
  const expired = docs.filter((d) => documentStatus(d).key === 'expired');
  const expiring = docs.filter((d) => documentStatus(d).key === 'expiring');
  return {
    docs: [...docs].sort((a, b) => String(b.issuedOn || '').localeCompare(String(a.issuedOn || ''))),
    expired, expiring, count: docs.length, attention: expired.length + expiring.length
  };
}
function looksLikeCredential(text) { return CREDENTIAL_PATTERN.test(String(text || '')); }
function taxPackSummary(year = String(todayISO().slice(0, 4))) {
  const payouts = state.payouts.filter((p) => String(p.date || '').slice(0, 4) === year);

  return {

    payoutNet: sum(payouts, payoutNet),
    taxReserved: sum(payouts, payoutTax),

}

function healthScore() {
  const parts = [];

  const ruleAccounts = accountsWithMetrics().filter((m) => m.hasRules && !m.account.archived);
  let riskScore = 0;
  if (ruleAccounts.length) {
    const per = ruleAccounts.map((m) => {
      const daily = m.dailyLimitCents > 0 ? clamp(m.dailyRemainingCents / m.dailyLimitCents, 0, 1) : 1;
      const buffer = m.maxLossCents > 0 ? clamp(m.bufferCents / m.maxLossCents, 0, 1) : 1;
      return m.breached ? 0 : daily * 0.5 + buffer * 0.5;
    });
    riskScore = avg(per) * 25;
  }
  parts.push({
    key: 'risk', label: 'Risk discipline', value: riskScore, max: 25,
    detail: ruleAccounts.length ? 'Daily loss and drawdown buffers' : 'Add a prop account to track rules'
  });

  const months = lastMonths(6);
  const monthValues = months.map((mk) => monthFinancials(mk).income);
  const activeMonths = monthValues.filter((v) => v > 0).length;
  const mean = avg(monthValues.filter((v) => v > 0));
  const sd = mean > 0
    ? Math.sqrt(avg(monthValues.filter((v) => v > 0).map((v) => Math.pow(v - mean, 2))))
    : 0;
  const cv = mean > 0 ? sd / mean : 1;
  const consistency = clamp(1 - cv / 1.2, 0, 1);
  const monthsFactor = clamp(activeMonths / 4, 0, 1);
  const incomeScore = (monthsFactor * 0.55 + consistency * 0.45) * 20;
  parts.push({
    key: 'income', label: 'Income stability', value: incomeScore, max: 20,
    detail: activeMonths ? `${activeMonths} of 6 months with income` : 'No income logged yet'
  });

  const three = lastMonths(3).map((mk) => monthFinancials(mk));
  const income3 = sum(three, (f) => f.spendable);
  const spend3 = sum(three, (f) => f.expenses);
  const savingsRate3 = income3 > 0 ? (income3 - spend3) / income3 : 0;
  const savingsScore = clamp(savingsRate3 / 0.35, 0, 1) * 20;
  parts.push({
    key: 'savings', label: 'Savings rate', value: savingsScore, max: 20,
    detail: income3 > 0 ? `${pctRatio(savingsRate3, 0)} of take-home over 3 months` : 'No income logged yet'
  });

  const budget = budgetHealth();
  parts.push({
    key: 'budget', label: 'Budget discipline', value: budget.score, max: 15,
    detail: budget.detail
  });

  const em = emergencyGoal();
  const burn = monthlyBurn();
  const bufferRatio = em && burn > 0 ? clamp((Number(em.savedCents) || 0) / (burn * 3), 0, 1) : 0;
  parts.push({
    key: 'buffer', label: 'Buffer & runway', value: bufferRatio * 10, max: 10,
    detail: em ? `${(runwayMonths() || 0).toFixed(1)} months of expenses covered` : 'Create an emergency fund goal'
  });

  const literacy = clamp(state.lessonsDone.length / LESSONS.length, 0, 1) * 10;
  parts.push({
    key: 'literacy', label: 'Financial literacy', value: literacy, max: 10,
    detail: `${state.lessonsDone.length} of ${LESSONS.length} lessons completed`
  });

  const score = Math.round(sum(parts, (p) => p.value));
  let label = 'At risk';
  let tone = 'bad';
  if (score >= 85) { label = 'Elite'; tone = 'good'; }
  else if (score >= 72) { label = 'Strong'; tone = 'good'; }
  else if (score >= 58) { label = 'On track'; tone = 'info'; }
  else if (score >= 42) { label = 'Building'; tone = 'warn'; }
  return { score: clamp(score, 0, 100), label, tone, parts, savingsRate3, runway: runwayMonths() };
}

/* ---------------------------- projections ---------------------------- */

function projectPayouts({ sizeCents, monthlyReturnPct, splitPct, withdrawPct, months }) {
  let balance = Number(sizeCents) || 0;
  let cumulative = 0;
  const rows = [];
  const r = (Number(monthlyReturnPct) || 0) / 100;
  const split = (Number(splitPct) || 0) / 100;
  const withdraw = clamp((Number(withdrawPct) || 0) / 100, 0, 1);
  for (let m = 1; m <= months; m++) {
    const profit = balance * r;
    const payoutGross = profit > 0 ? profit * withdraw : 0;
    const payoutNet = payoutGross * split;
    balance += profit - payoutGross;
    cumulative += payoutNet;
    rows.push({
      month: m,
      balanceCents: Math.round(balance),
      payoutCents: Math.round(payoutNet),
      cumulativeCents: Math.round(cumulative)
    });
  }
  return { rows, endingBalanceCents: Math.round(balance), totalPayoutsCents: Math.round(cumulative) };
}

function compoundProjection({ initialCents, monthlyCents, annualPct, years }) {
  const months = Math.max(1, Math.round((Number(years) || 0) * 12));
  const monthlyRate = Math.pow(1 + (Number(annualPct) || 0) / 100, 1 / 12) - 1;
  let balance = Number(initialCents) || 0;
  let contributions = balance;
  const rows = [{ year: 0, balanceCents: Math.round(balance), contributionsCents: Math.round(contributions) }];
  for (let m = 1; m <= months; m++) {
    balance = balance * (1 + monthlyRate) + (Number(monthlyCents) || 0);
    contributions += Number(monthlyCents) || 0;
    if (m % 12 === 0) {
      rows.push({ year: m / 12, balanceCents: Math.round(balance), contributionsCents: Math.round(contributions) });
    }
  }
  return {
    rows,
    endingBalanceCents: Math.round(balance),
    contributionsCents: Math.round(contributions),
    growthCents: Math.round(balance - contributions)
  };
}

function requiredFundedCapital({ targetMonthlyCents, monthlyReturnPct, splitPct }) {
  const rate = (Number(monthlyReturnPct) || 0) / 100;
  const split = (Number(splitPct) || 0) / 100;
  if (rate <= 0 || split <= 0) return null;
  return Math.round((Number(targetMonthlyCents) || 0) / (rate * split));
}

function buildDemoTrade({ accountId, spec, index, riskUsd, feeUsd, date }) {
  const info = pairInfo(spec.pair);
  const dir = spec.direction === 'short' ? -1 : 1;
  const stopPips = spec.stopPips || 20;
  const entry = demoPrice(spec.pair, ((index % 7) - 3) * 4);
  const pips = spec.r * stopPips;
  const exit = roundTo(entry + dir * pips * info.pip, info.digits);
  const sl = roundTo(entry - dir * stopPips * info.pip, info.digits);
  const tp = roundTo(entry + dir * stopPips * 2 * info.pip, info.digits);
  const lots = roundTo(riskUsd / (stopPips * pipValueUsd(spec.pair, entry)), 3);
  const estPnlCents = Math.round(pips * pipValueUsd(spec.pair, exit) * lots * 100);
  return {
    id: uid('t'),
    accountId,
    date,
    pair: spec.pair,
    direction: spec.direction,
    entry, exit, sl, tp,
    finalSl: null,
    lots,
    pnlCents: estPnlCents,
    feesCents: Math.round(feeUsd * 100),
    r: spec.r,
    session: spec.session,
    grade: spec.grade,
    plan: spec.plan !== false,
    notes: spec.notes || '',

/* ============================================================
   LEDGERWISE FX — charts (hand-built SVG, zero dependencies)
   ============================================================ */

let chartSeq = 0;

function niceStep(raw) {
  if (!Number.isFinite(raw) || raw <= 0) return 1;
  const exp = Math.floor(Math.log10(raw));
  const f = raw / Math.pow(10, exp);
  let nf;
  if (f <= 1) nf = 1;
  else if (f <= 2) nf = 2;
  else if (f <= 2.5) nf = 2.5;
  else if (f <= 5) nf = 5;
  else nf = 10;
  return nf * Math.pow(10, exp);
}
function niceScale(min, max, ticks = 4) {
  let lo = Number(min) || 0;
  let hi = Number(max) || 0;
  if (lo === hi) { hi = lo + 10000; }
  const step = niceStep((hi - lo) / ticks);
  return {
    min: Math.floor(lo / step) * step,
    max: Math.ceil(hi / step) * step,
    step
  };
}
function axisLabelCents(v, code) {
  const abs = Math.abs(v);
  if (abs === 0) return currencySymbol(code) + '0';
  return money(v, { compact: true, code });
}
function svgPointGroups(points) {
  const n = points.length;
  if (!n) return [];
  if (n <= 8) return points.map((p) => ({ ...p, showLabel: true }));
  const shown = new Set();
  for (let k = 0; k < 6; k += 1) shown.add(Math.round(k * (n - 1) / 5));
  return points.map((p, i) => ({ ...p, showLabel: shown.has(i) }));
}

function drawBarChart(el, rows, cfg = {}) {
  if (!el) return;
  const w = Math.max(280, el.clientWidth || 600);
  const h = cfg.height || 280;
  const series = cfg.series || [
    { key: 'income', label: 'Income', color: 'var(--mint)' },
    { key: 'expenses', label: 'Expenses', color: 'var(--amber)' }
  ];
  const pad = { l: 46, r: 8, t: 14, b: 30 };
  const iw = w - pad.l - pad.r;
  const ih = h - pad.t - pad.b;
  const values = rows.flatMap((r) => (r.values || []).map((v) => Number(v) || 0));
  const maxValue = Math.max(0, ...values);
  const scale = niceScale(0, maxValue || 10000, 4);
  const y = (v) => pad.t + ih - ((Number(v) || 0) - scale.min) / (scale.max - scale.min) * ih;
  const baseline = y(0);
  let svg = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.aria || 'Bar chart')}">`;

  // grid + y labels
  for (let v = scale.min; v <= scale.max + 0.001; v += scale.step) {
    const yy = y(v);
    svg += `<line class="chart-grid-line" x1="${pad.l}" y1="${yy.toFixed(1)}" x2="${w - pad.r}" y2="${yy.toFixed(1)}"></line>`;
    svg += `<text class="chart-axis-text" x="${pad.l - 9}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${esc(axisLabelCents(v, cfg.code))}</text>`;
  }
  svg += `<line class="chart-baseline" x1="${pad.l}" y1="${baseline.toFixed(1)}" x2="${w - pad.r}" y2="${baseline.toFixed(1)}"></line>`;

  if (!rows.length) {
    el.innerHTML = svg + '</svg>';
    return;
  }

  const groupW = iw / rows.length;
  const gap = 4;
  const barW = Math.min(30, Math.max(7, (groupW - 20) / series.length - gap));
  const totalW = series.length * barW + (series.length - 1) * gap;

  rows.forEach((row, i) => {
    const start = pad.l + groupW * i + (groupW - totalW) / 2;
    row.values.forEach((value, si) => {
      const v = Number(value) || 0;
      const yy = y(v);
      const bh = Math.max(0, baseline - yy);
      if (v !== 0) {
        const color = series[si].color;
        const label = `${row.label} · ${series[si].label}: ${money(v, { code: cfg.code })}`;
        svg += `<rect class="chart-bar" x="${(start + si * (barW + gap)).toFixed(1)}" y="${yy.toFixed(1)}" width="${barW.toFixed(1)}" height="${Math.max(2, bh).toFixed(1)}" rx="4" fill="${color}" opacity="0.92"><title>${esc(label)}</title></rect>`;
      }
    });
    svg += `<text class="chart-axis-text" x="${(pad.l + groupW * i + groupW / 2).toFixed(1)}" y="${(h - 10).toFixed(1)}" text-anchor="middle">${esc(row.label)}</text>`;
  });

  svg += '</svg>';
  el.innerHTML = svg;
}

function drawLineChart(el, points, cfg = {}) {
  if (!el) return;
  const w = Math.max(280, el.clientWidth || 600);
  const h = cfg.height || 260;
  const pad = { l: 48, r: 12, t: 16, b: 28 };
  const iw = w - pad.l - pad.r;
  const ih = h - pad.t - pad.b;
  const values = points.map((p) => Number(p.value) || 0);
  if (!points.length) { el.innerHTML = ''; return; }
  let minV = Math.min(0, ...values);
  let maxV = Math.max(0, ...values);
  if (minV === maxV) { maxV = minV + 10000; }
  const scale = niceScale(minV, maxV, 4);
  const x = (i) => points.length === 1 ? pad.l + iw / 2 : pad.l + (i / (points.length - 1)) * iw;
  const y = (v) => pad.t + ih - ((v - scale.min) / (scale.max - scale.min)) * ih;
  const id = 'lg' + (++chartSeq);
  const color = cfg.color || 'var(--mint)';
  let svg = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.aria || 'Line chart')}">`;
  svg += `<defs><linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0%" stop-color="${color}" stop-opacity="0.22"/><stop offset="100%" stop-color="${color}" stop-opacity="0"/></linearGradient></defs>`;

  for (let v = scale.min; v <= scale.max + 0.001; v += scale.step) {
    const yy = y(v);
    svg += `<line class="chart-grid-line" x1="${pad.l}" y1="${yy.toFixed(1)}" x2="${w - pad.r}" y2="${yy.toFixed(1)}"></line>`;
    svg += `<text class="chart-axis-text" x="${pad.l - 9}" y="${(yy + 3).toFixed(1)}" text-anchor="end">${esc(axisLabelCents(v, cfg.code))}</text>`;
  }

  const zeroY = y(0);
  const pts = points.map((p, i) => `${x(i).toFixed(1)},${y(p.value).toFixed(1)}`).join(' L ');
  svg += `<path d="M ${x(0).toFixed(1)},${zeroY.toFixed(1)} L ${pts} L ${x(points.length - 1).toFixed(1)},${zeroY.toFixed(1)} Z" fill="url(#${id})"></path>`;
  svg += `<path d="M ${pts.replace(/ /g, ' ')}" fill="none" stroke="${color}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"></path>`;

  const labeled = svgPointGroups(points);
  labeled.forEach((p, i) => {
    if (p.showLabel) {
      const xx = x(i);
      svg += `<text class="chart-axis-text" x="${xx.toFixed(1)}" y="${h - 8}" text-anchor="${i === 0 ? 'start' : i === points.length - 1 ? 'end' : 'middle'}">${esc(p.label)}</text>`;
    }
  });

  // last point marker
  const lastX = x(points.length - 1);
  const lastY = y(points[points.length - 1].value);
  svg += `<circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="6" fill="${color}" opacity="0.15"></circle>`;
  svg += `<circle cx="${lastX.toFixed(1)}" cy="${lastY.toFixed(1)}" r="3" fill="${color}"></circle>`;

  // hover markers (native titles)
  if (points.length <= 40) {
    points.forEach((p, i) => {
      svg += `<circle cx="${x(i).toFixed(1)}" cy="${y(p.value).toFixed(1)}" r="7" fill="transparent"><title>${esc(p.title || `${p.label}: ${money(p.value)}`)}</title></circle>`;
    });
  }

  svg += '</svg>';
  el.innerHTML = svg;
}

function drawHistogram(el, values, cfg = {}) {
  if (!el) return;
  const w = Math.max(280, el.clientWidth || 500);
  const h = cfg.height || 180;
  const pad = { l: 10, r: 10, t: 14, b: 24 };
  const iw = w - pad.l - pad.r;
  const ih = h - pad.t - pad.b;
  if (!values.length) { el.innerHTML = ''; return; }
  let lo = Math.min(-20, ...values);
  let hi = Math.max(20, ...values);
  lo = Math.max(-100, Math.floor(lo / 10) * 10);
  hi = Math.min(300, Math.ceil(hi / 10) * 10);
  if (hi - lo < 20) hi = lo + 20;
  const bins = 22;
  const width = (hi - lo) / bins;
  const counts = new Array(bins).fill(0);
  values.forEach((v) => {
    const idx = clamp(Math.floor((v - lo) / width), 0, bins - 1);
    counts[idx] += 1;
  });
  const maxCount = Math.max(1, ...counts);
  const barW = iw / bins;
  const zeroX = pad.l + ((0 - lo) / (hi - lo)) * iw;
  let svg = `<svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${esc(cfg.aria || 'Outcome distribution histogram')}">`;
  svg += `<line class="chart-baseline" x1="${pad.l}" y1="${pad.t + ih}" x2="${w - pad.r}" y2="${pad.t + ih}"></line>`;
  svg += `<line class="chart-grid-line" x1="${zeroX.toFixed(1)}" y1="${pad.t}" x2="${zeroX.toFixed(1)}" y2="${pad.t + ih}"></line>`;
  counts.forEach((c, i) => {
    const bh = (c / maxCount) * ih;
    const bx = pad.l + i * barW + 1;
    const binStart = lo + i * width;
    const color = binStart < 0 ? 'var(--rose)' : 'var(--mint)';
    svg += `<rect x="${bx.toFixed(1)}" y="${(pad.t + ih - bh).toFixed(1)}" width="${Math.max(1, barW - 2).toFixed(1)}" height="${bh.toFixed(1)}" rx="2" fill="${color}" opacity="0.7"><title>${binStart.toFixed(0)}% to ${(binStart + width).toFixed(0)}%: ${c} runs</title></rect>`;
  });
  svg += `<text class="chart-axis-text" x="${pad.l}" y="${h - 6}" text-anchor="start">${lo}%</text>`;
  svg += `<text class="chart-axis-text" x="${zeroX.toFixed(1)}" y="${h - 6}" text-anchor="middle">0%</text>`;
  svg += `<text class="chart-axis-text" x="${w - pad.r}" y="${h - 6}" text-anchor="end">${hi}%+</text>`;
  svg += '</svg>';
  el.innerHTML = svg;
}

        }
      }
      const el = document.getElementById('cashflow-chart');
      if (el) {

          label: m.label, values: [m.income, m.expenses]
        })), { height: 292, code: homeCode(), aria: 'Income and expenses over the last six months' });
      }
    }
    if (page === 'trades') {
      const el = document.getElementById('equity-curve');
      if (el) {
        const filtered = filteredTrades();
        const st = statsFor(filtered);
        drawLineChart(el, st.curve.map((p, i) => ({

          value: p.value,
          title: `${i === 0 ? 'Start' : fmtDate(p.date)} · ${money(p.value, { sign: true })}`
        })), { height: 244, aria: 'Cumulative trade P&L curve' });
      }
    }
    if (page === 'income') {
      const el = document.getElementById('income-chart');
      if (el) {
        const rows = lastMonths(6).map((mk) => {
          const p = sum(state.payouts.filter((x) => monthKeyOf(x.date) === mk), payoutHomeNet);
          const o = sum(state.incomes.filter((x) => monthKeyOf(x.date) === mk), incomeHome);
          return { label: monthLabel(mk, true), values: [p, o] };
        });
        drawBarChart(el, rows, {
          height: 238,
          series: [
            { key: 'payouts', label: 'Payouts', color: 'var(--mint)' },
            { key: 'other', label: 'Other income', color: 'var(--sky)' }
          ],
          code: homeCode(),
          aria: 'Payouts and other income over the last six months'
        });
      }
    }
    if (page === 'growth') {
      if (typeof drawGrowthCharts === 'function') drawGrowthCharts();

    if (page === 'risk') {
      const el = document.getElementById('sim-chart');

    }
    if (page === 'desk') {
      // no canvas charts
    }
  });
}

const DESK_RANGES = [['all', 'All time'], ['month', 'This month'], ['d30', 'Last 30 days']];

function deskBoard() {
  const metrics = accountsWithMetrics();
  if (!metrics.length) return null;
  return { metrics, picked: metrics.find((m) => m.account.id === ui.desk.accountId) || metrics[0] };
}

function deskCurve(m) {
  const code = accountCurrency(m.account);
  let rows = Array.isArray(m.runningEquity) ? m.runningEquity.slice() : [];
  if (ui.desk.range === 'month') rows = rows.filter((r) => monthKeyOf(r.date) === currentMonthKey());
  else if (ui.desk.range === 'd30') {
    const cut = isoOf(new Date(Date.now() - 29 * 86400000));
    rows = rows.filter((r) => String(r.date) >= cut);
  }
  if (!rows.length) {
    return [{ label: 'no trades', value: m.equity, title: `Nothing closed in this window · ${money(m.equity, { code })}` }];
  }
  return rows.map((r) => ({
    label: fmtDateShort(r.date),
    value: r.value,
    title: `${fmtDate(r.date)} · ${money(r.value, { code })}`
  }));
}

function deskTile(iconName, label, value, foot, tone) {
  return `
    <div class="tile">
      <div class="tile-top"><span class="tile-ic">${icon(iconName, 12)}</span><span class="tile-label">${esc(label)}</span></div>
      <div class="tile-val${tone ? ' ' + tone : ''}">${value}</div>
      <div class="tile-foot">${foot}</div>
    </div>`;
}

function ruleState(ratio, breachedNow) {
  if (breachedNow || ratio >= 1) return { tone: 'bad', word: 'Breached' };
  if (ratio >= 0.8) return { tone: 'bad', word: 'Danger' };
  if (ratio >= 0.5) return { tone: 'warn', word: 'Watch' };
  return { tone: '', word: 'Safe' };
}

function ruleRowHTML(title, usedCents, limitCents, code, st, leftText, accId) {
  const ratio = limitCents > 0 ? clamp(usedCents / limitCents, 0, 1) : 0;
  return `
    <div class="rule">
      <div class="rule-head">
        <span class="rule-title">${esc(title)}</span>
        <span class="rule-state ${st.tone}"><span class="rule-dot"></span>${st.word}</span>
      </div>
      <div class="progress thicker${st.tone ? ' ' + st.tone : ''}"><span style="width:${(ratio * 100).toFixed(1)}%"></span></div>
      <div class="rule-foot">
        <span class="rule-used">${limitCents > 0
          ? `${money(usedCents, { code })} / ${money(limitCents, { code })} used (${pct(ratio * 100)})`
          : 'No limit entered for this account'}</span>
        <span class="rule-left">${limitCents > 0
          ? esc(leftText)
          : `<button class="btn-link" data-act="edit-account" data-id="${esc(accId)}">Add the rule</button>`}</span>
      </div>
    </div>`;
}

function rulesPanelHTML(m) {
  const code = accountCurrency(m.account);
  const dailyBreached = m.dailyLimitCents > 0 && m.dailyUsedCents >= m.dailyLimitCents;
  const daily = ruleState(m.dailyUsedPct, dailyBreached);
  const ddUsed = m.maxLossCents > 0 ? Math.max(0, m.maxLossCents - m.bufferCents) : 0;
  const ddRatio = m.maxLossCents > 0 ? clamp(ddUsed / m.maxLossCents, 0, 1) : 0;
  // m.breached covers either rule, so the drawdown row gets its own test —
  // otherwise a daily-limit hit wrongly paints the drawdown as breached too.
  const dd = ruleState(ddRatio, m.maxLossCents > 0 && m.bufferCents <= 0);
  const score = ruleState(clamp((100 - m.healthScore) / 100, 0, 1), m.breached);
  const worst = m.dailyUsedPct > ddRatio ? 'the daily loss limit' : 'the max drawdown';
  const scoreCopy = m.trades.length === 0
    ? 'Nothing at risk yet. The score starts full and only moves once trades are logged on this account.'
    : m.breached
      ? 'A rule is already through — this account is out of good standing until the firm resets it.'
      : score.tone === 'warn'
        ? `Headroom is thinning, and ${worst} is what is eating it fastest.`
        : 'Both limits still have room. The number is headroom only — grade, size and discipline do not move it.';
  return `
    <section class="card">
      <div class="card-head">
        <div>
          <div class="card-title">Account rules &amp; limits</div>
          <div class="card-sub">Read live off your logged trades — this is what the firm would show.</div>
        </div>
        <div class="card-actions">
          <button class="btn btn-sm btn-ghost" data-act="edit-account" data-id="${esc(m.account.id)}">${icon('edit', 12)} Rules</button>
        </div>
      </div>
      <div class="desk-score">
        <div class="score-ring gold" style="--p:${m.healthScore}"><div class="score-num">${m.healthScore}</div></div>
        <div>
          <div class="rule-title">Desk score<span class="rule-state ${score.tone}" style="margin-left:8px"><span class="rule-dot"></span>${score.word}</span></div>
          <div class="desk-score-copy">${esc(scoreCopy)}</div>
        </div>
      </div>
      ${ruleRowHTML('Daily loss limit', m.dailyUsedCents, m.dailyLimitCents, code, daily, `${money(m.dailyRemainingCents, { code })} left today`, m.account.id)}
      ${ruleRowHTML(m.account.ddBasis === 'trailing' ? 'Max drawdown · trailing' : 'Max drawdown · static', ddUsed, m.maxLossCents, code, dd, `${money(Math.max(0, m.bufferCents), { code })} of buffer left`, m.account.id)}
      <div class="rule-sum">
        <span>Equity floor</span>
        <b>${money(m.floorCents, { code })}</b>
        <span class="muted">· ${m.account.ddBasis === 'trailing' ? 'peak ' + money(m.peak, { code }) + ' − ' + money(m.maxLossCents, { code }) : 'start − ' + money(m.maxLossCents, { code })}</span>
      </div>
    </section>`;
}

function fundingPanelHTML(m) {
  const code = accountCurrency(m.account);
  const achieved = Math.max(0, m.profitSinceStart);
  const p = clamp(m.targetProgress, 0, 1);
  const targetBlock = m.targetCents > 0 ? `

      <div class="fund-rows">

        <div><span>Achieved</span><b class="${achieved > 0 ? 'pos' : ''}">${money(achieved, { code })}</b></div>
        <div><span>Remaining</span><b>${money(Math.max(0, m.targetCents - achieved), { code })}</b></div>

      <div class="fund-flag ${m.payoutEligible ? 'ok' : ''}">${m.payoutEligible

function pfGaugeHTML(pf) {
  // Semicircle arc: radius 30, so the half-circumference is pi*30.
  const arc = 94.25;
  const num = pf == null ? 0 : (Number.isFinite(pf) ? pf : 3);
  const frac = clamp(num / 3, 0, 1);
  return `
    <div class="gauge">
      <svg viewBox="0 0 70 44" width="92" height="58" aria-hidden="true">
        <path d="M 5 40 A 30 30 0 0 1 65 40" fill="none" stroke="var(--track)" stroke-width="7" stroke-linecap="round"></path>
        <path d="M 5 40 A 30 30 0 0 1 65 40" fill="none" stroke="var(--gold)" stroke-width="7" stroke-linecap="round" stroke-dasharray="${(frac * arc).toFixed(2)} ${arc.toFixed(2)}"></path>
      </svg>
      <div class="gauge-val">${pfLabel(pf)}</div>
      <div class="gauge-label">Profit factor</div>
    </div>`;
}

/* ============================ TRADES ============================ */

function btLane() { return ui.trades.lane === 'bt'; }
function laneTrades() { return btLane() ? state.btTrades : state.trades; }

function filteredTrades() {
  const f = ui.trades;
  return laneTrades().filter((t) => {
    if (!btLane() && f.account !== 'all' && t.accountId !== f.account) return false;
    if (f.setup !== 'all' && (t.setup || '—') !== f.setup) return false;
    if (f.pair !== 'all' && t.pair !== f.pair) return false;
    if (f.session !== 'all' && (t.session || 'Other') !== f.session) return false;
    if (f.grade !== 'all' && (t.grade || '—') !== f.grade) return false;
    if (f.month !== 'all' && monthKeyOf(t.date) !== f.month) return false;
    if (f.from && String(t.date || '') < f.from) return false;
    if (f.to && String(t.date || '') > f.to) return false;
    if (f.band !== 'all' && hourBandKey(t.startHM) !== f.band) return false;
    if (f.result !== 'all') {
      const net = tradeNet(t);
      if (f.result === 'win' && net <= 0) return false;
      if (f.result === 'loss' && net >= 0) return false;
      if (f.result === 'flat' && net !== 0) return false;
    }
    return true;
  });
}

function pairBreakdown(byPair) {
  const rows = Object.values(byPair).sort((a, b) => b.net - a.net).slice(0, 5);
  if (!rows.length) return '<div class="tiny muted">No trades in this filter.</div>';
  return rows.map((r) => `
    <div class="side-list-row">
      <div class="k"><span class="mono">${esc(r.key)}</span></div>
      <div class="v ${r.net >= 0 ? 'pos' : 'neg'}">${money(r.net, { sign: true })} <span class="muted">· ${r.count}</span></div>
    </div>`).join('');
}

function pageNumList(page, count) {
  if (count <= 7) return Array.from({ length: count }, (_, i) => i + 1);
  const lo = Math.max(2, page - 1);
  const hi = Math.min(count - 1, page + 1);
  const out = [1];
  if (lo > 2) out.push('gap');
  for (let i = lo; i <= hi; i++) out.push(i);
  if (hi < count - 1) out.push('gap');
  out.push(count);
  return out;
}

function tradesPagerHTML({ total, page, perPage, rowStart, unit }) {
  const pageCount = Math.max(1, Math.ceil(total / perPage));
  const shown = Math.min(perPage, total - rowStart);
  const pages = pageNumList(page, pageCount).map((n) => n === 'gap'
    ? '<span class="pg-gap">…</span>'
    : `<button class="pg-btn${n === page ? ' active' : ''}" data-act="trades-page" data-n="${n}"${n === page ? ' aria-current="page"' : ''}>${n}</button>`).join('');
  return `
    <div class="pager">
      <div class="pager-info">
        Rows <b class="num">${rowStart + 1}–${rowStart + shown}</b> of <b class="num">${total}</b> ${unit}s
      </div>
      <div class="pager-ctrl">
        <label class="pager-size">
          <span>Per page</span>
          <select class="select" data-act="trade-filter" data-key="perPage" aria-label="Rows per page">
            ${TRADE_PAGE_SIZES.map((n) => `<option value="${n}"${n === perPage ? ' selected' : ''}>${n}</option>`).join('')}
          </select>
        </label>
        ${pageCount > 1 ? `
        <div class="pager-pages">
          <button class="pg-btn nav" data-act="trades-page" data-n="${page - 1}"${page <= 1 ? ' disabled' : ''} aria-label="Previous page">${icon('chevronLeft', 14)}</button>
          ${pages}
          <button class="pg-btn nav" data-act="trades-page" data-n="${page + 1}"${page >= pageCount ? ' disabled' : ''} aria-label="Next page">${icon('chevronRight', 14)}</button>
        </div>` : `<div class="pager-pages tiny muted">One page — all ${total} in view</div>`}
      </div>
    </div>`;
}

/* ============================ INCOME ============================ */

function payoutStatusBadge(p) {
  if (p.status === 'converted') return p.rateSource === 'estimate'
    ? '<span class="badge badge-amber no-dot">Converted · est.</span>'
    : '<span class="badge badge-mint no-dot">Household cash</span>';
  if (p.status === 'received') return '<span class="badge badge-sky no-dot">Received</span>';
  if (p.status === 'sent') return '<span class="badge no-dot">Sent</span>';
  return '<span class="badge no-dot">Expected</span>';
}

function renderIncome() {
  const yf = yearFinancials();
  const tax = taxReservedTotal();
  const expected = expectedPayoutTotal();
  const funded = fundedMetrics();
  const fin = monthFinancials();
  const payouts = [...state.payouts].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const incomes = [...state.incomes].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const ytdNet = yf.income - yf.tax;
  const queue = unreviewedMoney();
  const bridging = payouts.filter((p) => p.status !== 'converted');
  const home = homeCode();

  const engineHTML = funded.length ? funded.map((m) => {
    const cur = accountCurrency(m.account);
    return `
    <div class="account-row">
      <div class="account-avatar alt">${m.account.name.slice(0, 1).toUpperCase()}</div>
      <div class="account-main">
        <div class="account-name">${esc(m.account.name)}</div>
        <div class="account-meta">Cycle profit ${money(m.cycleNet, { code: cur })} · ${m.splitPct}% split · ${m.cycleDays} active day${m.cycleDays === 1 ? '' : 's'}</div>
      </div>
      <div class="account-side">
        <div class="account-equity">${money(m.expectedPayoutCents, { code: cur })}</div>
        <div class="account-delta ${m.payoutEligible ? 'pos' : 'muted'}">${m.payoutEligible ? 'Available' : m.breached ? 'Blocked by breach' : 'Not yet eligible'}</div>
      </div>
      <button class="btn btn-sm ${m.payoutEligible ? 'btn-primary' : 'btn-ghost'}" data-act="add-payout" data-account="${m.account.id}">Record</button>
    </div>`;
  }).join('') : emptyBlock({
    iconName: 'desk',
    title: 'No funded account',
    text: 'Payouts and splits are only tracked for funded or personal accounts. Add one on the prop desk.',
    cta: 'Open prop desk',
    act: 'go-desk'
  });

  const bridgeHTML = bridging.length ? bridging.map((p) => {
    const acc = accountById(p.accountId);
    const cur = payoutCurrency(p);
    const next = p.status === 'expected' ? 'sent' : p.status === 'sent' ? 'received' : 'converted';
    return `
      <div class="account-row">
        <div class="account-main">
          <div class="account-name">${esc(acc ? acc.name : 'Unassigned')} <span class="sub" style="display:inline;margin:0">${fmtDate(p.date, { year: false })}</span></div>
          <div class="account-meta">${esc(p.note || 'No note')}${p.reference ? ` · ref ${esc(p.reference)}` : ''}</div>
        </div>
        <div class="account-side">
          <div class="account-equity">${money(payoutNet(p), { code: cur })}</div>
          <div class="account-delta muted">${p.status === 'converted' ? 'cash' : `not ${home} cash yet`}</div>
        </div>
        <button class="btn btn-sm btn-ghost" data-act="payout-advance" data-id="${p.id}">${next === 'converted' ? 'Convert' : 'Advance'}</button>
      </div>`;
  }).join('') : '<div class="table-empty"><div class="tiny muted">Nothing in flight. Payouts you mark as Expected or Sent appear here until the money actually lands.</div></div>';

  const payoutRows = payouts.length ? payouts.map((p) => {
    const acc = accountById(p.accountId);
    const cur = payoutCurrency(p);
    const net = payoutNet(p);
    const hn = payoutHomeNet(p);
    const htax = payoutHomeTax(p);
    const homeCell = hn != null

function saveCurrencyReview(form) {
  const fd = new FormData(form);
  const home = homeCode();
  let fixed = 0;
  state.payouts.forEach((p) => {
    if (payoutHomeNet(p) != null || p.status !== 'converted') return;
    const rate = numOrNull(fd.get(`rate_${p.id}`));
    if (rate && rate > 0) {
      const base = (p.receivedCents > 0 && p.receivedCurrency === home) ? p.receivedCents : payoutNet(p);
      p.rate = rate;
      p.rateSource = 'manual';
      p.homeCents = Math.round(base * rate);
      p.fxNeedsReview = false;
      fixed += 1;
    }
  });
  state.incomes.forEach((i) => {
    if (incomeHome(i) != null) return;
    const cur = String(fd.get(`cur_${i.id}`) || '');
    if (!CURRENCIES[cur]) return;
    i.currency = cur;
    i.currencyUnreviewed = false;
    if (cur === home) { i.homeCents = i.amountCents; fixed += 1; return; }
    const rate = numOrNull(fd.get(`rate_${i.id}`));
    if (rate && rate > 0) { i.rate = rate; i.homeCents = Math.round(i.amountCents * rate); fixed += 1; }
  });
  state.expenses.forEach((e) => {
    if (expenseHome(e) != null) return;
    const cur = String(fd.get(`cur_${e.id}`) || '');
    if (!CURRENCIES[cur]) return;
    e.currency = cur;
    e.currencyUnreviewed = false;
    if (cur === home) { e.homeCents = e.amountCents; fixed += 1; return; }
    const rate = numOrNull(fd.get(`rate_${e.id}`));
    if (rate && rate > 0) { e.rate = rate; e.homeCents = Math.round(e.amountCents * rate); fixed += 1; }
  });
  if (!fixed) { toast('No rates were entered — records stay out of household totals.', 'info'); return; }
  logAudit('settings', `Reviewed currency on ${fixed} record${fixed === 1 ? '' : 's'}`);
  commit(`${fixed} record${fixed === 1 ? '' : 's'} now counted in household money.`, ui.page);
}

function handlePayoutAdvance(id) {
  const p = state.payouts.find((x) => x.id === id);
  if (!p) return;
  if (p.status === 'expected') {
    p.status = 'sent';
    logAudit('payout', `Marked payout of ${fmtDate(p.date)} as sent by the firm`);
    commit('Marked as sent — still not household cash until it lands.', ui.page);
  } else if (p.status === 'sent') {
    p.status = 'received';
    logAudit('payout', `Marked payout of ${fmtDate(p.date)} as received in the clearing account`);
    commit('Marked received. Convert it once the final amount and rate are known.', ui.page);
  } else {
    openPayoutModal(p.id);
  }
}
/* ============================================================
   LEDGERWISE FX — Setup watch
   ============================================================ */

function watchPad(n) { return String(Math.floor(Math.abs(n))).padStart(2, '0'); }

// Session hours are stored in UTC; this converts one edge to the laptop clock
// so an armed window reads the same in Nairobi as it does in London.
function utcHMToLocal(dateISO, utcHM) {
  const d = String(dateISO || todayISO()).split('-').map(Number);
  const t = String(utcHM).split(':').map(Number);
  const dt = new Date(Date.UTC(d[0], d[1] - 1, d[2], t[0], t[1]));
  return watchPad(dt.getHours()) + ':' + watchPad(dt.getMinutes());
}

function watchInstant(dateISO, hm) {
  const ms = new Date(String(dateISO || todayISO()) + 'T' + String(hm || '00:00') + ':00').getTime();
  return Number.isFinite(ms) ? ms : NaN;
}

function watchStartMs(item) { return watchInstant(item.date, item.from); }
function watchEndMs(item) { return watchInstant(item.date, item.to); }
function watchArmed(item) { return item.status === 'armed'; }

function watchLive(item) {
  if (!watchArmed(item)) return false;
  const now = Date.now();
  const a = watchStartMs(item);
  const b = watchEndMs(item);
  return Number.isFinite(a) && Number.isFinite(b) && now >= a && now <= b;
}

function watchDue(item) {
  if (!watchArmed(item)) return false;
  const b = watchEndMs(item);
  return Number.isFinite(b) && Date.now() > b;
}

function watchUpcoming(item) {
  if (!watchArmed(item)) return false;
  const a = watchStartMs(item);
  return Number.isFinite(a) && Date.now() < a;
}

function watchSpanText(item) {
  const mins = Math.round((watchEndMs(item) - watchStartMs(item)) / 60000);
  if (!Number.isFinite(mins) || mins <= 0) return 'window not set';
  const h = Math.floor(mins / 60);
  return h ? `${h}h ${watchPad(mins % 60)}m` : `${mins}m`;
}

function watchCountdown(item) {
  const now = Date.now();
  if (watchLive(item)) {
    const left = Math.max(0, Math.round((watchEndMs(item) - now) / 60000));
    return left <= 0 ? 'closing now' : `${left} min left in the window`;
  }
  if (watchUpcoming(item)) {
    const till = Math.round((watchStartMs(item) - now) / 60000);
    return till >= 60 ? `opens in ${Math.floor(till / 60)}h ${watchPad(till % 60)}m` : `opens in ${till} min`;
  }
  if (watchDue(item)) {
    const late = Math.round((now - watchEndMs(item)) / 60000);
    if (late >= 1440) return `closed ${Math.round(late / 1440)} days ago`;
    if (late >= 60) return `closed ${Math.floor(late / 60)}h ago`;
    return `closed ${late} min ago`;
  }
  return 'window closed';
}

function watchAll() {
  return [...state.watch].sort((a, b) => {
    const d = String(b.date).localeCompare(String(a.date));
    return d !== 0 ? d : String(b.from || '').localeCompare(String(a.from || ''));
  });
}

function watchPending() {
  return state.watch.filter(watchDue).sort((a, b) => watchStartMs(a) - watchStartMs(b));
}

function watchLiveNow() {
  return state.watch.filter(watchLive).sort((a, b) => watchEndMs(a) - watchEndMs(b));
}

function watchNextUp() {
  return state.watch.filter(watchUpcoming).sort((a, b) => watchStartMs(a) - watchStartMs(b))[0] || null;
}

function watchLastPair() {
  const recent = watchAll()[0];
  if (recent && recent.pair) return recent.pair;
  const counts = {};
  state.trades.forEach((t) => { counts[t.pair] = (counts[t.pair] || 0) + 1; });
  const best = Object.keys(counts).sort((a, b) => counts[b] - counts[a])[0];
  return best && PAIR_OPTIONS.includes(best) ? best : 'EUR/USD';
}

// The session whose local window contains now, so arming starts on the window
// he is actually sitting in instead of a blank dropdown.
function watchCurrentSession() {
  const today = todayISO();
  for (const s of SESSIONS) {
    const win = SESSION_UTC[s];
    if (!win) continue;
    const a = watchInstant(today, utcHMToLocal(today, win[0]));
    const b = watchInstant(today, utcHMToLocal(today, win[1]));
    const now = Date.now();
    if (Number.isFinite(a) && Number.isFinite(b) && now >= a && now <= b) return s;
  }
  return 'London';
}

function watchReasonCounts(list) {
  const out = {};
  Object.keys(MISS_REASONS).forEach((k) => { out[k] = 0; });
  list.forEach((w) => {
    if (w.status === 'missed' && out[w.reason] !== undefined) out[w.reason] += 1;
  });
  return out;
}

// The plan-action gap counts only the misses where he wrote down what price
// actually did. Unknown outcomes are counted separately, never guessed.
function watchGap(list) {
  let r = 0;
  let known = 0;
  let unknown = 0;
  let saved = 0;
  list.forEach((w) => {
    if (w.status !== 'missed') return;
    if (w.outcome === 'target') { r += Number(w.plannedR) || 0; known += 1; }
    else if (w.outcome === 'stop') { saved += 1; known += 1; }
    else unknown += 1;
  });
  return { r: roundTo(r, 2), known, unknown, saved };
}

function watchMonthList(mk) { return state.watch.filter((w) => monthKeyOf(w.date) === mk); }

// Fear at the trigger is a fear-of-entry event; lost focus is a missed entry.
function watchFearType(reason) {
  return reason === 'focus' ? 'missed' : reason === 'fear' ? 'entry' : 'other';
}

function watchFearPreset(id) {
  const w = state.watch.find((x) => x.id === id);
  if (!w) return null;
  return {
    type: watchFearType(w.reason || ''),
    date: w.date,
    costR: w.plannedR || '',
    fromWatch: true,
    note: `${w.pair} ${w.direction === 'short' ? 'short' : 'long'} · ${w.trigger}`.slice(0, 280)
  };
}

function watchTradePreset(id) {
  const w = state.watch.find((x) => x.id === id);
  if (!w) return null;
  const followed = w.journal && w.journal.followed;
  return {
    pair: w.pair,
    direction: w.direction,
    date: w.date,
    session: w.session,
    fromWatch: true,
    watchId: w.id,
    plannedR: w.plannedR == null ? null : w.plannedR,
    // The close-out already asked whether the rules held. Carrying the answer
    // keeps the trade and the window telling one story instead of two.
    plan: followed === 'yes' ? true : followed === 'no' ? false : null,
    setup: String(w.trigger || '').slice(0, 60),
    // The grade came from the check answered before the window opened. Carried
    // across locked, so logging the outcome cannot revise the setup.
    checks: Array.isArray(w.checks) ? w.checks : null,
    ckLocked: Array.isArray(w.checks) && !!w.grade
  };
}

// The arm-time chart hangs off the window, not the trade: it is taken before
// there is a trade, and it is what proves the trigger was readable off the chart.
function watchShotBtn(item) {
  const n = shotsOf(item.id).length;
  return `<button class="btn-icon" data-act="evidence" data-id="${item.id}" title="${n ? `${n} chart picture${n === 1 ? '' : 's'} on this window` : 'Attach the chart as it looks now'}" aria-label="Chart at arm time">${icon('camera', 13)}${n ? '<span class="shot-dot"></span>' : ''}</button>`;
}

// The three close-out answers, compact, so the row shows what was said without
// opening anything. Nothing here is invented — it is his own wording back to him.
function journalLineHTML(w) {
  const j = w && w.journal;
  if (!j) return '';
  const bits = [];
  if (CLOSEOUT_MARKET[j.cond]) bits.push(esc(CLOSEOUT_MARKET[j.cond]));
  if (CLOSEOUT_EXIT[j.exit]) bits.push(`exit: ${esc(CLOSEOUT_EXIT[j.exit])}`);
  if (j.followed === 'yes') bits.push('rules held');
  else if (j.followed === 'no') bits.push('<b>rule broke</b>');
  return bits.length ? `<div class="tiny muted" style="margin-top:3px">${bits.join(' · ')}</div>` : '';
}

function watchRowHTML(item) {
  const st = WATCH_STATUS[item.status] || WATCH_STATUS.armed;
  const live = watchLive(item);
  const due = watchDue(item);
  const reason = item.reason && MISS_REASONS[item.reason] ? MISS_REASONS[item.reason].label : '';
  const outcome = item.outcome && MISS_OUTCOMES[item.outcome] ? MISS_OUTCOMES[item.outcome].label : '';
  const clock = `${item.from || '—'}–${item.to || '—'}`;
  return `
    <div class="side-list-row watch-row" style="align-items:flex-start">
      <div class="k">

function watchReasonBars(reasons) {
  const entries = Object.keys(reasons).filter((k) => reasons[k] > 0).sort((a, b) => reasons[b] - reasons[a]);
  if (!entries.length) {
    return '<div class="tiny muted">No missed setups recorded this month yet. When one gets away, close the window out and say why — that is the whole job.</div>';
  }
  const max = reasons[entries[0]];
  return entries.map((k) => {
    const pct = Math.round((reasons[k] / max) * 100);
    const tone = k === 'fear' ? 'var(--rose)' : k === 'focus' ? 'var(--amber)' : 'var(--sky)';
    return `
      <div class="watch-bar-row">
        <div class="watch-bar-label">${esc(MISS_REASONS[k].label)}</div>
        <div class="watch-bar-track"><div class="watch-bar-fill" style="width:${pct}%;background:${tone}"></div></div>
        <div class="watch-bar-num">${reasons[k]}</div>
      </div>`;
  }).join('');
}

    date: (preset && preset.date) || today,
    pair: (preset && preset.pair) || watchLastPair(),
    direction: 'long', session,

  };
  const fields = `
    <div class="form-grid">

      <div class="field"><label for="wa-pair">Instrument <span class="req">*</span></label><select class="select" id="wa-pair" name="pair">${pairOptions(w.pair)}</select></div>
