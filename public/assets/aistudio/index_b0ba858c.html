function openRiskLadderModal(accountId) {
  const acc = accountById(accountId);
  if (!acc) return;
  const basePct = accountBaseRiskPct(acc);
  const hasLadder = Array.isArray(acc.riskLadder) && acc.riskLadder.length > 0;
  const fallback = [
    { thresholdPct: 1, riskPct: 0.5 },
    { thresholdPct: 2, riskPct: 0.3 },
    { thresholdPct: 3, riskPct: 0.2 },
    { thresholdPct: 4, riskPct: 0 }
  ];
  const rows = hasLadder || acc.riskLadderSet
    ? [...(acc.riskLadder || [])].sort((a, b) => a.thresholdPct - b.thresholdPct)
    : fallback;
  const rowFields = [0, 1, 2, 3].map((i) => {
    const r = rows[i] || {};
    const t = r.thresholdPct != null ? r.thresholdPct : '';
    const p = r.riskPct != null ? r.riskPct : '';
    return `
      <div class="field"><label for="rl-t${i}">Step ${i + 1} · at drawdown</label><div class="input-affix suffix"><input class="input" id="rl-t${i}" name="t${i}" type="number" step="0.1" min="0" max="100" value="${fieldValue(t)}" placeholder="${i + 1}"><span class="affix">%</span></div></div>
      <div class="field"><label for="rl-r${i}">Step ${i + 1} · risk per trade</label><div class="input-affix suffix"><input class="input" id="rl-r${i}" name="r${i}" type="number" step="0.05" min="0" max="100" value="${fieldValue(p)}" placeholder="${i === 3 ? '0' : (0.5 / (i + 1)).toFixed(2)}"><span class="affix">%</span></div></div>`;
  }).join('');
  const fields = `
    <div class="form-grid">
      <div class="field full"><label for="rl-base">Normal risk per trade</label><div class="input-affix suffix"><input class="input" id="rl-base" name="baseRisk" type="number" step="0.05" min="0" max="100" value="${fieldValue(basePct)}"><span class="affix">%</span></div><div class="hint">What you risk when the account is at or above its starting equity.</div></div>
      <div class="form-section-title">Drawdown ladder</div>
      ${rowFields}
      <div class="form-note">Each step applies once drawdown reaches it, and the deepest step reached wins. Drawdown is measured ${acc.ddBasis === 'trailing' ? 'from peak equity (trailing)' : 'from the starting balance (static)'}, in line with this account's drawdown basis. Set a step's risk to 0 to stand down.</div>
    </div>`;
  formModal({
    title: 'Risk rules',
    sub: `${acc.name} · shrink risk as drawdown deepens instead of pressing.`,
    fields, submitLabel: 'Save risk rules',
    formKey: 'risk-ladder', wide: true,
    hidden: `<input type="hidden" name="id" value="${acc.id}">`
  });
}

function saveRiskLadder(form) {
  const fd = new FormData(form);
  const acc = accountById(String(fd.get('id') || ''));
  if (!acc) return;
  const baseRaw = numOrNull(fd.get('baseRisk'));
  const basePct = baseRaw == null ? 0 : clamp(baseRaw, 0, 100);
  const rows = [];
  for (let i = 0; i < 4; i++) {
    const tRaw = String(fd.get(`t${i}`) ?? '').trim();
    const pRaw = String(fd.get(`r${i}`) ?? '').trim();
    if (tRaw === '' && pRaw === '') continue;
    if (tRaw === '' || pRaw === '') { toast(`Step ${i + 1} needs both a drawdown and a risk value, or leave it blank.`, 'error'); return; }
    const t = numOrNull(fd.get(`t${i}`));
    const p = numOrNull(fd.get(`r${i}`));
    if (t == null || t <= 0) { toast('Each drawdown step must be above 0%.', 'error'); return; }
    if (p == null || p < 0) { toast('Risk cannot be negative.', 'error'); return; }
    if (p > basePct) { toast(`Risk at ${t}% drawdown is above your normal risk. A ladder should only reduce risk.`, 'error'); return; }
    rows.push({ thresholdPct: Math.round(t * 100) / 100, riskPct: Math.round(p * 100) / 100 });
  }
  if (rows.length && basePct <= 0) { toast('Set a normal risk above 0% before adding drawdown steps.', 'error'); return; }
  rows.sort((a, b) => a.thresholdPct - b.thresholdPct);
  for (let i = 1; i < rows.length; i++) {
    if (rows[i].thresholdPct === rows[i - 1].thresholdPct) { toast('Two steps use the same drawdown level.', 'error'); return; }
  }
  acc.baseRiskPct = basePct;
  acc.riskLadder = rows;
  acc.riskLadderSet = true;
  logAudit('account', `Updated risk ladder for ${acc.name}`);
  commit('Risk rules saved.', 'desk');
}

function saveFearImport(form) {
  const fd = new FormData(form);
  const parsed = parseFearCard(fd.get('card'));
  if (parsed.error) { toast(parsed.error, 'error'); return; }
  const card = parsed.card;
  const ownName = String(state.settings.name || '').trim();
  if (ownName && ownName.toLowerCase() === card.name.toLowerCase()) {
    toast(`That is your own card — it is signed "${card.name}", which is the name in your settings. Paste the card your partner sent you.`, 'error');
    return;
  }
  state.fearImports = state.fearImports.filter((p) => !(p.name.toLowerCase() === card.name.toLowerCase() && p.month === card.month));
  state.fearImports.push({ id: uid('fearimp'), ...card, importedAt: new Date().toISOString() });
  state.settings.partnerName = card.name;
  ui.fearMonth = card.month;
  logAudit('fear', `Imported ${card.name}'s card for ${monthLabel(card.month)}`);
  commit(`Imported ${card.name}'s ${monthLabel(card.month)} card.`, 'fear');
}

function payoutCalcHTML(form, accountId) {
  if (!form) return '';
  const get = (n) => { const el = form.elements.namedItem(n); return el ? el.value : ''; };
  const acc = accountById(accountId || get('accountId'));
  const cur = accountCurrency(acc);
  const home = homeCode();
  const gross = centsFrom(get('gross'));
  const split = numFrom(get('split'));
  const fee = centsFrom(get('fee'));
  const taxPct = numFrom(get('taxPct'));
  const net = Math.round(gross * split / 100) - fee;
  const tax = Math.round(net * taxPct / 100);
  const status = ['expected', 'sent', 'received', 'converted'].includes(get('status')) ? get('status') : 'converted';
  const receivedCents = centsFrom(get('received'));
  const recCur = CURRENCIES[get('receivedCurrency')] ? get('receivedCurrency') : cur;
  const rate = numFrom(get('rate'));
  const rateSource = ['actual', 'manual', 'estimate'].includes(get('rateSource')) ? get('rateSource') : 'manual';
  const metric = acc ? calcAccount(acc) : null;
  const nM = (c) => money(c, { code: cur });
  let bridge;
  if (status !== 'converted') {
    bridge = `<div><div class="k">Household cash</div><div class="v muted">0</div></div>`;
  } else if (recCur === home && receivedCents > 0) {
    bridge = `<div><div class="k">Household cash</div><div class="v pos">${money(receivedCents, { code: home })}</div></div>`;
  } else if (rate > 0) {
    const base = receivedCents > 0 ? receivedCents : net;
    const h = Math.round(base * rate);
    bridge = `<div><div class="k">Household cash ${rateSource === 'estimate' ? '(est.)' : ''}</div><div class="v ${rateSource === 'estimate' ? 'warn' : 'pos'}">${money(h, { code: home })}</div></div>`;
  } else {
    bridge = `<div><div class="k">Household cash</div><div class="v warn">needs rate</div></div>`;
  }
  return `
    <div class="calc-preview" style="grid-template-columns:repeat(4,1fr)">
      <div><div class="k">Your split</div><div class="v">${nM(net)}</div></div>
      <div><div class="k">Tax reserve</div><div class="v warn">−${nM(tax)}</div></div>
      <div><div class="k">Take-home</div><div class="v pos">${nM(net - tax)}</div></div>
      ${bridge}
    </div>
    <div class="form-note full" style="font-size:10.5px">
      ${status === 'converted'
        ? `Only after conversion does this become household money (${home}). The rate is locked on the record — future rate changes never rewrite it.`
        : `Status "${status}" is tracked in the bridge but is not household cash yet. Set the status to Converted when the money actually lands.`}
      ${metric ? ` ${esc(acc.name)} cycle profit is ${money(metric.cycleNet, { code: cur })} and its split is ${metric.splitPct}%. Gross payouts reduce account equity.` : ''}
    </div>`;
}

function moneyRateFields(cur, rate, home) {
  return `
    <div class="field" id="mr-wrap"${cur === home ? ' style="display:none"' : ''}><label for="mr-rate" id="mr-label">Locked rate (${esc(home)} per 1 ${esc(cur)})</label>
      <input class="input" id="mr-rate" name="rate" type="number" step="0.0001" min="0" value="${fieldValue(rate == null ? '' : rate)}">
      <div class="hint">The rate you actually got. Stored on this record — never recalculated from today's market.</div>
    </div>
    <div class="field" id="mr-preview-wrap"${cur === home ? ' style="display:none"' : ''}><label>&nbsp;</label><div class="form-note" style="font-size:10.5px" id="mr-preview">Household equivalent appears once you enter a rate.</div></div>`;
}
function moneyRatePreview(form) {
  const preview = document.getElementById('mr-preview');
  if (!preview || !form) return;
  const curEl = form.elements.namedItem('currency');
  const cur = curEl ? curEl.value : homeCode();
  const home = homeCode();
  if (cur === home) { preview.textContent = ''; return; }
  const amountEl = form.elements.namedItem('amount');
  const amount = centsFrom(amountEl ? amountEl.value : 0);
  const rateEl = form.elements.namedItem('rate');
  const rate = rateEl ? numFrom(rateEl.value) : 0;
  if (!(rate > 0) || amount <= 0) { preview.textContent = 'Household equivalent appears once you enter a rate.'; return; }
  preview.textContent = `≈ ${money(Math.round(amount * rate), { code: home })} at your locked rate of ${rate}.`;
}

/* ---------------------------- day sheet ---------------------------- */

function dayClockOf(ms) {
  if (!Number.isFinite(ms)) return '';
  const d = new Date(ms);
  return pad2(d.getHours()) + ':' + pad2(d.getMinutes());
}

// The window worth arming right now: the session open on this laptop, else the
// next one today, else the first one tomorrow.
function daySessionPreset() {
  const today = todayISO();
  const now = Date.now();
  const windows = SESSIONS
    .filter((s) => SESSION_UTC[s])
    .map((s) => ({
      session: s,
      from: utcHMToLocal(today, SESSION_UTC[s][0]),
      to: utcHMToLocal(today, SESSION_UTC[s][1])
    }))
    .map((w) => ({ ...w, open: watchInstant(today, w.from), close: watchInstant(today, w.to) }))
    .filter((w) => Number.isFinite(w.open) && Number.isFinite(w.close))
    .sort((a, b) => a.open - b.open);
  if (!windows.length) return { date: today, session: 'London', logSession: 'London', from: '', to: '', pair: watchLastPair(), label: 'Today' };
  const live = windows.find((w) => now >= w.open && now <= w.close);
  const next = windows.find((w) => w.open > now);
  if (live || next) {
    const w = live || next;
    return {
      date: today, session: w.session, logSession: w.session, from: w.from, to: w.to, pair: watchLastPair(),
      label: live ? `${w.session} is open until ${dayClockOf(w.close)}` : `${w.session} opens at ${dayClockOf(w.open)}`
    };
  }
  const first = windows[0];
  const last = windows[windows.length - 1];
  const tomorrow = addDaysISO(today, 1);
  const from = utcHMToLocal(tomorrow, SESSION_UTC[first.session][0]);
  return {
    date: tomorrow, session: first.session, logSession: last.session,
    from, to: utcHMToLocal(tomorrow, SESSION_UTC[first.session][1]),
    pair: watchLastPair(),
    label: `Tomorrow · ${first.session} opens ${dayClockOf(watchInstant(tomorrow, from))}`
  };
}

const dayDutyTaken = new Set();

function dayDutyFor(keywords, cadence) {
  const list = activeDuties().filter((d) => (!cadence || d.cadence === cadence) && !dayDutyTaken.has(d.id));
  const hit = list.find((d) => keywords.some((k) => String(d.title || '').toLowerCase().includes(k))) || null;
  if (hit) dayDutyTaken.add(hit.id);
  return hit;
}

function dayFacts() {
  const today = todayISO();
  const month = currentMonthKey();
  const c = charter();
  const tradesToday = state.trades.filter((t) => t.date === today);
  const monthTrades = state.trades.filter((t) => monthKeyOf(t.date) === month);
  const daily = activeDuties().filter((d) => d.cadence === 'daily');
  const weekly = activeDuties().filter((d) => d.cadence === 'weekly');
  const weekStart = mondayOf(today);
  return {
    today, month, c, tradesToday,
    rToday: roundTo(sum(tradesToday, (t) => Number(t.r) || 0), 2),
    btToday: state.btTrades.filter((t) => t.date === today).length,
    fearToday: state.fearCards.filter((f) => f.date === today),
    breachMonth: state.breaches.filter((b) => monthKeyOf(b.date) === month).length,
    shotsToday: state.shots.filter((s) => String(s.at || '').slice(0, 10) === today).length,
    expensesToday: state.expenses.filter((e) => e.date === today).length,
    armedToday: state.watch.filter((w) => w.date === today && w.status === 'armed').length,
    liveNow: watchLiveNow().length,
    pending: watchPending(),
    daily, weekly,
    dailyDone: daily.filter((d) => dutyIsDone(d, today)).length,
    weeklyDone: weekly.filter((d) => dutyIsDone(d, today)).length,
    reviewThisWeek: state.reviews.some((r) => String(r.date || '') >= weekStart),
    adherence: adherenceRate(monthTrades),
    basket: moneyBasket(),
    blankCampaigns: state.backtests.filter((b) => !Number(b.sample) || Number(b.sample) <= 0).length
  };
}

// The wall is read in the morning, so the newest mistakes come first — and the
// ones with no line written yet come before the ones already answered.
function mistakeWallHTML() {
  const items = wallItems();

  const week = retired.filter((i) => weekKeyOf(wallDayOf(i.fixedAt)) === weekKeyOf(todayISO()));

  const rows = shown.map((i) => `

  const bits = [];
  if (open.length) bits.push(`${open.length} line${open.length === 1 ? '' : 's'} still open — they stay here until ticked.`);
  if (week.length) bits.push(`${week.length} retired into this week's review.`);
  else if (retired.length) bits.push(`${retired.length} retired so far.`);
  if (needs.length) bits.push(`${needs.length} mistake${needs.length === 1 ? '' : 's'} still without a line.`);
  const older = wallItems(true).filter((i) => !i.fixedAt && !isWithinWallWindow(i.date)).length;
  if (older) bits.push(`${older} older ${older === 1 ? 'one' : 'ones'} live only in the breach register — the wall holds the last ${WALL_MONTHS} months.`);
  const foot = `<div class="tiny muted" style="margin-top:10px">${bits.join(' ')}</div>`;
  return `
    <section class="card mt-14">
      <div class="card-head">

      </div>
      ${shown.length || retired.length ? foot : ''}
    </section>`;
}

// The wall is the same register seen from the morning rather than the month: a
// fix line is written against a mistake, and once it holds it retires into the
// weekly review instead of being deleted.
const WALL_SHOWN = 7;
const WALL_MONTHS = 2;

function wallKeyParts(key) {
  const i = String(key || '').indexOf('_');
  return { kind: String(key || '').slice(0, i), id: String(key || '').slice(i + 1) };
}
// fixedAt is a timestamp; the week bucketing only reads the date part.
function wallDayOf(iso) {
  return String(iso || '').slice(0, 10);
}
function wallTarget(key) {
  const p = wallKeyParts(key);
  if (p.kind === 'trade') return state.trades.find((t) => t.id === p.id) || null;
  if (p.kind === 'watch') return state.watch.find((w) => w.id === p.id) || null;
  if (p.kind === 'breach') return state.breaches.find((b) => b.id === p.id) || null;
  return null;
}
function isWithinWallWindow(dateISO) {
  if (!isDateISO(dateISO)) return false;
  const monthsAgo = addDaysISO(todayISO(), -31 * WALL_MONTHS);
  return dateISO >= monthsAgo;
}
function wallQuestion(item) {
  if (item.src === 'Trade') return `${item.pair}: what do you do differently next time an entry like this shows up?`;
  if (item.src === 'Window') return `${item.pair}: you said a rule broke in the close-out. One line on what you do differently.`;
  return `${item.rule}: one line on what you do differently.`;
}
function weekKeyOf(iso) {
  if (!isDateISO(iso)) return '';
  const d = new Date(`${iso}T12:00:00`);
  if (Number.isNaN(d.getTime())) return '';
  const day = (d.getDay() + 6) % 7;
  const monday = addDaysISO(iso, -day);
  return monday.slice(0, 7);
}

function wallItems(all) {
  const out = [];
  const loggedWindows = new Set();
  state.trades.forEach((t) => {
    if (t.plan === false) {
      if (t.watchId) loggedWindows.add(t.watchId);
      out.push({
        key: `trade_${t.id}`, date: t.date, pair: t.pair, rule: 'Off-plan entry', src: 'Trade',
        detail: String(t.notes || ''), fix: String((t.wall && t.wall.fix) || ''),
        fixedAt: (t.wall && t.wall.fixedAt) || ''
      });
    }
  });
  state.watch.forEach((w) => {
    if (!w.journal || w.journal.followed !== 'no' || loggedWindows.has(w.id)) return;
    out.push({
      key: `watch_${w.id}`, date: w.date, pair: w.pair, rule: 'Rule broke at close-out', src: 'Window',
      detail: String(w.note || ''), fix: String((w.wall && w.wall.fix) || ''),
      fixedAt: (w.wall && w.wall.fixedAt) || ''
    });
  });
  // Anything added by hand belongs on the wall until it has a line, fixed or
  // not. Journal-derived rows are already carried by their own trade entry.
  state.breaches.forEach((b) => {
    if (b.source === 'journal') return;
    out.push({
      key: `breach_${b.id}`, date: b.date, pair: '', rule: b.rule, src: 'Register',
      detail: String(b.note || ''), fix: String(b.fix || ''), fixedAt: b.fixedAt || ''
    });
  });
  return (all ? out : out.filter((i) => i.fixedAt || isWithinWallWindow(i.date)))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)));
}

// The line lives on the record that broke the rule, so deleting the trade or the
// window takes its wall entry with it — nothing has to be kept in sync twice.
function wallStore(key, patch) {
  const rec = wallTarget(key);
  if (!rec) return false;
  const p = wallKeyParts(key);
  if (p.kind === 'breach') Object.assign(rec, patch);
  else rec.wall = { ...(rec.wall || {}), ...patch };
  return true;
}

function saveWallFix(form) {

  if (!wallStore(key, { fix, writtenAt: new Date().toISOString() })) { toast('That record is no longer in the journal.', 'error'); return; }
  logAudit('wall', `Wall line written for ${key}`);
  commit('On the wall. It opens the Day sheet tomorrow until you tick it.', 'day', 'success');

function markWallFixed(key) {
  const item = wallItems().find((i) => i.key === key);
  if (!item) { toast('That record is no longer in the journal.', 'error'); return; }
  if (!item.fix) { toast('Nothing to tick yet — the wall line comes first.', 'error'); return; }
  if (!wallStore(key, { fixedAt: new Date().toISOString() })) { toast('That record is no longer in the journal.', 'error'); return; }
  logAudit('wall', `Wall line retired: ${item.fix}`);
  commit(`Ticked. "${item.fix}" leaves the morning list and goes into this week's review.`, 'day', 'success');
}

// What the wall did this week, said in the review rather than in a nag: lines
// ticked off are retired here, lines still open stay on the Day sheet.
function wallReviewLine() {
  const items = wallItems();
  const wk = weekKeyOf(todayISO());
  const retired = items.filter((i) => i.fixedAt && weekKeyOf(wallDayOf(i.fixedAt)) === wk);
  const still = items.filter((i) => !i.fixedAt && i.fix);
  if (!retired.length && !still.length) return '';
  const said = retired.map((r) => `“${esc(String(r.fix).slice(0, 90))}”`).join(', ');
  return `<div class="full"><div class="form-note" style="font-size:10.5px">Wall: ${retired.length ? `${retired.length} line${retired.length === 1 ? '' : 's'} ticked off this week — ${said}.` : 'nothing ticked off this week.'}${still.length ? ` ${still.length} still open on the Day sheet.` : ' Nothing left open.'}</div></div>`;
}

/* ---------------------------- this week's plan ---------------------------- */

// The plan is the ledger's own verdict, written down before the next trade
// rather than after it. Nothing in here is invented: every line is a count of
// records already in the journal. The gate explains itself out loud, and the
// override is allowed — it just has to sign itself into the breach register.

function weekPlan() {
  const p = (state.settings && state.settings.weekPlan) || {};
  const rawCap = p.maxPerDay == null || p.maxPerDay === '' ? 0 : Number(p.maxPerDay);
  return {
    on: !!p.on,
    until: isDateISO(p.until) ? String(p.until) : '',
    pairs: Array.isArray(p.pairs) ? p.pairs.filter((x) => PAIR_OPTIONS.includes(x)) : [],
    sessions: Array.isArray(p.sessions) ? p.sessions.filter((x) => SESSIONS.includes(x) && x !== 'Other') : [],
    maxPerDay: Number.isFinite(rawCap) ? clamp(Math.round(rawCap), 0, 20) : 2,
    blockGrades: Array.isArray(p.blockGrades) ? p.blockGrades.filter((g) => GRADES.includes(g)) : []
  };
}

function weekPlanLive() {
  const p = weekPlan();
  return p.on && !!p.until && todayISO() <= p.until;
}

// Four cuts of the same records, because the plan can only be set from what
// the journal actually has: pairs, sessions, grades, and the day's volume.
function weekPlanEvidence(days = 35) {
  const from = daysAgoISO(days);
  const st = statsFor(state.trades.filter((t) => String(t.date || '') >= from));
  const cut = (map, dropOther) => Object.values(map)
    .filter((r) => r.count && r.key && r.key !== '—' && !(dropOther && r.key === 'Other'))
    .sort((a, b) => b.net - a.net);
  const pairs = cut(st.byPair, false);
  const sessions = cut(st.bySession, true);
  const grades = cut(st.byGrade, false).sort((a, b) => String(a.key).localeCompare(String(b.key)));
  const byDay = Object.create(null);
  st.rows.forEach((t) => { const k = String(t.date || ''); (byDay[k] = byDay[k] || []).push(t); });
  const heavy = Object.values(byDay).filter((l) => l.length >= 3);
  const light = Object.values(byDay).filter((l) => l.length < 3);
  const heavyTrades = sum(heavy, (l) => l.length);
  const neverPaid = grades.filter((g) => g.count >= 3 && g.wins === 0);
  return {
    days, st, pairs, sessions, grades,
    heavyDays: heavy.length,
    heavyTrades,
    heavyNet: sum(heavy.reduce((a, l) => a.concat(l), []), (t) => t.net),
    lightNet: sum(light.reduce((a, l) => a.concat(l), []), (t) => t.net),
    neverPaid,
    suggest: {
      pairs: pairs.filter((r) => r.net > 0 && r.count >= 2).map((r) => r.key),
      sessions: sessions.filter((r) => r.net > 0).map((r) => r.key),
      blockGrades: neverPaid.map((g) => g.key),
      maxPerDay: heavy.length >= 2 && sum(heavy.reduce((a, l) => a.concat(l), []), (t) => t.net) < 0 ? 2 : 0
    }
  };
}

function weekPlanRow(list, key) { return list.filter((r) => r.key === key)[0] || null; }

function weekPlanCountOn(date, excludeTradeId) {
  return state.trades.filter((t) => String(t.date || '') === date && t.id !== excludeTradeId).length;
}

// Every blocker carries its own number, so a refusal can be argued with.
function weekPlanBlockers(ctx) {
  if (!weekPlanLive()) return [];
  const p = weekPlan();
  const ev = weekPlanEvidence();
  const out = [];
  if (ctx.pair && p.pairs.length && !p.pairs.includes(ctx.pair)) {
    const row = weekPlanRow(ev.pairs, ctx.pair);
    out.push({
      rule: 'Pair outside the plan',
      text: row
        ? `${ctx.pair} returned ${money(row.net, { sign: true })} over ${row.count} ${row.count === 1 ? 'trade' : 'trades'} (${row.wins} won) in the last ${ev.days} days. This week's list is ${p.pairs.join(', ')}.`
        : `${ctx.pair} is not on this week's list (${p.pairs.join(', ')}), and the journal has no record of it paying.`
    });
  }
  if (ctx.session && ctx.session !== 'Other' && p.sessions.length && !p.sessions.includes(ctx.session)) {
    const row = weekPlanRow(ev.sessions, ctx.session);
    out.push({
      rule: 'Session outside the plan',
      text: row
        ? `${ctx.session} is ${money(row.net, { sign: true })} over ${row.count} ${row.count === 1 ? 'trade' : 'trades'} in the last ${ev.days} days, and it is not on this week's list (${p.sessions.join(', ')}).`
        : `${ctx.session} is not on this week's session list (${p.sessions.join(', ')}).`
    });
  }
  if (p.maxPerDay > 0 && isDateISO(ctx.date)) {
    const already = weekPlanCountOn(ctx.date, ctx.excludeTradeId || '');
    if (already >= p.maxPerDay) {
      out.push({
        rule: 'Daily trade cap reached',
        text: `${fmtDateShort(ctx.date)} already has ${already} ${already === 1 ? 'trade' : 'trades'} and the plan stops at ${p.maxPerDay}.${ev.heavyNet < 0 ? ` The days you took three or more cost ${money(ev.heavyNet, { sign: true })} across ${ev.heavyTrades} trades.` : ''}`
      });
    }
  }
  if (ctx.grade && p.blockGrades.includes(ctx.grade)) {
    const row = weekPlanRow(ev.grades, ctx.grade);
    out.push({
      rule: `Grade ${ctx.grade} is blocked`,
      text: row
        ? `${row.count} ${row.count === 1 ? 'trade' : 'trades'} graded ${ctx.grade} in the last ${ev.days} days, ${row.wins} of them won, for ${money(row.net, { sign: true })}. The check said ${ctx.grade} before price moved, and the money agrees with it.`
        : `Grade ${ctx.grade} is on this week's blocked list.`
    });
  }
  return out;
}

// The refusal is shown where the decision was being made, not as a toast that
// disappears — and the way through is a box that has to be ticked on purpose.
function weekPlanRefuse(form, blockers) {
  let box = form.querySelector('.plan-block');
  if (!box) {
    box = document.createElement('div');
    box.className = 'plan-block';
    const grid = form.querySelector('.form-grid');
    if (grid) grid.insertAdjacentElement('afterend', box);
    else form.appendChild(box);
  }
  box.innerHTML = `
    <div class="plan-block-head">${icon('shield', 14)} The plan says no, and it says why</div>
    ${blockers.map((b) => `<div class="plan-block-line"><b>${esc(b.rule)}.</b> ${esc(b.text)}</div>`).join('')}
    <label class="check" style="margin-top:8px">
      <input type="checkbox" name="plan-override" value="yes">
      <span><b>Do it anyway.</b> It goes into the breach register with these reasons attached, and onto the Day sheet wall until you write the one line.</span>
    </label>`;
  const cb = box.querySelector('input');
  if (cb) { cb.scrollIntoView({ block: 'center' }); cb.focus(); }
  toast('Nothing was saved. Tick the box under the reason if this week is not the week to hold the line.', 'error');
}

function weekPlanBreach(blockers, ctx) {
  state.breaches.push({
    id: uid('br'),
    date: isDateISO(ctx.date) ? ctx.date : todayISO(),
    rule: String(blockers[0].rule).slice(0, 60),
    tradeId: ctx.tradeId || '',
    accountId: ctx.accountId || '',
    note: blockers.map((b) => b.text).join(' · ').slice(0, 280),
    costR: null,
    costCents: 0,
    currency: tradingBase(),
    source: 'manual',
    fix: '',
    fixedAt: '',
    createdAt: new Date().toISOString()
  });
}

function saveWeekPlan(form) {
  const fd = new FormData(form);
  const pairs = (fd.getAll('pairs') || []).filter((x) => PAIR_OPTIONS.includes(x));
  const sessions = (fd.getAll('sessions') || []).filter((x) => SESSIONS.includes(x) && x !== 'Other');
  const blockGrades = (fd.getAll('grades') || []).filter((g) => GRADES.includes(g));
  const on = fd.get('on') === 'yes';
  const until = String(fd.get('until') || '');
  const capRaw = String(fd.get('maxPerDay') ?? '').trim();
  const cap = capRaw === '' ? 0 : clamp(Math.round(numFrom(capRaw)), 0, 20);
  if (on && !isDateISO(until)) {
    toast('Pick the day this plan stops holding. An open-ended rule is the one that gets quietly ignored.', 'error');
    const el = form.querySelector('[name="until"]');
    if (el) el.focus();
    return;
  }
  if (on && !pairs.length && !sessions.length && !cap && !blockGrades.length) {
    toast('The gate is switched on but nothing is being gated. Tick a pair, a session, a grade, or set a daily cap.', 'error');
    return;
  }
  state.settings.weekPlan = { on, until: isDateISO(until) ? until : '', pairs, sessions, maxPerDay: cap, blockGrades };
  closeModal();
  const parts = [];
  if (pairs.length) parts.push(`${pairs.length} ${pairs.length === 1 ? 'pair' : 'pairs'}`);
  if (sessions.length) parts.push(`${sessions.length} ${sessions.length === 1 ? 'session' : 'sessions'}`);
  if (cap) parts.push(`${cap}/day`);
  if (blockGrades.length) parts.push(`no grade ${blockGrades.join('/')}`);
  commit(on ? `Plan set until ${fmtDateShort(until)}: ${parts.join(' · ') || 'nothing gated'}.` : 'Plan saved as a note — the gate is off.', 'day');
}

function fillWeekPlanFromLedger() {
  const form = document.querySelector('form[data-form="week-plan"]');
  if (!form) { openWeekPlanModal(weekPlanEvidence().suggest); return; }
  const s = weekPlanEvidence().suggest;
  form.querySelectorAll('[name="pairs"], [name="sessions"], [name="grades"]').forEach((cb) => {
    const list = cb.name === 'pairs' ? s.pairs : cb.name === 'sessions' ? s.sessions : s.blockGrades;
    cb.checked = list.includes(cb.value);
  });
  const cap = form.querySelector('[name="maxPerDay"]');
  if (cap) cap.value = s.maxPerDay;
  const on = form.querySelector('[name="on"]');
  if (on) on.checked = true;
  toast('Filled from the ledger. Read the numbers beside each name and change any of them — it is your call, not the average\'s.', 'info');
}

function weekPlanCardHTML() {
  const p = weekPlan();
  const live = weekPlanLive();
  const ev = weekPlanEvidence();
  const todayCount = weekPlanCountOn(todayISO(), '');
  const chips = [];
  if (p.pairs.length) chips.push(`<span class="chip">${esc(p.pairs.join(' · '))}</span>`);
  if (p.sessions.length) chips.push(`<span class="chip">${esc(p.sessions.join(' · '))}</span>`);
  if (p.maxPerDay) chips.push(`<span class="chip">${p.maxPerDay} a day</span>`);
  if (p.blockGrades.length) chips.push(`<span class="chip">no grade ${esc(p.blockGrades.join('/'))}</span>`);
  const room = p.maxPerDay ? Math.max(0, p.maxPerDay - todayCount) : null;
  const evidence = ev.st.count
    ? `From ${ev.st.count} trades in ${ev.days} days: ${money(ev.st.net, { sign: true })} overall${ev.heavyDays ? `, and ${money(ev.heavyNet, { sign: true })} of it on the ${ev.heavyDays} ${ev.heavyDays === 1 ? 'day' : 'days'} you took three or more` : ''}.`
    : 'Nothing in the log yet, so the plan starts as a promise rather than a measurement.';
  return `
    <section class="card mt-14">
      <div class="card-head">
        <div>
          <div class="card-title">This week's plan</div>
          <div class="card-sub">Pairs, sessions and a daily cap — decided once, then enforced at the click.</div>
        </div>
        <div class="card-actions">
          <span class="badge ${live ? 'badge-mint' : 'badge-amber'} no-dot">${live ? `holds to ${fmtDateShort(p.until)}` : p.on ? 'expired' : 'not set'}</span>
          ${live ? `<button class="btn btn-sm btn-ghost" data-act="week-plan">Change</button><button class="btn btn-sm btn-ghost" data-act="week-plan-off" title="Keep the plan on the page, stop the refusals">Stop refusing</button>` : `<button class="btn btn-sm" data-act="week-plan">${icon('edit', 13)} ${p.pairs.length || p.sessions.length ? 'Review' : 'Set the plan'}</button>`}
        </div>
      </div>

      ${chips.length ? `<div class="tiny muted" style="margin-top:8px">${esc(evidence)}</div>` : ''}
      ${live ? `<div class="plan-room ${room === 0 ? 'is-shut' : ''}">
        <span>${room > 0 ? `${room} ${room === 1 ? 'trade' : 'trades'} of the daily cap still open today` : room === 0 ? 'The cap for today is spent. Anything further is a breach, not a trade.' : 'No cap set for today.'}</span>
        <span class="tiny muted">${todayCount} recorded on ${fmtDateShort(todayISO())}</span>
      </div>` : ''}
    </section>`;
}

function gateBadge(pass) {
  return pass
    ? '<span class="badge badge-mint no-dot">Pass</span>'
    : '<span class="badge badge-rose no-dot">Not yet</span>';
}
function poolLabel(code) { return (POOL_KEYS[code] || { label: code }).label; }

function businessStatement(mk) {
  const cur = {};
  const ensure = (code) => {
    if (!cur[code]) {
      cur[code] = { currency: code, trades: 0, grossPnl: 0, fees: 0, net: 0, payoutGross: 0, payoutNet: 0, payoutTax: 0, distributable: 0, payouts: 0 };
      PAYOUT_ALLOC_POOLS.forEach((p) => { cur[code][`alloc_${p}`] = 0; });
    }
    return cur[code];
  };
  state.trades.filter((t) => monthKeyOf(t.date) === mk).forEach((t) => {
    const row = ensure(tradeCurrency(t));
    row.trades += 1;
    row.grossPnl += (Number(t.pnlCents) || 0);
    row.fees += (Number(t.feesCents) || 0);
    row.net += tradeNet(t);
  });
  state.payouts.filter((p) => monthKeyOf(p.date) === mk).forEach((p) => {
    const row = ensure(payoutCurrency(p));
    row.payouts += 1;
    row.payoutGross += p.grossCents;
    row.payoutNet += payoutNet(p);
    row.payoutTax += payoutTax(p);
    if (['received', 'converted'].includes(p.status)) {
      payoutAllocation(p).items.forEach((item) => { row[`alloc_${item.pool}`] += item.cents; });
      row.distributable += payoutDistributable(p);
    }
  });
  const bizCats = state.categories.filter((c) => c.group === 'business').map((c) => c.id);
  const homeExpenses = sum(state.expenses.filter((e) => monthKeyOf(e.date) === mk && bizCats.includes(e.categoryId)), expenseHome);
  const unreviewedExpenses = state.expenses.filter((e) => monthKeyOf(e.date) === mk && bizCats.includes(e.categoryId) && expenseHome(e) == null).length;
  return {
    month: mk,
    rows: Object.keys(cur).sort().map((k) => cur[k]),
    homeExpenses,
    unreviewedExpenses,
    net: sum(Object.values(cur), (r) => r.net),
    fees: sum(Object.values(cur), (r) => r.fees)
  };
}

function renderStrategy() {
  const plays = [...state.strategies].sort((a, b) => String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
  const tests = [...state.backtests].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const pairs = pairEvidence();
  const setupNames = [...new Set(state.trades.map((t) => t.setup).filter(Boolean))];

  const playHTML = plays.length ? plays.map((st) => {
    const live = state.trades.filter((t) => t.setup && String(t.setup).toLowerCase() === st.name.toLowerCase());
    const st2 = live.length ? statsFor(live) : null;
    const badge = STRATEGY_STATUS[st.status] || STRATEGY_STATUS.draft;
    const testsFor = tests.filter((b) => b.strategyId === st.id);
    const logged = state.btTrades.filter((t) => t.strategyId === st.id);
    const btSt = logged.length ? statsFor(logged) : null;
    const gap = btSt && st2 && btSt.avgR != null && st2.avgR != null ? st2.avgR - btSt.avgR : null;
    const bAvg = btSt && btSt.avgR != null ? `${btSt.avgR > 0 ? '+' : ''}${btSt.avgR.toFixed(2)}R` : '—';
    const lAvg = st2 && st2.avgR != null ? `${st2.avgR > 0 ? '+' : ''}${st2.avgR.toFixed(2)}R` : '—';
    return `
      <article class="card">
        <div class="card-head">
          <div>
            <div class="card-title-sm">${esc(st.name)} <span class="badge badge-muted no-dot">v${esc(st.version)}</span></div>
            <div class="card-sub">${st.pair ? esc(st.pair) : 'Any instrument'} · ${logged.length} setup${logged.length === 1 ? '' : 's'} logged · ${live.length} live trade${live.length === 1 ? '' : 's'} tagged · ${testsFor.length} test record${testsFor.length === 1 ? '' : 's'}</div>
          </div>
          <div class="card-actions">
            <span class="badge badge-${badge.tone} no-dot">${esc(badge.label)}</span>
            <button class="btn-icon" data-act="edit-strategy" data-id="${st.id}" aria-label="Edit playbook">${icon('edit', 13)}</button>
            <button class="btn-icon danger" data-act="delete-strategy" data-id="${st.id}" aria-label="Delete playbook">${icon('trash', 13)}</button>
          </div>
        </div>
        ${st.rules ? `<div class="tiny" style="white-space:pre-wrap;line-height:1.6">${esc(st.rules)}</div>` : '<div class="tiny muted">No written rules yet. A playbook nobody can read is a feeling, not a strategy.</div>'}
        ${st.invalidation ? `<div class="form-note" style="margin-top:12px;font-size:10.5px"><b style="color:var(--text)">Invalidation:</b> ${esc(st.invalidation)}</div>` : ''}
        ${gap == null ? '' : `<div class="form-note" style="margin-top:12px;font-size:10.5px">Backtest ${bAvg} over ${btSt.count} setups · live ${lAvg} over ${st2.count} trades · <b style="color:var(--text)">gap ${gap > 0 ? '+' : ''}${gap.toFixed(2)}R</b>. ${Math.abs(gap) < 0.15 ? 'Live matches the test.' : gap < 0 ? 'Live is below the test — that is an execution question, not a playbook question.' : 'Live is above the test — small sample, or the market helped.'}</div>`}
        <div class="card-foot">
          <span>${st2 ? `Live evidence: ${money(st2.net, { sign: true })} over ${st2.count} trades · ${st2.avgR == null ? '—' : `${st2.avgR.toFixed(2)}R average`}` : 'No live trades tagged with this setup name yet'}</span>
          <button class="btn btn-sm btn-ghost" data-act="add-bt-setup" data-strategy-id="${st.id}" data-pair="${esc(st.pair || '')}">${icon('plus', 13)} Log setup</button>
          <button class="btn btn-sm btn-ghost" data-act="add-backtest" data-strategy="${st.id}">${icon('plus', 13)} Backtest</button>
        </div>
      </article>`;
  }).join('') : emptyBlock({
    iconName: 'flask',
    title: 'No playbook written',
    text: 'Write the setup down: what you wait for, what must be true before entry, and what invalidates the idea. Then tag live trades with the same name and the evidence builds itself.',
    cta: 'Write a playbook',
    act: 'add-strategy'
  });

  const testHTML = tests.length ? `
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>Test</th><th>Period</th><th class="num">Sample</th><th class="num">Logged</th><th class="num">Net after costs</th><th class="num">Max DD</th><th class="num">Avg R</th><th></th></tr></thead>
        <tbody>
          ${tests.map((b) => {
            const st = (state.strategies.find((x) => x.id === b.strategyId) || {}).name || b.pair || 'Unlinked';
            const enough = b.sample >= charter().minPairSample;
            const logged = state.btTrades.filter((t) => t.backtestId === b.id);
            return `
              <tr>
                <td><span class="pair">${esc(st)}</span><span class="sub">${esc(b.pair || '—')}${b.note ? ` · ${esc(b.note.slice(0, 40))}` : ''}</span></td>
                <td class="muted tiny">${b.from ? `${fmtDateShort(b.from)} → ${fmtDateShort(b.to)}` : 'No period set'}</td>
                <td class="num ${enough ? 'pos' : 'warn'}">${b.sample}</td>
                <td class="num ${logged.length && logged.length !== b.sample ? 'warn' : 'muted'}">${logged.length || '—'}</td>
                <td class="num ${b.netCents >= 0 ? 'pos' : 'neg'}">${money(b.netCents, { code: b.currency, sign: true })}</td>
                <td class="num muted">${money(b.maxDDCents, { code: b.currency })}</td>
                <td class="num ${Number(b.avgR) > 0 ? 'pos' : Number(b.avgR) < 0 ? 'neg' : 'muted'}">${b.avgR == null ? '—' : `${b.avgR.toFixed(2)}R`}</td>
                <td>
                  <div class="row-actions">
                    ${logged.length ? `<button class="btn btn-sm btn-ghost" data-act="bt-fill" data-id="${b.id}" title="Replace sample, net, drawdown and average R with the ${logged.length} setups logged to this record">From ${logged.length} logged</button>` : ''}
                    <button class="btn-icon" data-act="add-bt-setup" data-strategy-id="${esc(b.strategyId)}" data-backtest-id="${b.id}" data-pair="${esc(b.pair || '')}" data-date="${esc(b.to || '')}" aria-label="Log a setup to this record" title="Log a setup to this record">${icon('plus', 13)}</button>
                    <button class="btn-icon" data-act="edit-backtest" data-id="${b.id}" aria-label="Edit test">${icon('edit', 13)}</button>
                    <button class="btn-icon danger" data-act="delete-backtest" data-id="${b.id}" aria-label="Delete test">${icon('trash', 13)}</button>
                  </div>
                </td>
              </tr>`;
          }).join('')}
        </tbody>
      </table>
    </div>` : '<div class="tiny muted">No test records. Log setups on the Trades page under Backtest, or record a test summary here — a result you cannot show the sample size for is not evidence.</div>';

  const pairHTML = pairs.length ? `
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>Instrument</th><th class="num">Trades</th><th class="num">Net</th><th class="num">Avg R</th><th class="num">DD in R</th><th class="num">On-plan</th><th>Gates</th></tr></thead>
        <tbody>
          ${pairs.map((p) => `
            <tr>
              <td><span class="pair">${esc(p.pair)}</span></td>
              <td class="num ${p.count >= charter().minPairSample ? '' : 'muted'}">${p.count}</td>
              <td class="num ${p.net >= 0 ? 'pos' : 'neg'}">${money(p.net, { code: p.currency, sign: true })}</td>
              <td class="num ${p.avgR >= 0 ? 'pos' : 'neg'}">${p.avgR.toFixed(2)}R</td>
              <td class="num muted">${p.ddR.toFixed(1)}R</td>
              <td class="num ${p.adherencePct >= charter().minAdherencePct ? 'pos' : 'warn'}">${p.adherencePct.toFixed(0)}%</td>
              <td>${gateBadge(p.pass)} <span class="tiny muted">${p.passed}/${p.gates.length}</span></td>
            </tr>`).join('')}
        </tbody>
      </table>
    </div>` : '<div class="tiny muted">No trades logged, so no instrument has any evidence yet.</div>';

  return `
    ${pageHead({
      eyebrow: 'Strategy lab',
      title: 'What has earned the right to be traded',
      sub: 'Playbooks, the tests behind them and the live evidence for each instrument. Expansion is decided by the sample, not by boredom.',
      actions: `
        <button class="btn btn-ghost" data-act="add-backtest">${icon('plus', 14)} Backtest</button>
        <button class="btn btn-primary" data-act="add-strategy">${icon('plus', 14)} Playbook</button>`
    })}
    <div class="grid grid-2">${playHTML}</div>
    <section class="card" style="margin-top:16px">
      <div class="card-head">
        <div>
          <div class="card-title">Test log</div>
          <div class="card-sub">Backtests and forward tests with the sample size written down. Costs included, or the result is a fantasy.</div>
        </div>
        <div class="card-actions"><button class="btn btn-sm btn-ghost" data-act="add-backtest">${icon('plus', 13)} Record</button></div>
      </div>
      ${testHTML}
    </section>
    <section class="card" style="margin-top:16px">
      <div class="card-head">
        <div>
          <div class="card-title">Evidence by instrument</div>
          <div class="card-sub">Every pair you have traded, measured against the charter gates. ${charter().minPairSample} trades, positive expectancy, ${charter().maxPairDdR}R drawdown, ${charter().minAdherencePct}% adherence, net after costs.</div>
        </div>
      </div>
      ${pairHTML}
      ${setupNames.length ? `<div class="form-note" style="margin-top:12px;font-size:10.5px">Setup names in your journal: ${setupNames.map((s) => `<span class="badge badge-muted no-dot">${esc(s)}</span>`).join(' ')}</div>` : '<div class="form-note" style="margin-top:12px;font-size:10.5px">Tag each trade with a setup name and this page can separate one playbook from another.</div>'}
    </section>`;
}

function renderScale() {
  const c = charter();
  const gates = scaleGateSummary();
  const metrics = accountsWithMetrics().filter((m) => !m.account.archived);
  const log = [...state.scaleLog].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const earned = pairEvidence().filter((p) => p.pass);
  const notYet = pairEvidence().filter((p) => !p.pass);

  const gateHTML = gates.gates.map((g) => `
    <div class="side-list-row" style="align-items:flex-start">
      <div class="k">
        <span class="badge badge-${g.pass ? 'mint' : 'rose'} no-dot">${g.pass ? 'Pass' : 'Hold'}</span>
        <b style="color:var(--text);margin-left:8px">${esc(g.label)}</b>
        <div class="tiny muted" style="margin-top:3px">${esc(g.detail)}</div>
      </div>
    </div>`).join('');

  const ladderHTML = metrics.length ? metrics.map((m) => {
    const a = m.account;
    const cur = accountCurrency(a);
    const next = Math.round(a.sizeCents * 2);
    const riskNow = Math.round(a.sizeCents * c.riskPerTradePct / 100);
    const riskNext = Math.round(next * c.riskPerTradePct / 100);
    return `
      <div class="side-list-row" style="align-items:flex-start">
        <div class="k">
          <b style="color:var(--text)">${esc(a.name)}</b>
          <div class="tiny muted">${esc(accountKindLabel(a.kind))} · ${money(a.sizeCents, { code: cur })} now · 1R ${money(riskNow, { code: cur })}</div>
          <div class="tiny" style="margin-top:3px">Next step ${money(next, { code: cur })} · 1R becomes ${money(riskNext, { code: cur })} at the same ${c.riskPerTradePct}% rule. Equity ${money(m.equity, { code: cur })}.</div>
        </div>
        <div class="v">
          ${gates.allPass
            ? `<button class="btn btn-sm btn-primary" data-act="approve-scale" data-id="${a.id}" data-to="${next}">Approve and log</button>`
            : '<span class="badge badge-rose no-dot">Locked by gates</span>'}
        </div>
      </div>`;
  }).join('') : '<div class="tiny muted">No accounts yet.</div>';

  const logHTML = log.length ? `
    <div class="table-scroll">
      <table class="data-table">
        <thead><tr><th>Date</th><th>Account</th><th class="num">From</th><th class="num">To</th><th>Gates at the time</th><th></th></tr></thead>
        <tbody>
          ${log.map((x) => {
            const acc = accountById(x.accountId);
            const failed = x.gates.filter((g) => !g.pass);
            return `
              <tr>
                <td class="muted">${fmtDateShort(x.date)}</td>
                <td>${esc(acc ? acc.name : 'Removed account')}</td>
                <td class="num muted">${money(x.fromCents, { code: x.currency })}</td>

/* ---------------------------- toast ---------------------------- */

function toast(message, type = 'success') {
  const root = document.getElementById('toast-root');
  if (!root) return;
  const el = document.createElement('div');
  el.className = `toast ${type}`;
  const glyph = type === 'error' ? 'alert' : type === 'info' ? 'info' : 'check';
  el.innerHTML = `<span class="toast-icon">${icon(glyph, 15)}</span><span>${esc(message)}</span>`;
  root.appendChild(el);
  setTimeout(() => {
    el.classList.add('leaving');
    setTimeout(() => el.remove(), 220);
  }, type === 'error' ? 5200 : 3200);
}

/* ---------------------------- routing & shell ---------------------------- */

function pageFromHash() {
  const id = (location.hash || '').replace(/^#/, '');
  return PAGES[id] ? id : 'overview';
}

function updateDocumentTitle(page) {
  document.title = `${PAGE_TITLES[page] || 'Overview'} · Ledgerwise FX`;
}

function renderNav() {
  const nav = document.getElementById('nav');
  if (!nav) return;
  const active = ui.page;
  nav.innerHTML = NAV_GROUPS.map((group) => `
    ${group.label ? `<div class="nav-section-label">${group.label}</div>` : ''}
    ${group.items.map((item) => {
      const isActive = active === item.id;
      const dot = item.id === 'learn' && state.lessonsDone.length < LESSONS.length ? '<span class="nav-dot"></span>' : '';
      return `<a class="nav-link ${isActive ? 'active' : ''}" href="#${item.id}" ${isActive ? 'aria-current="page"' : ''} data-nav="${item.id}">
        <span class="nav-icon">${icon(item.icon, 17)}</span>
        <span>${item.label}</span>
        ${dot}
      </a>`;
    }).join('')}
  `).join('');

  const tabs = document.getElementById('mobile-tabs');
  if (tabs) {
    tabs.innerHTML = MOBILE_NAV.map((id) => {
      const item = NAV_GROUPS.flatMap((g) => g.items).find((x) => x.id === id);
      return `<a href="#${id}" class="${active === id ? 'active' : ''}" ${active === id ? 'aria-current="page"' : ''}>
        ${icon(item.icon, 18)}<span>${item.label}</span>
      </a>`;
    }).join('');
  }

  const settingsLink = document.getElementById('settings-link');
  if (settingsLink) settingsLink.style.color = active === 'settings' ? 'var(--text)' : '';
}

function updateHabit() {
  const card = document.getElementById('habit-card');
  const copy = document.getElementById('habit-copy');
  const dot = document.getElementById('habit-dot');
  if (!card || !copy || !dot) return;
  const reviews = [...state.reviews].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  const last = reviews[0];
  const days = last ? daysSince(last.date) : null;
  const snoozeUntil = String(state.settings.habitSnoozeUntil || '');
  const snoozed = Boolean(snoozeUntil) && snoozeUntil > todayISO();
  const reviewedThisWeek = days != null && days < 7;
  card.hidden = snoozed || reviewedThisWeek;
  if (snoozed) return;
  if (!last) {
    dot.style.background = 'var(--amber)';
    copy.textContent = 'No weekly review yet. Twenty minutes is enough to keep the desk honest.';
    return;
  }
  if (reviewedThisWeek) {
    dot.style.background = 'var(--mint)';
    copy.textContent = `Reviewed ${relDay(last.date).toLowerCase()}. Next check-in in ${7 - days} day${7 - days === 1 ? '' : 's'}.`;
  } else {
    dot.style.background = 'var(--amber)';
    copy.textContent = `Last review was ${days} days ago. Time for a twenty-minute check-in.`;
  }
}

function closeMobileNav() {
  document.body.classList.remove('nav-open');
}

function renderApp(page) {
  const keepY = renderAppKeepingScroll._keepY;
  renderAppKeepingScroll._keepY = null;
  const view = document.getElementById('view');
  if (!view) return;
  applyTheme();
  if (!state.settings.onboarded) {
    view.innerHTML = welcomeHTML();
    const migrate = typeof cloudMigrationBanner === 'function' ? cloudMigrationBanner() : '';
    if (migrate) view.insertAdjacentHTML('afterbegin', migrate);
    document.getElementById('nav').innerHTML = '';
    document.getElementById('mobile-tabs').innerHTML = '';
    updateDocumentTitle('Welcome');
    return;
  }
  const target = PAGES[page] ? page : pageFromHash();
  // Staying on the same page keeps your place on the scroll. Only a real page
  // change — or leaving the welcome screen — starts at the top again.
  const samePlace = target === ui.page && !view.querySelector('.welcome');
  const keep = keepY != null ? keepY : samePlace ? (window.scrollY || window.pageYOffset || 0) : 0;
  ui.page = target;
  view.innerHTML = (typeof cloudMigrationBanner === 'function' ? cloudMigrationBanner() : '') + PAGES[target]();
  updateDocumentTitle(target);
  renderNav();
  updateHabit();
  afterRenderCharts(target);
  hydrateShots(view);
  window.scrollTo(0, keep);
  if (typeof renderCloudStatus === 'function') renderCloudStatus();
}

// Re-render without throwing the reader back to the top of the page — used by
// "Show 40 more" so the rows you were looking at stay where they were.
function renderAppKeepingScroll(page) {
  renderAppKeepingScroll._keepY = window.scrollY || window.pageYOffset || 0;
  renderApp(page);
}

function navigate(page) {
  closeModal();
  closeMobileNav();
  if (!PAGES[page]) page = 'overview';
  if (location.hash === `#${page}`) {
    renderApp(page);
  } else {
    location.hash = `#${page}`;
  }
}

function commit(message, page = ui.page, type = 'success') {
  saveState();
  closeModal();
  renderApp(page);
  if (message) toast(message, type);
}

      state.settings.habitSnoozeUntil = addDaysISO(todayISO(), 7);
      commit('Review reminder hidden for 7 days.', ui.page, 'info');
      break;
    case 'open-lesson':
      if (d.id) openLessonModal(d.id);
      break;
    case 'complete-lesson':
      handleCompleteLesson(d.id);
      break;
    case 'lesson-go':
      closeModal();
      navigate(d.page || 'overview');
      break;
    case 'lesson-filter':
      ui.learnCat = d.cat || 'all';
      renderApp('learn');
      break;
    case 'lesson-filter-all':
      ui.learnCat = 'all';
      renderApp('learn');
      break;
    case 'clear-trade-filters':
      ui.trades = { ...emptyTradeFilters(), lane: ui.trades.lane, perPage: ui.trades.perPage };
      renderApp('trades');
      break;
    case 'trades-swap-dates': {
      const from = ui.trades.from;
      ui.trades.from = ui.trades.to;
      ui.trades.to = from;
      ui.trades.page = 1;
      renderApp('trades');
      break;
    }
    case 'trades-page': {
      const n = clamp(Number(d.n) || 1, 1, 1e6);
      ui.trades.page = n;
      renderAppKeepingScroll('trades');
      break;
    }
    case 'budget-month':
      changeMonth('budget', Number(d.delta) || 0);
      break;
    case 'report-month':
      changeMonth('report', Number(d.delta) || 0);
      break;
    case 'fresh-start':
    case 'start-fresh':
      handleStartFresh();
      break;
    case 'load-demo':
      handleLoadDemo();
      break;
    case 'delete-all':
      handleDeleteAll();
      break;
    case 'export-json':
      exportBackup();
      break;
    case 'shots-cloud-on':
      handleShotsCloud(true);
      break;
    case 'shots-cloud-off':
      handleShotsCloud(false);
      break;
    case 'shots-backfill':
      backfillShots();
      break;
    case 'shots-purge':
      purgeCloudShots();
      break;
    case 'export-trades':
      exportTradesCSV();
      break;
    case 'export-payouts':
      exportPayoutsCSV();
      break;
    case 'export-expenses':
      exportExpensesCSV();
      break;
    case 'export-income':
      exportIncomeCSV();
      break;
    case 'export-goals':
      exportGoalsCSV();
      break;
    case 'export-statement':
      exportStatementCSV(d.month || currentMonthKey());
      break;
    case 'export-monthly':
      exportMonthlyCSV();
      break;
    case 'import-json':
      pickBackupFile();
      break;
    case 'import-mt5':
      pickMt5File();
      break;
    case 'run-checks':
      runIntegrityChecks();
      break;
    case 'print':
      closeModal();
      setTimeout(() => window.print(), 60);
      break;
    case 'palette-run':
      runPaletteCommand(d.cmd);
      break;
    case 'set-theme':
      setThemeChoice(d.themeKey);
      break;
    default:
      break;
  }
}

function changeMonth(kind, delta) {
  if (!delta) return;
  const key = kind === 'budget' ? 'budgetMonth' : 'reportMonth';
  const next = shiftMonthKey(ui[key] || currentMonthKey(), delta);
  if (next > currentMonthKey()) return;
  ui[key] = next;
  renderApp(kind === 'budget' ? 'budget' : 'reports');
}

function saveTrade(form) {
  const fd = new FormData(form);
  const id = String(fd.get('id') || '');
  const accountId = String(fd.get('accountId') || '');
  const acc = accountById(accountId);
  if (!acc) { toast('Choose a valid account.', 'error'); return; }
  const date = String(fd.get('date') || '');
  if (isNaN(parseISODate(date).getTime())) { toast('Choose a valid date.', 'error'); return; }
  const pair = String(fd.get('pair') || 'EUR/USD');
  const direction = String(fd.get('direction') || 'long') === 'short' ? 'short' : 'long';
  const entry = numOrNull(fd.get('entry'));
  const exit = numOrNull(fd.get('exit'));
  const sl = numOrNull(fd.get('sl'));
  const finalSl = numOrNull(fd.get('finalSl'));
  const tp = numOrNull(fd.get('tp'));
  const lots = numFrom(fd.get('lots'));
  const tm = tradeMath({ pair, direction, entry, exit, sl, tp, lots });
  const rawPnl = String(fd.get('pnl') ?? '').trim();
  let pnlCents;
  let estimated = false;
  if (rawPnl === '') {
    if (currencyInfo().code !== 'USD') {
      toast(`Enter the P&L in ${currencyInfo().code}. The price-based estimate is only available for USD ledgers.`, 'error');
      const field = form.elements.namedItem('pnl');
      if (field) field.focus();
      return;
    }
    if (tm.estimateCents == null) {
      toast('Enter the actual P&L, or add entry, exit and lots for an estimate.', 'error');
      const field = form.elements.namedItem('pnl');
      if (field) field.focus();
      return;
    }
    pnlCents = tm.estimateCents;
    estimated = true;
  } else {
    pnlCents = centsFrom(rawPnl);
  }
  const feesCents = Math.abs(centsFrom(fd.get('fees')));
  const setup = String(fd.get('setup') || '').trim().slice(0, 60);
  const evidence = String(fd.get('evidence') || '').trim().slice(0, 200);
  if (looksLikeCredential(evidence)) {
    toast('Evidence stores where the chart is. A password, key, login or code does not belong in the journal.', 'error');
    const field = form.elements.namedItem('evidence');
    if (field) field.focus();
    return;
  }
  const rInput = String(fd.get('r') ?? '').trim();
  const r = rInput !== '' ? roundTo(numFrom(rInput), 2) : tm.r;
  const planRaw = String(fd.get('plan') || '');
  if (planRaw !== 'yes' && planRaw !== 'no') {
    toast('Say whether this followed the written plan. Adherence and the breach register are both built from that answer, so it is not left blank.', 'error');
    const focusEl = form.querySelector('input[name="plan"][value="yes"]');
    if (focusEl) focusEl.focus();
    return;
  }
  // The grade is whatever the check says right now. In 'keep' mode (an old row
  // that was graded by hand and has never been ticked) the stored grade wins,
  // so opening a 2024 trade cannot quietly regrade it to F.
  const ck = syncChecklist(form) || { grade: '', score: 0, total: 0, picked: [], mode: 'keep' };
  const graded = ck.mode !== 'keep';
  const grade = graded ? ck.grade : String(fd.get('grade') || '');
  const weakGrade = grade === 'C' || grade === 'F';
  if (ck.mode === 'auto' && form.dataset.ckNew === 'yes' && ck.score === 0 && checklistDef().on) {
    toast('The confluence check is unanswered. Tick what was true before entry — the grade comes from that, not from how the trade went.', 'error');
    const first = form.querySelector('input[name="ck"]');
    if (first) first.focus();
    return;
  }
  if (graded && weakGrade && form.dataset.ckConfirm !== 'yes') {
    askGradeConfirm(form, grade, ck);
    return;
  }
  const existing = id ? state.trades.find((t) => t.id === id) : null;
  const planBlockers = weekPlanBlockers({
    pair,
    session: String(fd.get('session') || 'Other'),
    grade,
    date,
    excludeTradeId: id
  });
  if (planBlockers.length && String(fd.get('plan-override') || '') !== 'yes') { weekPlanRefuse(form, planBlockers); return; }
  const record = {
    id: existing ? existing.id : uid('t'),
    accountId,
    date,
    pair,
    direction,
    entry: Number.isFinite(entry) ? entry : null,
    exit: Number.isFinite(exit) ? exit : null,
    sl: Number.isFinite(sl) ? sl : null,
    finalSl: Number.isFinite(finalSl) ? finalSl : null,
    tp: Number.isFinite(tp) ? tp : null,
    lots,
    pnlCents,
    feesCents,
    r,
    session: String(fd.get('session') || 'Other'),
    startHM: /^\d{1,2}:\d{2}$/.test(String(fd.get('startHM') || '').trim()) ? String(fd.get('startHM')).trim().slice(0, 5) : '',
    grade,
    // Stored alongside the grade so the score survives an edit to the list:
    // the total is the one that was in force when this trade was graded.
    checks: graded ? ck.picked : ((existing && existing.checks) || []),
    checkScore: graded ? ck.score : (existing && existing.checkScore != null ? existing.checkScore : null),
    checkTotal: graded ? ck.total : (existing && existing.checkTotal != null ? existing.checkTotal : null),
    gradedAt: graded ? (existing && existing.gradedAt || new Date().toISOString()) : (existing && existing.gradedAt) || '',
    plan: planRaw === 'yes',
    watchId: String(fd.get('watchId') || (existing && existing.watchId) || '').slice(0, 40),
    plannedR: fd.has('plannedR') && String(fd.get('plannedR') || '') !== ''
      ? roundTo(clamp(numFrom(fd.get('plannedR')), 0, 20), 2)
      : (existing && existing.plannedR != null ? existing.plannedR : null),
    setup,
    evidence,
    notes: String(fd.get('notes') || '').slice(0, 500),
    createdAt: existing ? existing.createdAt : new Date().toISOString(),
    updatedAt: new Date().toISOString()
  };
  if (existing) {
    state.trades = state.trades.map((t) => (t.id === id ? record : t));
    logAudit('trade', `Edited ${pair} trade on ${fmtDate(date, { year: false })} (${money(tradeNet(record), { sign: true })} net)`);
  } else {
    state.trades.push(record);
    logAudit('trade', `Logged ${pair} ${direction} on ${fmtDate(date, { year: false })} (${money(tradeNet(record), { sign: true })} net)`);
  }
  if (planBlockers.length) weekPlanBreach(planBlockers, { date, accountId, tradeId: record.id });
  commit(
    planBlockers.length
      ? `Trade saved past ${planBlockers.length} ${planBlockers.length === 1 ? 'refusal' : 'refusals'} — the register has the reasons.`
      : estimated
        ? 'Trade saved with the price-based P&L estimate. Edit it if your broker shows a different number.'
        : existing ? 'Trade updated.' : weakGrade && graded
          ? `Trade added as a ${grade} — ${ck.score} of ${ck.total} conditions, graded before the result existed.`
          : graded ? `Trade added — ${ck.score} of ${ck.total} conditions held, so it grades ${grade}.` : 'Trade added.',
    ui.page,
    planBlockers.length ? 'info' : estimated ? 'info' : 'success'
  );
}

function handleDeleteTrade(id) {
  const t = state.trades.find((x) => x.id === id);
  if (!t) return;
  confirmDialog({
    title: 'Delete this trade?',
    text: `${esc(t.pair)} on ${fmtDate(t.date)} · <b style="color:var(--text)">${money(tradeNet(t), { sign: true })}</b> net. This removes it from every balance, stat and report.`,
    confirmLabel: 'Delete trade',
    onConfirm: () => {
      const shots = shotsOf(id);
      state.trades = state.trades.filter((x) => x.id !== id);
      state.shots = state.shots.filter((s) => s.owner !== id);
      shots.forEach((s) => { shotRemove(s.id).catch(() => {}); cloudShotForget(s); });
      logAudit('trade', `Deleted ${t.pair} trade from ${fmtDate(t.date)}${shots.length ? `, taking ${shots.length} evidence picture${shots.length === 1 ? '' : 's'} with it` : ''}`);
      commit(shots.length ? `Trade deleted and ${shots.length} picture${shots.length === 1 ? '' : 's'} removed from this laptop.` : 'Trade deleted.', ui.page, 'info');
    }
  });
}

    startingCents,

function savePayout(form) {
  const fd = new FormData(form);
  const id = String(fd.get('id') || '');
  const accountId = String(fd.get('accountId') || '');
  const acc = accountById(accountId);
  if (!acc) { toast('Choose a funded account.', 'error'); return; }
  const grossCents = centsFrom(fd.get('gross'));
  if (grossCents <= 0) { toast('Gross payout must be greater than zero.', 'error'); return; }
  const native = accountCurrency(acc);
  const home = homeCode();
  const status = ['expected', 'sent', 'received', 'converted'].includes(String(fd.get('status'))) ? String(fd.get('status')) : 'converted';
  const recCur = CURRENCIES[String(fd.get('receivedCurrency'))] ? String(fd.get('receivedCurrency')) : native;
  const rate = numOrNull(fd.get('rate'));
  const record = {
    accountId,
    date: String(fd.get('date') || todayISO()),
    grossCents,
    splitPct: clamp(numFrom(fd.get('split')), 0, 100),
    feeCents: Math.abs(centsFrom(fd.get('fee'))),
    taxPct: clamp(numFrom(fd.get('taxPct')), 0, 60),
    note: String(fd.get('note') || '').slice(0, 120),
    currency: native,
    status,
    receivedCents: Math.abs(centsFrom(fd.get('received'))),
    receivedCurrency: recCur,
    rate: rate && rate > 0 ? rate : null,
    rateSource: ['actual', 'manual', 'estimate'].includes(String(fd.get('rateSource'))) ? String(fd.get('rateSource')) : 'manual',
    reference: String(fd.get('reference') || '').slice(0, 80)
  };
  record.homeCents = null;
  if (status === 'converted') {
    if (recCur === home && record.receivedCents > 0) {
      record.homeCents = record.receivedCents;
    } else if (record.rate > 0) {
      const base = record.receivedCents > 0 ? record.receivedCents : payoutNet(record);
      record.homeCents = Math.round(base * record.rate);
    }
  }
  record.fxNeedsReview = status === 'converted' && record.homeCents == null;
  const net = payoutNet(record);
  const label = money(grossCents, { code: native });
  const homeLabel = record.homeCents != null ? ` → ${money(record.homeCents, { code: home })}` : '';
  const existing = id ? state.payouts.find((p) => p.id === id) : null;
  let moved = 0;
  if (existing) {
    Object.assign(existing, record);
    moved = syncPayoutPools(existing);
    logAudit('payout', `Edited payout on ${acc.name} · ${label} gross (${status})${homeLabel}`);
    commit(moved
      ? `Payout updated. The ${moved} pool${moved === 1 ? '' : ' entries'} it funds were rebuilt from the charter split.`
      : 'Payout updated.', ui.page);
  } else {
    const entry = {
      id: uid('po'),
      ...record,
      createdAt: new Date().toISOString()
    };
    state.payouts.push(entry);
    moved = syncPayoutPools(entry);
    logAudit('payout', `Recorded ${label} gross payout on ${acc.name} (${status})${homeLabel}`);
    commit(record.fxNeedsReview
      ? 'Payout saved — add its actual rate in the review queue to count it as household cash.'
      : moved
        ? `Payout split into ${moved} pool${moved === 1 ? '' : ' entries'} at ${allocationRows().map((r) => `${r.pct}% ${POOL_KEYS[r.pool].label.toLowerCase()}`).join(', ')}.`
        : status === 'converted' ? 'Payout converted into household money at the locked rate.' : 'Payout tracked in the bridge.');
  }
}

function handleDeletePayout(id) {
  const p = state.payouts.find((x) => x.id === id);

function suggestedBacktestRisk() {
  const acc = activeAccounts().slice().sort((a, b) => (b.kind === 'personal' ? -1 : 1))[0];
  if (!acc) return 0;
  const base = Number(acc.sizeCents) || Number(acc.startingCents) || 0;
  return Math.round(base * accountBaseRiskPct(acc) / 100);
}

function btCampaignOptions(preset) {
  const rows = [...state.backtests].sort((a, b) => String(b.date).localeCompare(String(a.date)));
  if (!rows.length) return '<option value="">No test records yet</option>';
  return `<option value="">Not tied to a record</option>${rows.map((b) => {
    const s = state.strategies.find((x) => x.id === b.strategyId);
    const label = `${(s && s.name) || 'Unlinked'}${b.pair ? ` · ${b.pair}` : ''} · ${b.sample || 0} setups · ${String(b.date || '').slice(0, 10)}`;
    return `<option value="${b.id}"${b.id === preset ? ' selected' : ''}>${esc(label)}</option>`;
  }).join('')}`;
}

function saveBtTrade(form) {
  const fd = new FormData(form);
  const id = String(fd.get('id') || '');
  const strategy = state.strategies.find((s) => s.id === String(fd.get('strategyId') || ''));
  if (!strategy) { toast('Pick the playbook this setup belongs to.', 'error'); return; }
  const date = String(fd.get('date') || '');
  if (isNaN(parseISODate(date).getTime())) { toast('Choose a valid date.', 'error'); return; }
  const pair = String(fd.get('pair') || 'EUR/USD');
  const direction = String(fd.get('direction') || 'long') === 'short' ? 'short' : 'long';
  const entry = numOrNull(fd.get('entry'));
  const sl = numOrNull(fd.get('sl'));
  const tp = numOrNull(fd.get('tp'));
  const riskCents = Math.abs(centsFrom(fd.get('risk')));
  if (!(riskCents > 0)) {
    toast('Enter the assumed risk per setup — it is what turns your R into the money figures on the charts.', 'error');
    const field = form.elements.namedItem('risk');
    if (field) field.focus();
    return;
  }
  const tm = tradeMath({ pair, direction, entry, exit: tp, sl, lots: null });
  if (tm.stopError) { toast(tm.stopError, 'error'); return; }
  const rInput = String(fd.get('r') ?? '').trim();
  const r = rInput !== '' ? roundTo(numFrom(rInput), 2) : tm.r;
  if (r == null || !Number.isFinite(r)) {
    toast('Needs an R: type the outcome, or fill entry, stop and exit and leave R blank.', 'error');
    const field = form.elements.namedItem('r');
    if (field) field.focus();
    return;
  }
  const hm = String(fd.get('startHM') || '').trim();
  if (hm && !/^([01]?\d|2[0-3]):[0-5]\d$/.test(hm)) { toast('Entry time needs an hour and minute, in UTC.', 'error'); return; }
  const campaign = state.backtests.find((b) => b.id === String(fd.get('backtestId') || ''));
  if (campaign && campaign.strategyId && campaign.strategyId !== strategy.id) {
    const cName = (state.strategies.find((x) => x.id === campaign.strategyId) || {}).name;
    toast(`That test record belongs to ${cName || 'another playbook'}. Pick a record for this playbook, or log the setup unlinked.`, 'error');
    return;
  }
  const record = {
    strategyId: strategy.id,
    setup: strategy.name,
    backtestId: campaign ? campaign.id : '',
    pair,
    direction,
    date,
    startHM: hm,
    entry: Number.isFinite(entry) ? entry : null,
    sl: Number.isFinite(sl) ? sl : null,
    tp: Number.isFinite(tp) ? tp : null,
    exit: Number.isFinite(tp) ? tp : null,
    lots: null,
    r,
    riskCents,
    pnlCents: Math.round(r * riskCents),
    feesCents: Math.abs(centsFrom(fd.get('fees'))),
    session: SESSIONS.includes(String(fd.get('session'))) ? String(fd.get('session')) : 'Other',
    grade: GRADES.includes(String(fd.get('grade'))) ? String(fd.get('grade')) : 'B',
    plan: fd.get('plan') === 'on',
    outcome: ['target', 'stop', 'flat', 'manual'].includes(String(fd.get('outcome'))) ? String(fd.get('outcome')) : 'manual',
    notes: String(fd.get('notes') || '').slice(0, 500)
  };
  const existing = id ? state.btTrades.find((t) => t.id === id) : null;
  const back = ui.page === 'strategy' ? 'strategy' : 'trades';
  if (existing) {
    Object.assign(existing, record, { updatedAt: new Date().toISOString() });
    state.btTrades = normalizeState({ ...state, btTrades: state.btTrades }).btTrades;
    logAudit('bt-setup', `Edited a logged setup · ${strategy.name} · ${r > 0 ? '+' : ''}${r.toFixed(2)}R`);
    commit('Setup updated.', back);
  } else {
    state.btTrades.push({ id: uid('bts'), createdAt: new Date().toISOString(), ...record });
    state.btTrades = normalizeState({ ...state, btTrades: state.btTrades }).btTrades;
    logAudit('bt-setup', `Logged a backtest setup · ${strategy.name} on ${pair} · ${r > 0 ? '+' : ''}${r.toFixed(2)}R`);
    ui.trades.lane = 'bt';
    commit(`Setup logged. ${state.btTrades.length} in the backtest lane.`, back);
  }
}

function handleDeleteBtSetup(id) {
  const t = state.btTrades.find((x) => x.id === id);

  confirmDialog({

function saveIncome(form) {
  const fd = new FormData(form);
  const id = String(fd.get('id') || '');
  const amountCents = centsFrom(fd.get('amount'));

  const home = homeCode();
  const currency = CURRENCIES[String(fd.get('currency'))] ? String(fd.get('currency')) : home;

  let homeCents = null;

  const record = {

    source: String(fd.get('source') || (funding ? 'From savings' : 'Income')).trim().slice(0, 80),

    funding,
    note: String(fd.get('note') || '').slice(0, 120),
    currency,
    rate: currency === home ? null : (rate && rate > 0 ? rate : null),
    homeCents
  };
  const existing = id ? state.incomes.find((i) => i.id === id) : null;
  if (existing) {
    Object.assign(existing, record, { currencyUnreviewed: false });
    logAudit('income', `Edited ${funding ? 'a drawdown' : 'other income'} · ${money(amountCents, { code: currency })}`);
    commit(funding ? 'Drawdown updated.' : 'Income updated.', ui.page);

    logAudit('income', `Recorded ${funding ? 'drawdown from savings' : 'other income'} ${money(amountCents, { code: currency })} · ${record.source}`);
    if (funding) {
      commit(currency !== home && !homeCents ? 'Drawdown saved without a rate — review it to count it against spending.' : 'Drawdown recorded — that covers the overspend.', ui.page);
    } else {
      commit(currency !== home && !homeCents ? 'Income saved without a rate — review it to count it as household money.' : 'Income added.', ui.page);

function charterSignature(c) {
  return [
    c.riskPerTradePct, c.dailyLossCapPct, c.maxConsecutiveLosses, c.maxOpenPositions,
    c.ownerDrawPct, c.personalCapitalPct, c.reservePct, c.researchPct,
    c.reserveTargetMonths, c.minProfitMonths, c.minPairSample, c.minPairExpectancyR,
    c.maxPairDdR, c.minAdherencePct, c.maxBreachesPerMonth, c.reviewNight, c.notes
  ].join('|');
}

function saveCharter(form) {
  const fd = new FormData(form);
  const before = charter();
  const draft = {
    ...before,
    riskPerTradePct: numFrom(fd.get('riskPerTradePct')),
    dailyLossCapPct: numFrom(fd.get('dailyLossCapPct')),
    maxConsecutiveLosses: numFrom(fd.get('maxConsecutiveLosses')),
    maxOpenPositions: numFrom(fd.get('maxOpenPositions')),
    ownerDrawPct: numFrom(fd.get('ownerDrawPct')),
    personalCapitalPct: numFrom(fd.get('personalCapitalPct')),
    reservePct: numFrom(fd.get('reservePct')),
    researchPct: numFrom(fd.get('researchPct')),
    reserveTargetMonths: numFrom(fd.get('reserveTargetMonths')),
    minProfitMonths: numFrom(fd.get('minProfitMonths')),
    minPairSample: numFrom(fd.get('minPairSample')),
    minPairExpectancyR: numFrom(fd.get('minPairExpectancyR')),
    maxPairDdR: numFrom(fd.get('maxPairDdR')),
    minAdherencePct: numFrom(fd.get('minAdherencePct')),
    maxBreachesPerMonth: numFrom(fd.get('maxBreachesPerMonth')),
    reviewNight: String(fd.get('reviewNight') || '').slice(0, 20),
    notes: String(fd.get('notes') || '').slice(0, 600),
    adoptedOn: before.adoptedOn,
    version: before.version
  };
  const next = normalizeCharter(draft);
  const changed = charterSignature(next) !== charterSignature(before);
  const wantsAdopt = fd.get('adopt') === 'on';
  let message = 'Charter updated.';
  if (!isDateISO(before.adoptedOn)) {
    if (wantsAdopt) {
      next.adoptedOn = todayISO();
      message = `Charter adopted on ${fmtDate(next.adoptedOn)}. The gates now measure your own written rules.`;
    } else {
      next.adoptedOn = '';
      message = 'Saved as a draft. Nothing is adopted until you tick the box — the gates would be measuring rules you never agreed to.';
    }
  } else if (changed) {
    next.version = Number(before.version || 1) + 1;
    next.adoptedOn = todayISO();
    message = `Charter revised to version ${next.version}, dated today.`;
  } else if (wantsAdopt) {
    next.adoptedOn = todayISO();
    message = 'Same rules, re-affirmed today.';
  }
  const total = Math.round((next.ownerDrawPct + next.personalCapitalPct + next.reservePct + next.researchPct) * 100) / 100;
  state.charter = next;
  logAudit('charter', `Charter v${next.version} · ${next.riskPerTradePct}% per trade, ${next.dailyLossCapPct}% daily, split ${next.ownerDrawPct}/${next.personalCapitalPct}/${next.reservePct}/${next.researchPct}${isDateISO(next.adoptedOn) ? ` · adopted ${next.adoptedOn}` : ' · draft'}`);
  commit(message + (total !== 100 ? ` Note: the allocation adds to ${total}%.` : ''), 'scale', total !== 100 ? 'info' : 'success');
}

  const date = isDateISO(fd.get('date')) ? String(fd.get('date')) : todayISO();

function saveDocument(form) {
  const fd = new FormData(form);
  const id = String(fd.get('id') || '');
  const title = String(fd.get('title') || '').trim().slice(0, 120);
  if (!title) { toast('Name the record.', 'error'); return; }
  const kind = DOC_KINDS[String(fd.get('kind'))] ? String(fd.get('kind')) : 'other';
  const party = String(fd.get('party') || '').trim().slice(0, 80);
  const location = String(fd.get('location') || '').trim().slice(0, 160);
  const note = String(fd.get('note') || '').trim().slice(0, 240);
  if (looksLikeCredential([title, party, location, note].join('\n'))) {
    logAudit('compliance', 'Refused a register entry that looked like a credential');
    toast('That looks like a credential. This register keeps where the file lives, never a password, key, login or code.', 'error');
    return;
  }
  const issuedOn = isDateISO(fd.get('issuedOn')) ? String(fd.get('issuedOn')) : '';
  const expiresOn = isDateISO(fd.get('expiresOn')) ? String(fd.get('expiresOn')) : '';
  if (issuedOn && expiresOn && expiresOn < issuedOn) {
    toast('The expiry date falls before the issue date.', 'error');
    return;
  }
  const required = fd.get('required') === 'on';
  const record = { title, kind, party, issuedOn, expiresOn, location, required, note };
  const existing = id ? state.documents.find((d) => d.id === id) : null;
  if (existing) {
    Object.assign(existing, record);
    logAudit('compliance', `Edited document: ${title}`);
    commit('Record updated.', 'compliance');
  } else {
    const entry = { id: uid('doc'), ...record, createdAt: new Date().toISOString() };
    state.documents.push(entry);
    logAudit('compliance', `Added document: ${title} (${(DOC_KINDS[kind] || {}).label})`);
    const st = documentStatus(entry);
    commit(st.key === 'expired' ? `Added — and its ${st.label.toLowerCase()}, so renew it before the next payout.` : 'Added to the document register.', 'compliance', st.key === 'expired' ? 'info' : 'success');
  }
}
