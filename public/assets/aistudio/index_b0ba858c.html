/* ============================================================
   CLOUD: auth screens, sync pill, sync bar, migration banner
   ============================================================ */
body.auth-visible .app { display: none; }
.cloud-pill {
  display: flex; align-items: center; gap: 7px;
  margin: 0 14px 8px; padding: 7px 11px;
  border: 1px solid var(--line); border-radius: 999px;
  font-size: 10.5px; font-weight: 600; color: var(--muted);
  background: var(--card-soft);
}
.cloud-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--mint); flex: 0 0 auto; }
.cloud-pill[data-status="pending"] .cloud-dot,
.cloud-pill[data-status="saving"] .cloud-dot { background: var(--amber); animation: cloudPulse 1.2s ease-in-out infinite; }
.cloud-pill[data-status="error"] .cloud-dot,
.cloud-pill[data-status="conflict"] .cloud-dot { background: var(--rose); }
.cloud-pill[data-status="error"], .cloud-pill[data-status="conflict"] { color: var(--rose-text); border-color: var(--rose-line); }
@keyframes cloudPulse { 0%,100% { opacity: .4; } 50% { opacity: 1; } }
.cloud-bar {
  display: flex; align-items: center; justify-content: space-between; gap: 10px;
  max-width: 1160px; margin: 0 auto 14px; padding: 10px 14px;
  border: 1px solid var(--amber-line); border-radius: var(--radius-sm);
  background: var(--amber-soft); color: var(--text-2); font-size: 11.5px;
}
.cloud-bar:empty { display: none; }
.cloud-bar-main { display: flex; align-items: flex-start; gap: 8px; min-width: 0; }
.cloud-bar-main svg { flex: 0 0 auto; margin-top: 1px; }
.cloud-bar[data-status="error"] { border-color: var(--rose-line); background: var(--rose-soft); color: var(--rose); }
.auth-root {
  position: fixed; inset: 0; z-index: 90; overflow: auto;
  background: radial-gradient(ellipse 90% 60% at 50% -10%, rgba(var(--mint-strong-rgb), 0.07), transparent 60%), var(--bg);
  display: grid; place-items: center; padding: 28px 18px;
}
.auth-root[hidden] { display: none; }
.auth-shell { width: min(980px, 100%); display: grid; grid-template-columns: 1.05fr 0.95fr; gap: 46px; align-items: center; }
.auth-brand { min-width: 0; }
.auth-brand .brand { display: inline-flex; }
.auth-eyebrow { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--mint); margin-bottom: 14px; }
.auth-headline h1 { font-size: clamp(26px, 4.4vw, 40px); line-height: 1.12; letter-spacing: -0.02em; margin-bottom: 14px; }
.auth-headline h1 em { font-style: normal; color: var(--mint); }
.auth-headline p { color: var(--muted); font-size: 13px; line-height: 1.65; max-width: 430px; }
.auth-points { display: grid; gap: 12px; margin: 26px 0 20px; }
.auth-point { display: flex; gap: 10px; font-size: 12px; color: var(--text-2); line-height: 1.55; }
.auth-point .tick {
  flex: 0 0 auto; width: 18px; height: 18px; border-radius: 50%;
  display: grid; place-items: center; margin-top: 1px;
  background: var(--mint-soft); border: 1px solid var(--mint-line); color: var(--mint);
}
.auth-foot { display: flex; align-items: center; gap: 8px; font-size: 11px; color: var(--muted-2); }
.auth-form-wrap { width: min(420px, 100%); justify-self: center; }
.auth-card {
  background: var(--card); border: 1px solid var(--line); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 26px 24px;
}
.auth-icon {
  width: 42px; height: 42px; border-radius: 13px; display: grid; place-items: center;
  background: var(--mint-soft); border: 1px solid var(--mint-line); color: var(--mint); margin-bottom: 16px;
}
.auth-card h2 { font-size: 19px; letter-spacing: -0.01em; margin: 4px 0 6px; }
.auth-card .sub { font-size: 12px; color: var(--muted); line-height: 1.6; margin-bottom: 16px; }
.auth-message { border-radius: 10px; padding: 9px 11px; font-size: 11.5px; line-height: 1.5; margin-bottom: 12px; }
.auth-message.error { background: var(--rose-soft); border: 1px solid var(--rose-line); color: var(--rose-text); }
.auth-alt { margin-top: 16px; font-size: 11.5px; color: var(--muted); line-height: 1.7; }
.auth-alt p + p { margin-top: 6px; }
.auth-divider { display: flex; align-items: center; gap: 12px; margin: 14px 0; color: var(--muted-2); font-size: 9.5px; letter-spacing: .12em; }
.auth-divider::before, .auth-divider::after { content: ""; height: 1px; background: var(--line); flex: 1; }
.auth-legal { display: flex; gap: 8px; justify-content: center; margin-top: 16px; font-size: 10.5px; color: var(--muted-2); flex-wrap: wrap; }
.btn-block { width: 100%; justify-content: center; margin-top: 4px; }
.auth-error { display: none; margin-top: 10px; font-size: 11.5px; color: var(--rose); background: var(--rose-soft); border: 1px solid var(--rose-line); border-radius: 9px; padding: 8px 10px; line-height: 1.5; }
.auth-error.show { display: block; }
.auth-loading { display: flex; align-items: center; gap: 10px; color: var(--muted); font-size: 12.5px; }
.auth-spinner { width: 17px; height: 17px; border-radius: 50%; border: 2px solid var(--line-2); border-top-color: var(--mint); animation: authSpin .8s linear infinite; }
@keyframes authSpin { to { transform: rotate(360deg); } }
.cloud-migrate {
  margin: 0 0 18px; padding: 14px 16px; border: 1px solid var(--amber-line);
  border-radius: var(--radius-sm); background: var(--amber-soft);
}
.cloud-migrate-title { display: flex; align-items: center; gap: 8px; font-size: 12.5px; margin-bottom: 6px; color: var(--text); }
.cloud-migrate p { font-size: 11.5px; color: var(--text-2); line-height: 1.6; }
.cloud-migrate-actions { display: flex; gap: 12px; align-items: center; margin-top: 11px; flex-wrap: wrap; }
.legal-copy { font-size: 12px; line-height: 1.65; color: var(--text-2); }
.legal-copy h4 { margin: 16px 0 5px; font-size: 12.5px; color: var(--text); }
.legal-copy ul { padding-left: 18px; display: grid; gap: 5px; }
.legal-copy a { color: var(--mint); text-decoration: underline; }
.legal-meta { font-size: 11px; color: var(--muted); margin: 4px 0; }
@media (max-width: 860px) {
  .auth-shell { grid-template-columns: 1fr; gap: 26px; }
  .auth-brand { display: none; }
  .auth-root { padding: 20px 14px; }
}
@media (max-width: 700px) {
  .cloud-bar { align-items: flex-start; flex-direction: column; gap: 6px; }
}

/* ============================ TERMINAL LAYER ============================
   TradingView-flavoured density pass: flat panels, hairline borders, small
   mono headings and numbers that line up in columns. Late in the cascade on
   purpose. Everything here is size and shape only — colour stays on the theme
   variables, so all six themes keep working and the injected theme sheet
   (which wins ties) never gets fought over. */

:root { --radius: 6px; --radius-sm: 5px; }

:focus-visible { outline: 1px solid var(--focus-ring); outline-offset: 1px; }

::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-thumb { border: 2px solid transparent; background: var(--scroll-thumb); }

/* ---- shell: narrow rail, wide board ---- */

@media (min-width: 961px) {
  .sidebar { width: 232px; padding: 14px 10px 12px; }
  .main { margin-left: 232px; width: calc(100% - 232px); }
}

.brand { gap: 9px; padding: 2px 6px 14px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; }
.brand-mark svg { width: 17px; height: 17px; }
.brand-name { font-size: 15px; }

.nav-link { gap: 9px; min-height: 30px; padding: 0 8px; border-radius: 5px; font-size: 12.5px; font-weight: 550; }
.nav-link.active { background: rgba(var(--mint-rgb), 0.08); border-color: transparent; box-shadow: inset 2px 0 0 var(--mint); }
.nav-link .nav-tail { font-size: 8.5px; padding: 1px 4px; }

.nav-section-label { padding-top: 13px; font-size: 9px; }
.sidebar-card { padding: 12px; border-radius: 7px; }
.sidebar-card p { font-size: 11.5px; }
.sidebar-bottom { padding-top: 6px; }

.view { max-width: 1780px; padding: 16px 18px 64px; }

/* ---- page head: a toolbar, not a poster ---- */

.page-head { gap: 16px; margin-bottom: 14px; }
.page-eyebrow { margin-bottom: 4px; font-size: 9px; }
.page-title { font-size: clamp(17px, 1.5vw, 21px); font-weight: 700; letter-spacing: -0.025em; }
.page-sub { margin-top: 4px; font-size: 12px; }
.page-actions { gap: 6px; padding-top: 0; }

/* ---- panels ---- */

body { font-size: 13px; line-height: 1.45; }

.card {
  padding: 13px 14px;
  border-radius: var(--radius);
  background: var(--card);
  box-shadow: none;
}
.card.pad-lg { padding: 16px; }
.card.tight { padding: 11px 12px; }
.card-head { gap: 12px; margin-bottom: 11px; }
.card-title { font-size: 13px; font-weight: 650; letter-spacing: -0.012em; }
.card-title-sm { font-size: 12px; }
.card-sub { margin-top: 3px; font-size: 11.5px; }
.card-foot { margin-top: 12px; padding-top: 10px; font-size: 11.5px; }

.grid, .grid-2, .grid-3, .grid-4 { gap: 10px; }
.stack { gap: 10px; }
.mt-14 { margin-top: 10px; }
.mt-20 { margin-top: 12px; }
.overview-main, .overview-bottom { gap: 10px; margin-top: 10px; }

/* ---- KPI strip ---- */

.kpi-grid { gap: 8px; }
.kpi {
  position: relative;
  padding: 10px 12px 11px;
  border-radius: var(--radius);
  background: var(--card);
  transition: border-color 0.14s ease;
}
.kpi::after {
  content: ""; position: absolute; left: -1px; top: 8px; bottom: 8px; width: 2px;
  border-radius: 2px; background: var(--mint); opacity: 0; transition: opacity 0.14s ease;
}
.kpi:hover { border-color: var(--line-2); }
.kpi:hover::after { opacity: 0.65; }
.kpi-label { font-family: var(--mono); font-size: 9.5px; font-weight: 550; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted-2); }
.kpi-icon { width: 22px; height: 22px; }
.kpi-icon svg { width: 13px; height: 13px; }
.kpi-val { margin-top: 7px; font-size: clamp(17px, 1.5vw, 22px); font-weight: 600; letter-spacing: -0.04em; }
.kpi-val.small { font-size: clamp(15px, 1.3vw, 19px); }
.kpi-foot { margin-top: 5px; font-size: 11px; }

/* ---- controls ---- */

.btn {
  height: 28px;
  gap: 6px;
  padding: 0 10px;
  border-radius: 5px;
  font-size: 12px;
  font-weight: 600;
  box-shadow: none;
}
.btn-primary { box-shadow: none; }
.btn-primary:hover { box-shadow: none; }
.btn-sm { height: 24px; padding: 0 8px; font-size: 11px; border-radius: 4px; }
.btn-icon { width: 26px; height: 26px; border-radius: 5px; }
.row-actions .btn-icon { width: 22px; height: 22px; }

.chip { height: 25px; padding: 0 8px; border-radius: 5px; font-size: 11px; }
.badge { border-radius: 3px; }
.tag { border-radius: 3px; }

.input, .select, .textarea { height: 29px; padding: 0 8px; border-radius: 5px; font-size: 12.5px; }
.textarea { min-height: 62px; padding: 8px; line-height: 1.5; }
.select { padding-right: 26px; background-position: right 8px center; }
.input:focus, .select:focus, .textarea:focus { box-shadow: 0 0 0 2px var(--mint-focus); }
.input-affix .affix { left: 8px; font-size: 11.5px; }
.input-affix .input { padding-left: 22px; }
.input-affix.suffix .affix { left: auto; right: 8px; }
.input-affix.suffix .input { padding-left: 8px; padding-right: 24px; }
.form-grid { gap: 10px; }
.field { gap: 4px; }
.field > label { font-size: 10px; }
.field .hint { font-size: 10.5px; line-height: 1.4; }

.lane-switch { gap: 2px; padding: 2px; border-radius: 6px; }
.lane-btn { padding: 4px 11px; border-radius: 4px; font-size: 11.5px; }
.month-nav .month-label { min-width: 96px; font-size: 11px; }
.month-nav .btn-icon { width: 24px; height: 24px; }

/* ---- tables: the ledger is the product ---- */

.data-table { font-size: 12px; }
.data-table th { padding: 0 10px 7px; font-size: 9px; letter-spacing: 0.09em; }
.data-table td { padding: 5px 9px; line-height: 1.35; }
.data-table td.clip { min-width: 110px; line-height: 1.4; }
.data-table .pair { font-size: 11.5px; }
.data-table .sub { font-size: 10px; margin-top: 1px; }
.data-table tbody tr:hover { background: rgba(var(--mint-rgb), 0.05); box-shadow: inset 2px 0 0 rgba(var(--mint-rgb), 0.55); }
.table-empty { padding: 26px 16px; }
.table-footnote { font-size: 10.5px; }

/* Long ledgers keep their column labels on screen instead of losing them off the top. */
.card.flush .table-scroll { max-height: calc(100vh - 190px); }
.data-table thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--card);
  box-shadow: inset 0 -1px 0 var(--line);
}

/* ---- filter bar ---- */

.filter-bar { gap: 6px; margin-bottom: 10px; padding: 7px 9px; border-radius: var(--radius); }
.filter-bar .filter-label { font-size: 9px; }
.filter-select { height: 27px; flex: 1 1 106px; max-width: 178px; font-size: 11.5px; padding: 0 24px 0 8px; border-radius: 5px; }
.filter-dates { display: flex; align-items: center; gap: 5px; }
.filter-date { display: flex; align-items: center; gap: 5px; }
.filter-date > span {
  font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--muted-2);
}
.filter-date .input {
  height: 27px; width: 126px; padding: 0 7px;
  font-family: var(--mono); font-size: 11px; letter-spacing: -0.01em;
}
.filter-date .input::-webkit-calendar-picker-indicator { opacity: 0.55; cursor: pointer; }
.filter-date .input:hover::-webkit-calendar-picker-indicator { opacity: 0.9; }
.filter-count {
  font-family: var(--mono); font-size: 10px; color: var(--muted);
  padding: 3px 7px; border: 1px solid var(--line); border-radius: 4px; background: var(--inset);
  white-space: nowrap;
}

.filter-warn {
  display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  margin-top: 8px; padding: 7px 10px;
  border: 1px solid var(--amber-line); border-radius: 5px; background: var(--amber-soft);
  color: var(--text-2); font-size: 11.5px;
}
.filter-warn svg { color: var(--amber); flex-shrink: 0; }
.filter-warn .btn-link { margin-left: auto; font-size: 11.5px; }

/* ---- pager ---- */

.pager {
  display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 10px;
  padding: 7px 12px; border-top: 1px solid var(--line);
}
.pager-info { font-size: 11px; color: var(--muted); }
.pager-info b { font-family: var(--mono); font-weight: 600; color: var(--text-2); letter-spacing: -0.02em; }
.pager-ctrl { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
.pager-size { display: flex; align-items: center; gap: 6px; }
.pager-size > span {
  font-family: var(--mono); font-size: 8.5px; letter-spacing: 0.09em;
  text-transform: uppercase; color: var(--muted-2);
}
.pager-size .select { height: 25px; min-width: 56px; padding: 0 22px 0 7px; font-size: 11px; }
.pager-pages { display: flex; align-items: center; gap: 2px; }
.pg-btn {
  min-width: 25px; height: 25px; padding: 0 5px;
  display: inline-grid; place-items: center;
  border: 1px solid transparent; border-radius: 4px; background: transparent;
  color: var(--muted); font-family: var(--mono); font-size: 11px;
  transition: background 0.12s ease, color 0.12s ease, border-color 0.12s ease;
}
.pg-btn:hover { color: var(--text); background: rgba(var(--veil-rgb), 0.05); border-color: var(--line); }
.pg-btn.active {
  color: var(--mint-ink); background: var(--grad-mint); border-color: transparent;
  font-weight: 700; box-shadow: none;
}
.pg-btn.nav { color: var(--muted-2); }
.pg-btn[disabled] { opacity: 0.32; pointer-events: none; }
.pg-gap { color: var(--muted-2); padding: 0 2px; font-size: 11px; }

/* ---- overlays ---- */

.modal { border-radius: 8px; box-shadow: 0 24px 64px rgba(var(--shade-rgb), 0.55), 0 0 0 1px rgba(var(--veil-rgb), 0.05); }
.modal-head h3 { font-size: 14.5px; }
.auth-card { border-radius: 8px; box-shadow: 0 20px 56px rgba(var(--shade-rgb), 0.5); padding: 20px 18px; }
.learn-hero { padding: 16px; border-radius: var(--radius); gap: 18px; }

.assumption, .closeout-ask { border-radius: 5px; font-size: 11.5px; }
.closeout-ask { margin-top: 8px; padding: 7px 10px; }
.demo-banner { margin-bottom: 12px; padding: 7px 11px; border-radius: 5px; font-size: 11.5px; }

@media (max-width: 900px) {
  .filter-dates { width: 100%; }
  .filter-date { flex: 1; }
  .filter-date .input { width: 100%; }
  .pager { justify-content: flex-start; }
}
@media (max-width: 640px) {
  .view { padding: 14px 13px 56px; }
  .kpi-val { font-size: 18px; }
}
@media print {
  .pager { display: none; }
  /* These restate the terminal layer: it is the last thing in the sheet, so on
     paper it would win over the print rules above and print dark panels. */
  body { font-size: 12px; }
  .main { margin-left: 0; width: 100%; }
  .view { max-width: none; padding: 0; }
  .card, .kpi, .filter-bar { background: #fff; border-color: #ddd; box-shadow: none; }
  .kpi::after { display: none; }
  .data-table thead th { position: static; background: #fff; }
  .input, .select, .textarea, .btn { height: auto; }
}
@media (prefers-reduced-motion: reduce) {
  .card, .kpi, .btn, .pg-btn, .kpi::after { transition: none; }
  .kpi:hover { transform: none; }
  .page { animation: none; }
}

/* ============================ PROP DESK LAYER ============================
   The reference look is a funded-account dashboard: near-black room, gold
   chrome, green and red kept strictly for money. Gold is built from each
   theme's own amber accent, so all six themes still hold together and light
   themes get a deeper gold instead of a washed-out one. */

:root {
  --gold: rgb(var(--amber-rgb));
  --gold-soft: rgba(var(--amber-rgb), 0.12);
  --gold-line: rgba(var(--amber-rgb), 0.32);
  --gold-ink: #09090d;
  --gold-grad: linear-gradient(135deg, rgba(var(--amber-rgb), 1), rgba(var(--amber-rgb), 0.74));
  --font-display: "Space Grotesk", "Manrope", ui-sans-serif, system-ui, sans-serif;
}

/* Goat Funded's own chrome: 12px gold buttons on near-black panels with one
   hairline border and a deep drop shadow, headings in Space Grotesk. */
.btn { border-radius: 8px; }
.btn-primary:hover { background: linear-gradient(135deg, #f9cd6f, rgba(var(--amber-rgb), 0.92)); }
.card { box-shadow: 0 10px 30px rgba(var(--shade-rgb), 0.32); }
.card, .tile, .rule, .fund-inner, .fund-time, .kpi { border-color: var(--frame); }
.modal { box-shadow: 0 12px 36px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(var(--veil-rgb), 0.05); }
.page-title, .card-title, .brand-name, .tile-stage, .fund-big, .side-title { font-family: var(--font-display); }
.page-title { letter-spacing: -0.02em; font-weight: 600; }
.card-title { letter-spacing: -0.01em; font-weight: 600; }
.brand-name { letter-spacing: -0.02em; }

.main {
  background:
    radial-gradient(920px 420px at 86% -12%, rgba(var(--amber-rgb), 0.055), transparent 60%),
    radial-gradient(760px 500px at 6% 112%, rgba(var(--sky-rgb), 0.026), transparent 62%),
    var(--bg);
}

/* ---- gold chrome ---- */

.brand-mark { background: var(--gold-grad); border-color: var(--gold-line); }
.brand-mark svg { stroke: var(--gold-ink); }
.nav-link.active { background: var(--gold-grad); color: var(--gold-ink); border-color: transparent; box-shadow: none; font-weight: 650; }
.nav-link.active .nav-icon { color: var(--gold-ink); }
.nav-link.active .nav-tail { color: var(--gold-ink); border-color: rgba(var(--gold-ink), 0.28); background: rgba(255, 255, 255, 0.22); }
.nav-link.active .nav-dot { background: var(--gold-ink); box-shadow: 0 0 0 3px rgba(var(--gold-ink), 0.18); }
.btn-primary { background: var(--gold-grad); border-color: var(--gold-line); color: var(--gold-ink); }
.btn-primary:hover { background: linear-gradient(135deg, rgba(var(--amber-rgb), 1), rgba(var(--amber-rgb), 0.86)); border-color: rgba(var(--amber-rgb), 0.55); }
.pg-btn.active { color: var(--gold-ink); background: var(--gold-grad); }
:focus-visible { outline-color: rgba(var(--amber-rgb), 0.75); }
.kpi::after { background: var(--gold); }
.input:focus, .select:focus, .textarea:focus { border-color: rgba(var(--amber-rgb), 0.6); }
.progress > span { background: var(--mint); }
.score-ring.gold { background: conic-gradient(var(--gold) calc(var(--p) * 1%), var(--track-2) 0); }

.acct-switch {
  width: auto; min-width: 148px; max-width: 216px; height: 30px;
  padding: 0 26px 0 11px; border-radius: 999px;
  font-size: 12px; font-weight: 650;
  background-color: var(--gold-soft); border-color: var(--gold-line);
}

.card-actions.chips { gap: 3px; padding: 3px; border: 1px solid var(--line); border-radius: 8px; background: var(--inset); }
.chip-btn {
  border: 0; background: transparent; color: var(--muted);
  font: inherit; font-size: 11px; font-weight: 600;
  padding: 4px 9px; border-radius: 6px; cursor: pointer;
  transition: background 0.14s ease, color 0.14s ease;
}
.chip-btn:hover { color: var(--text); }
.chip-btn.active { background: var(--gold-soft); color: var(--gold); }

/* ---- stat tiles ---- */

.tiles { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 10px; margin-bottom: 12px; }
.tile {
  padding: 12px 14px 13px;
  border: 1px solid var(--line); border-radius: 12px;
  background: linear-gradient(180deg, rgba(var(--amber-rgb), 0.05), transparent 44%), var(--card);
}
.tile-top { display: flex; align-items: center; gap: 8px; min-width: 0; }
.tile-ic {
  width: 22px; height: 22px; flex-shrink: 0;
  display: grid; place-items: center; border-radius: 50%;
  border: 1px solid var(--gold-line); background: var(--gold-soft); color: var(--gold);
}
.tile-label { font-size: 11px; font-weight: 600; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.tile-val {
  margin-top: 9px;
  font-family: var(--mono); font-size: clamp(19px, 1.7vw, 25px); font-weight: 600;
  letter-spacing: -0.045em; line-height: 1.05;
  white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
}
.tile-val.pos { color: var(--mint); }
.tile-val.neg { color: var(--rose); }
.tile-stage { font-family: var(--font); font-size: 17px; font-weight: 700; letter-spacing: -0.015em; }
.tile-foot { margin-top: 6px; font-size: 11px; color: var(--muted-2); display: flex; align-items: center; gap: 5px; flex-wrap: wrap; }

/* ---- rules & limits ---- */

.rule { padding: 11px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--inset); }
.rule + .rule { margin-top: 9px; }
.rule-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 8px; }
.rule-title { font-size: 12.5px; font-weight: 650; color: var(--text-2); }
.rule-state {
  display: inline-flex; align-items: center; gap: 5px;
  font-family: var(--mono); font-size: 9.5px; font-weight: 600;
  letter-spacing: 0.08em; text-transform: uppercase; color: var(--mint);
}
.rule-state.warn { color: var(--amber); }
.rule-state.bad { color: var(--rose); }
.rule-dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; box-shadow: 0 0 0 3px var(--mint-soft); }
.rule-state.warn .rule-dot { box-shadow: 0 0 0 3px var(--amber-soft); }
.rule-state.bad .rule-dot { box-shadow: 0 0 0 3px var(--rose-soft); }
.rule-foot { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-top: 7px; font-size: 11px; color: var(--muted); }
.rule-used { font-family: var(--mono); letter-spacing: -0.02em; }
.rule-sum { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; margin-top: 11px; padding-top: 9px; border-top: 1px solid var(--line); font-size: 11px; color: var(--muted-2); }
.rule-sum b { font-family: var(--mono); font-size: 11.5px; font-weight: 600; color: var(--text-2); letter-spacing: -0.02em; }

/* ---- funding progress ---- */

.fund-grid { display: grid; grid-template-columns: minmax(0, 1.3fr) minmax(0, 1fr); gap: 10px; }
.fund-inner, .fund-time { padding: 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--inset); }
.fund-inner { display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.fund-title { display: flex; align-items: center; gap: 6px; font-size: 11.5px; font-weight: 650; color: var(--text-2); margin-bottom: 9px; }
.fund-title svg { color: var(--gold); flex-shrink: 0; }
.fund-rows { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.fund-rows > div { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; font-size: 11.5px; color: var(--muted); }
.fund-rows b { font-family: var(--mono); font-weight: 600; color: var(--text-2); letter-spacing: -0.02em; white-space: nowrap; }
.fund-rows b.pos { color: var(--mint); }
.fund-rows b.neg { color: var(--rose); }
.fund-inner .score-ring { width: 74px; height: 74px; }
.fund-inner .score-ring::before { background: var(--inset); }
.fund-inner .score-ring::after { inset: 4px; }
.fund-inner .score-num { font-size: 19px; }
.fund-flag { grid-column: 1 / -1; font-size: 11px; color: var(--muted); }
.fund-flag.ok { color: var(--mint); }
.fund-time { background: linear-gradient(150deg, rgba(var(--amber-rgb), 0.15), rgba(var(--amber-rgb), 0.03) 58%), var(--inset); border-color: var(--gold-line); }
.fund-big { font-family: var(--mono); font-size: 30px; font-weight: 700; letter-spacing: -0.05em; line-height: 1; color: var(--text); }
.fund-big small { margin-left: 5px; font-family: var(--font); font-size: 11.5px; font-weight: 600; letter-spacing: 0; color: var(--muted); }
.fund-sub { margin-top: 8px; font-size: 11px; line-height: 1.45; color: var(--muted-2); }
.fund-time.near .fund-big { color: var(--amber); }
.fund-time.past .fund-big { color: var(--rose); }
.fund-time.done .fund-big { color: var(--mint); }
.fund-time.plain .fund-big { color: var(--muted-2); }

/* ---- performance footer: profit-factor gauge + stat rail ---- */

.perf-foot { display: flex; align-items: stretch; gap: 10px; margin-top: 12px; }
.perf-foot .stat-strip { flex: 1 1 240px; min-width: 0; align-self: center; border-radius: 10px; }
.gauge {
  flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center;
  min-width: 116px; padding: 9px 12px 10px;
  border: 1px solid var(--gold-line); border-radius: 10px;
  background: linear-gradient(160deg, rgba(var(--amber-rgb), 0.08), transparent 60%), var(--inset);
}
.gauge svg { display: block; }
.gauge-val {
  margin-top: -23px;
  font-family: var(--mono); font-size: 18px; font-weight: 700;
  letter-spacing: -0.045em; line-height: 1; color: var(--text);
}
.gauge-label {
  margin-top: 4px;
  font-size: 9.5px; font-weight: 600; letter-spacing: 0.07em;
  text-transform: uppercase; color: var(--muted-2);
}
.stat-strip .value.pos { color: var(--mint); }
.stat-strip .value.neg { color: var(--rose); }

/* ---- desk score ring ---- */

.desk-score { display: flex; align-items: center; gap: 12px; padding: 12px; margin-bottom: 9px; border: 1px solid var(--gold-line); border-radius: 10px; background: var(--inset); }
.desk-score .score-ring { width: 66px; height: 66px; }
.desk-score .score-ring::before { background: var(--inset); }
.desk-score .score-ring::after { inset: 4px; }
.desk-score .score-num { font-size: 17px; }
.desk-score-copy { margin-top: 3px; font-size: 11px; line-height: 1.5; color: var(--muted); }

@media (max-width: 1120px) { .tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
@media (max-width: 720px) { .fund-grid, .fund-inner { grid-template-columns: minmax(0, 1fr); } .perf-foot { flex-direction: column; } }
@media (max-width: 560px) { .tiles { grid-template-columns: 1fr; } .gauge { align-self: flex-start; } }
@media (prefers-reduced-motion: reduce) { .chip-btn { transition: none; } }
@media print {
  .main { background: #fff; }
  .tile, .rule, .fund-inner, .fund-time, .gauge, .desk-score { background: #fff; border-color: #ddd; }
  .nav-link.active { background: #f2f2f2; color: #111; }
}
</style>

/* ============================================================
   LEDGERWISE FX — core
   Money is stored in integer minor units (cents) everywhere.
   All balances are derived from source records; nothing is
   silently overwritten.
   ============================================================ */
'use strict';

const DB_KEY = 'ledgerwise_fx_v1';
const APP_VERSION = '1.0.0';

/* ---------------------------- currency ---------------------------- */

const CURRENCIES = {
  USD: { code: 'USD', symbol: '$',   label: 'US dollar ($)',        locale: 'en-US' },
  KES: { code: 'KES', symbol: 'KSh', label: 'Kenyan shilling (KSh)', locale: 'en-KE' },
  EUR: { code: 'EUR', symbol: '€',   label: 'Euro (€)',              locale: 'de-DE' },
  GBP: { code: 'GBP', symbol: '£',   label: 'British pound (£)',     locale: 'en-GB' },
  NGN: { code: 'NGN', symbol: '₦',   label: 'Nigerian naira (₦)',    locale: 'en-NG' },
  ZAR: { code: 'ZAR', symbol: 'R',   label: 'South African rand (R)',locale: 'en-ZA' },
  AUD: { code: 'AUD', symbol: 'A$',  label: 'Australian dollar (A$)',locale: 'en-AU' },
  CAD: { code: 'CAD', symbol: 'C$',  label: 'Canadian dollar (C$)',  locale: 'en-CA' }
};

const PAYOUT_STATUS_LABELS = {
  expected: 'Expected',
  sent: 'Sent',
  received: 'Received',
  converted: 'Converted'
};

/* ---------------------------- pair data ----------------------------
   pip       = price increment of one pip
   pipValue  = indicative USD value of 1 pip per 1.00 lot at `base`
   digits    = display decimals
   base      = indicative price used for the prefilled price hints
   contract  = units per 1.00 lot (FX 100,000; XAU 100 oz; XAG 5,000 oz)
   Live estimates use pipValueUsd(), which converts the quote currency
   at the trade's own price instead of relying on these static values.
------------------------------------------------------------------- */

const PAIR_DATA = {
  'EUR/USD': { pip: 0.0001, pipValue: 10,    digits: 5, base: 1.08550 },
  'GBP/USD': { pip: 0.0001, pipValue: 10,    digits: 5, base: 1.29500 },
  'AUD/USD': { pip: 0.0001, pipValue: 10,    digits: 5, base: 0.65800 },
  'NZD/USD': { pip: 0.0001, pipValue: 10,    digits: 5, base: 0.59600 },
  'USD/JPY': { pip: 0.01,   pipValue: 6.66,  digits: 3, base: 150.200 },
  'USD/CHF': { pip: 0.0001, pipValue: 11.34, digits: 5, base: 0.88200 },

function defaultDuties() {
  return DEFAULT_DUTIES.map((d) => ({
    id: uid('duty'), dept: d.dept, title: d.title, cadence: d.cadence, active: true, note: ''
  }));
}

function dutyTitleKey(title) {
  return String(title || '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
}

function recommendedMissing(deptId) {
  const have = new Set(state.duties.map((d) => dutyTitleKey(d.title)));
  const ids = deptId && RECOMMENDED_DUTIES[deptId] ? [deptId] : Object.keys(RECOMMENDED_DUTIES);
  const out = [];
  ids.forEach((id) => {
    RECOMMENDED_DUTIES[id].forEach((r) => {
      const key = dutyTitleKey(r.title);
      if (!have.has(key) && !out.some((m) => m.dept === id && dutyTitleKey(m.title) === key)) {
        out.push({ dept: id, title: r.title, cadence: r.cadence });
        have.add(key);
      }
    });
  });
  return out;
}

function loadRecommendedDuties(deptId) {
  const missing = recommendedMissing(deptId);
  const scope = deptId && RECOMMENDED_DUTIES[deptId]
    ? (DEPARTMENTS.find((d) => d.id === deptId) || { name: deptId }).name
    : 'all departments';
  if (!missing.length) {
    toast(`${scope} already has every recommended duty. Nothing to add.`, 'info');
    return;
  }
  missing.forEach((r) => {
    state.duties.push({ id: uid('duty'), dept: r.dept, title: r.title, cadence: r.cadence, active: true, note: '' });
  });
  logAudit('duty', `Loaded ${missing.length} recommended duties for ${scope}`);
  saveState();
  renderAppKeepingScroll(ui.page);
  toast(`Added ${missing.length === 1 ? '1 duty' : missing.length + ' duties'} to ${scope}. Edit any line you would not really do.`, 'success');
}

function isDateISO(v) { return /^\d{4}-\d{2}-\d{2}$/.test(String(v || '')); }

function normalizeCharter(raw) {
  const c = { ...CHARTER_DEFAULTS, ...(raw && typeof raw === 'object' ? raw : {}) };
  const pctField = (v, lo, hi, fallback) => {
    const n = Number(v);
    return Number.isFinite(n) && n >= lo && n <= hi ? roundTo(n, 2) : fallback;
  };
  c.riskPerTradePct = pctField(c.riskPerTradePct, 0.01, 10, CHARTER_DEFAULTS.riskPerTradePct);
  c.dailyLossCapPct = pctField(c.dailyLossCapPct, 0.01, 20, CHARTER_DEFAULTS.dailyLossCapPct);
  c.maxConsecutiveLosses = Math.max(1, Math.round(Number(c.maxConsecutiveLosses) || CHARTER_DEFAULTS.maxConsecutiveLosses));
  c.maxOpenPositions = Math.max(1, Math.round(Number(c.maxOpenPositions) || CHARTER_DEFAULTS.maxOpenPositions));
  c.reserveTargetMonths = Math.max(1, Math.round(Number(c.reserveTargetMonths) || CHARTER_DEFAULTS.reserveTargetMonths));
  c.minProfitMonths = Math.max(1, Math.round(Number(c.minProfitMonths) || CHARTER_DEFAULTS.minProfitMonths));
  c.minPairSample = Math.max(1, Math.round(Number(c.minPairSample) || CHARTER_DEFAULTS.minPairSample));
  c.minPairExpectancyR = clamp(Number(c.minPairExpectancyR) || 0, -5, 5);
  c.maxPairDdR = Math.max(1, Number(c.maxPairDdR) || CHARTER_DEFAULTS.maxPairDdR);
  c.minAdherencePct = Number.isFinite(Number(c.minAdherencePct)) ? clamp(Number(c.minAdherencePct), 0, 100) : CHARTER_DEFAULTS.minAdherencePct;
  c.maxBreachesPerMonth = Math.max(0, Math.round(Number(c.maxBreachesPerMonth) || 0));
  c.ownerDrawPct = clamp(Number(c.ownerDrawPct) || 0, 0, 100);
  c.personalCapitalPct = clamp(Number(c.personalCapitalPct) || 0, 0, 100);
  c.reservePct = clamp(Number(c.reservePct) || 0, 0, 100);
  c.researchPct = clamp(Number(c.researchPct) || 0, 0, 100);
  c.reviewNight = String(c.reviewNight || '').slice(0, 20) || CHARTER_DEFAULTS.reviewNight;
  c.notes = String(c.notes || '').slice(0, 600);
  c.adoptedOn = isDateISO(c.adoptedOn) ? String(c.adoptedOn) : '';
  c.version = Math.max(1, Math.round(Number(c.version) || 1));
  return c;
}

/* ---------------------------- tiny helpers ---------------------------- */

const clamp = (n, lo, hi) => Math.min(hi, Math.max(lo, n));
const sum = (arr, fn = (v) => v) => arr.reduce((a, v) => a + (Number(fn(v)) || 0), 0);
const avg = (arr) => (arr.length ? sum(arr) / arr.length : 0);
const pad2 = (n) => String(n).padStart(2, '0');
const roundTo = (n, d = 2) => {
  const f = Math.pow(10, d);
  return Math.round((Number(n) + Number.EPSILON) * f) / f;
};
const cssToken = (name, fallback) => {
  const v = String(getComputedStyle(document.documentElement).getPropertyValue(name) || '').trim();
  return v || (fallback == null ? '' : fallback);
};

function esc(value) {
  return String(value == null ? '' : value).replace(/[&<>"']/g, (c) => ({
    '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
  }[c]));
}
function uid(prefix = 'id') {
  const raw = (globalThis.crypto && globalThis.crypto.randomUUID)
    ? globalThis.crypto.randomUUID()
    : Math.random().toString(36).slice(2) + Date.now().toString(36);
  return prefix + '_' + raw.replace(/-/g, '').slice(0, 10);
}
function currencyInfo(code) {
  const c = code || (state && state.settings ? state.settings.currency : 'USD');
  return CURRENCIES[c] || CURRENCIES.USD;
}
function currencySymbol(code) { return currencyInfo(code).symbol; }

/* ---------------------------- dates ---------------------------- */

function isoOf(d) {
  const x = new Date(d);
  return `${x.getFullYear()}-${pad2(x.getMonth() + 1)}-${pad2(x.getDate())}`;
}
function todayISO() { return isoOf(new Date()); }
function parseISODate(iso) {
  if (!iso || !/^\d{4}-\d{2}-\d{2}$/.test(iso)) return new Date(NaN);
  const [y, m, d] = iso.split('-').map(Number);
  return new Date(y, m - 1, d, 12, 0, 0, 0);
}
function daysAgoISO(n) {
  const d = new Date();
  d.setHours(12, 0, 0, 0);
  d.setDate(d.getDate() - n);
  return isoOf(d);
}
function addDaysISO(iso, n) {
  const d = parseISODate(iso);
  d.setDate(d.getDate() + n);
  return isoOf(d);
}
function monthKeyOf(iso) { return String(iso || '').slice(0, 7); }
function currentMonthKey() { return todayISO().slice(0, 7); }
function shiftMonthKey(mk, delta) {
  const [y, m] = mk.split('-').map(Number);
  const d = new Date(y, m - 1 + delta, 1, 12);
  return `${d.getFullYear()}-${pad2(d.getMonth() + 1)}`;
}
function monthLabel(mk, short = false) {
  if (!mk) return '—';
  const [y, m] = mk.split('-').map(Number);
  const d = new Date(y, m - 1, 1, 12);
  return d.toLocaleDateString('en-US', short ? { month: 'short' } : { month: 'long', year: 'numeric' });
}
function lastMonths(n, end = currentMonthKey()) {
  const arr = [];
  for (let i = n - 1; i >= 0; i--) arr.push(shiftMonthKey(end, -i));
  return arr;
}
function monthOptions(n = 18, end = currentMonthKey()) {
  const arr = [];
  for (let i = 0; i < n; i++) arr.push(shiftMonthKey(end, -i));
  return arr;
}
function fmtDate(iso, opts = {}) {
  const d = parseISODate(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-GB', {
    day: 'numeric', month: 'short', year: opts.year === false ? undefined : 'numeric'
  });
}
function fmtDateShort(iso) {
  const d = parseISODate(iso);
  if (isNaN(d.getTime())) return '—';
  return d.toLocaleDateString('en-GB', { day: 'numeric', month: 'short' });
}
function daysBetween(aISO, bISO) {
  const a = parseISODate(aISO); const b = parseISODate(bISO);
  if (isNaN(a.getTime()) || isNaN(b.getTime())) return 0;
  return Math.round((b - a) / 86400000);
}
function daysSince(iso) { return Math.max(0, daysBetween(iso, todayISO())); }
function relDay(iso) {
  const n = daysBetween(iso, todayISO());
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n > 1 && n < 7) return `${n} days ago`;
  return fmtDate(iso);
}
function relTime(isoAt) {
  if (!isoAt) return '';
  const diff = Date.now() - new Date(isoAt).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return 'just now';
  if (mins < 60) return `${mins}m ago`;
  const hrs = Math.floor(mins / 60);
  if (hrs < 24) return `${hrs}h ago`;
  const days = Math.floor(hrs / 24);
  if (days < 30) return `${days}d ago`;
  return fmtDate(isoAt.slice(0, 10));
}
function dateInMonth(mk, day) {
  const [y, m] = mk.split('-').map(Number);
  const last = new Date(y, m, 0).getDate();
  let d = Math.min(day, last, 28);
  if (mk === currentMonthKey()) d = Math.min(d, new Date().getDate());
  return `${mk}-${pad2(Math.max(1, d))}`;
}

/* ---------------------------- money & numbers ---------------------------- */

function centsFrom(value) {
  if (typeof value === 'number' && Number.isFinite(value)) return Math.round(value * 100);
  const cleaned = String(value == null ? '' : value).replace(/,/g, '').replace(/[^\d.\-]/g, '');
  const n = parseFloat(cleaned);
  return Number.isFinite(n) ? Math.round(n * 100) : 0;
}
function numFrom(value) {
  const n = parseFloat(String(value == null ? '' : value).replace(/,/g, ''));
  return Number.isFinite(n) ? n : 0;
}
function numOrNull(value) {
  const raw = String(value == null ? '' : value).replace(/,/g, '').trim();
  if (raw === '') return null;
  const n = parseFloat(raw);
  return Number.isFinite(n) ? n : null;
}
function moneyInputValue(cents) {
  const n = Number(cents || 0);
  return n === 0 ? '' : (n / 100).toFixed(2);
}
function money(cents, opts = {}) {
  const n = Number(cents) || 0;
  const abs = Math.abs(n);
  const sym = currencySymbol(opts.code);
  const neg = n < 0;
  let body;
  if (opts.compact) {
    const dollars = abs / 100;
    const trim = (x) => String(Number(x.toFixed(1)));
    if (dollars >= 1000000000) body = trim(dollars / 1000000000) + 'B';
    else if (dollars >= 1000000) body = trim(dollars / 1000000) + 'M';
    else if (dollars >= 1000) body = trim(dollars / 1000) + 'K';
    else body = Math.round(dollars).toLocaleString('en-US');
  } else {
    const decimals = opts.decimals == null ? 2 : opts.decimals;
    body = (abs / 100).toLocaleString('en-US', {
      minimumFractionDigits: decimals, maximumFractionDigits: decimals
    });
  }
  const sign = neg ? '−' : (opts.sign && n > 0 ? '+' : '');
  return sign + sym + body;
}
function moneyPlain(cents, decimals = 2) {
  return (Math.abs(Number(cents) || 0) / 100).toLocaleString('en-US', {
    minimumFractionDigits: decimals, maximumFractionDigits: decimals
  });
}
function usdMoney(cents) {
  const n = Number(cents) || 0;
  return (n < 0 ? '−' : n > 0 ? '+' : '') + '$' + moneyPlain(Math.abs(n));
}
function pct(value, decimals = 0) {
  const n = Number(value) || 0;
  return `${n > 0 ? '' : ''}${n.toFixed(decimals)}%`;
}
function pctRatio(value, decimals = 0) {
  return `${((Number(value) || 0) * 100).toFixed(decimals)}%`;
}
function rLabel(r) {
  if (r == null || !Number.isFinite(Number(r))) return '—';
  const n = Number(r);
  return `${n > 0 ? '+' : ''}${n.toFixed(2)}R`;
}
function lotsLabel(lots) {
  const n = Number(lots);
  if (!Number.isFinite(n) || n === 0) return '0.00';
  return n.toFixed(n < 1 ? 3 : 2);
}
function compactNumber(cents) {
  const abs = Math.abs(Number(cents) || 0) / 100;
  if (abs >= 1000000) return roundTo(abs / 1000000, 1) + 'M';
  if (abs >= 1000) return roundTo(abs / 1000, abs >= 10000 ? 0 : 1) + 'K';
  return String(Math.round(abs));
}

/* ---------------------------- pairs & trade math ---------------------------- */

function pairInfo(pair) {
  const info = PAIR_DATA[pair];
  if (info) return info;
  // Unknown pair: forex-major defaults so custom instruments still work.
  return { pip: 0.0001, pipValue: 10, digits: 5, base: 1.0 };
}

// USD value of one pip on one standard lot, at a given pair price.
// USD-quoted pairs are fixed; USD-based pairs (USD/JPY, USD/CHF) divide by
// the rate; crosses convert through the quote currency.
function pipValueUsd(pair, rate) {
  const info = pairInfo(pair);
  const parts = String(pair || '').split('/');
  const baseCcy = parts[0];
  const quoteCcy = parts[1];
  const contract = Number(info.contract) || 100000;
  const price = Number(rate) > 0 ? Number(rate) : info.base;
  if (quoteCcy === 'USD') return info.pip * contract;
  if (baseCcy === 'USD') return (info.pip * contract) / price;
  return info.pip * contract * (USD_PER_QUOTE[quoteCcy] || 1);
}

function tradeMath(spec) {
  const info = pairInfo(spec.pair);
  const dir = spec.direction === 'short' ? -1 : 1;
  const entry = numOrNull(spec.entry);
  const exit = numOrNull(spec.exit);
  const sl = numOrNull(spec.sl);
  const lots = numOrNull(spec.lots) || 0;
  let pips = null, riskPips = null, r = null, estimateCents = null;
  let riskCents = null, stopError = '';
  const entryRate = Number.isFinite(entry) ? entry : info.base;
  const exitRate = Number.isFinite(exit) ? exit : entryRate;
  const pipValueEntry = pipValueUsd(spec.pair, entryRate);
  const pipValueExit = pipValueUsd(spec.pair, exitRate);
  if (Number.isFinite(entry) && Number.isFinite(exit)) {
    pips = ((exit - entry) / info.pip) * dir;
    if (Number.isFinite(lots) && lots > 0) {
      estimateCents = Math.round(pips * pipValueExit * lots * 100);
    }
  }
  if (Number.isFinite(entry) && Number.isFinite(sl)) {
    riskPips = Math.abs(entry - sl) / info.pip;
    if ((dir === 1 && sl >= entry) || (dir === -1 && sl <= entry)) {
      stopError = 'Stop is on the wrong side of entry for this direction.';
    } else {
      if (riskPips > 0 && Number.isFinite(lots) && lots > 0) {
        riskCents = Math.round(riskPips * pipValueEntry * lots * 100);
      }
      if (pips != null && riskPips > 0) r = pips / riskPips;
    }
  }
  return {
    pips: pips == null ? null : roundTo(pips, 1),
    riskPips: riskPips == null ? null : roundTo(riskPips, 1),
    r: r == null ? null : roundTo(r, 2),
    estimateCents,
    riskCents,
    stopError,
    pipValue: roundTo(pipValueEntry, 2),
    pipValueExit: roundTo(pipValueExit, 2),
    pip: info.pip
  };
}

function mountThemeCss() {
  const css = Object.keys(THEMES)
    .map((key) => 'html[data-theme="' + key + '"] {\n' + themeDecls(THEMES[key]) + '\n}')
    .join('\n');
  let el = document.getElementById('lw-theme-css');
  if (!el) {
    el = document.createElement('style');
    el.id = 'lw-theme-css';
    document.head.appendChild(el);
  }
  el.textContent = css;
}
function storedThemeHint() {
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (!raw) return 'ink';
    const blob = JSON.parse(raw);
    return normaliseThemeChoice(blob && blob.settings ? blob.settings.theme : '');
  } catch (e) {
    return 'ink';
  }
}
function applyTheme() {
  const name = themeResolved(state.settings.theme);
  document.documentElement.setAttribute('data-theme', name);
  const meta = document.querySelector('meta[name="theme-color"]');
  if (meta && THEMES[name]) meta.setAttribute('content', THEMES[name].surfaces.bg);
  return name;
}
function watchSystemTheme() {
  if (!window.matchMedia) return;
  const mq = window.matchMedia('(prefers-color-scheme: light)');
  const onChange = () => { if (normaliseThemeChoice(state.settings.theme) === 'auto') applyTheme(); };
  if (mq.addEventListener) mq.addEventListener('change', onChange);
  else if (mq.addListener) mq.addListener(onChange);
}
function setThemeChoice(value) {
  if (!themeChoiceList().includes(value)) { toast('That theme is not in the list.', 'error'); return; }
  state.settings.theme = value;
  const applied = applyTheme();
  const label = value === 'auto' ? THEMES[applied].label + ' (system)' : THEMES[value].label;
  logAudit('theme', 'Theme changed to ' + label);
  saveState();
  renderAppKeepingScroll(ui.page);
  toast('Theme is ' + label + '.', 'success');
}

function normalizeState(raw) {
  const base = emptyState();
  if (!raw || typeof raw !== 'object') return base;
  const s = { ...base, ...raw };
  s.settings = { ...defaultSettings(), ...(raw.settings || {}) };
  if (!CURRENCIES[s.settings.currency]) s.settings.currency = 'USD';
  // Legacy builds had a dead homeCurrency field — never trust it unless the
  // user saved it from the new settings form.
  if (s.settings.homeCurrencySet !== true || !CURRENCIES[s.settings.homeCurrency]) s.settings.homeCurrency = 'KES';
  const estRate = Number(s.settings.fxRate);
  s.settings.fxRate = Number.isFinite(estRate) && estRate > 0 ? estRate : 0;
  s.settings.theme = normaliseThemeChoice(s.settings.theme);
  s.settings.shotsCloud = s.settings.shotsCloud === true;
  const arrayKeys = ['accounts', 'trades', 'btTrades', 'payouts', 'incomes', 'expenses', 'categories', 'goals', 'goalLog', 'adjustments', 'lessonsDone', 'reviews', 'fearCards', 'fearImports', 'pools', 'dutyLog', 'breaches', 'documents', 'strategies', 'backtests', 'scaleLog', 'watch', 'shots', 'audit'];
  arrayKeys.forEach((k) => { if (!Array.isArray(s[k])) s[k] = base[k]; });
  if (!Array.isArray(s.duties) || !s.duties.length) s.duties = defaultDuties();
  s.charter = normalizeCharter(raw.charter);
  if (!s.categories.length) s.categories = makeCategories();
  s.categories = s.categories.map((c) => ({
    ...c,
    id: c.id || uid('cat'),
    group: CATEGORY_GROUPS[c.group] ? c.group : 'needs',
    budgetCents: Math.round(Number(c.budgetCents) || 0)
  }));
  s.accounts = s.accounts.map((a) => ({
    ...a,
    currency: CURRENCIES[a.currency] ? a.currency : 'USD',
    sizeCents: Math.round(Number(a.sizeCents) || 0),
    startingCents: Math.round(Number(a.startingCents ?? a.sizeCents) || 0),
    targetPct: Number(a.targetPct) || 0,
    dailyDdPct: Number(a.dailyDdPct) || 0,
    maxDdPct: Number(a.maxDdPct) || 0,
    splitPct: Number(a.splitPct) || 0,
    minDays: Number(a.minDays) || 0,
    endsOn: isDateISO(a.endsOn) ? a.endsOn : '',
    payoutMinCents: Math.round(Number(a.payoutMinCents) || 0),
    kind: a.kind || 'challenge',
    ddBasis: a.ddBasis === 'trailing' ? 'trailing' : 'static',
    baseRiskPct: (a.baseRiskPct === null || a.baseRiskPct === undefined || a.baseRiskPct === '')
      ? null
      : clamp(Number(a.baseRiskPct) || 0, 0, 100),
    riskLadder: Array.isArray(a.riskLadder)
      ? a.riskLadder
        .map((r) => ({ thresholdPct: Number(r && r.thresholdPct) || 0, riskPct: Math.max(0, Number(r && r.riskPct) || 0) }))
        .filter((r) => r.thresholdPct > 0)
        .sort((x, y) => x.thresholdPct - y.thresholdPct)
      : []
  }));
  s.trades = s.trades.map((t) => ({
    ...t,
    pnlCents: Math.round(Number(t.pnlCents) || 0),
    feesCents: Math.round(Number(t.feesCents) || 0),
    lots: Number(t.lots) || 0,

    // which used to file "unknown" as a measured breakeven and pull every R
    // average toward zero, so blank stays blank here.
    r: t.r == null || t.r === '' || !Number.isFinite(Number(t.r)) ? null : Number(t.r),
    finalSl: t.finalSl == null || t.finalSl === '' || !Number.isFinite(Number(t.finalSl)) ? null : Number(t.finalSl),
    setup: String(t.setup || '').slice(0, 60),
    evidence: String(t.evidence || '').slice(0, 200),
    startHM: /^([01]?\d|2[0-3]):[0-5]\d$/.test(String(t.startHM || '')) ? String(t.startHM) : '',
    mt5Id: t.mt5Id == null ? null : String(t.mt5Id)

function saveState() {

  } catch (err) {
    toast('Could not save — browser storage is full or blocked.', 'error');

  if (typeof cloudLedgerChanged === 'function') cloudLedgerChanged();

    if (!raw) return null;
    return normalizeState(JSON.parse(raw));
  } catch (err) {
    try { localStorage.setItem(DB_KEY + '_corrupt', localStorage.getItem(DB_KEY) || ''); } catch (e) {}
