      state.btTrades.forEach((t) => { if (t.strategyId === id) t.strategyId = ''; });
      logAudit('strategy', `Deleted playbook: ${s.name}${logged.length ? ` · ${logged.length} logged setups kept unlinked` : ''}`);
      commit('Playbook deleted.', 'strategy', 'info');
    }
  });
}

function saveBacktest(form) {
  const fd = new FormData(form);
  const id = String(fd.get('id') || '');
  const sample = Math.round(numFrom(fd.get('sample')));
  if (!(sample >= 1)) { toast('A test needs a sample size. Without one it is an opinion.', 'error'); return; }
  const cur = tradingBase();
  const from = isDateISO(fd.get('from')) ? String(fd.get('from')) : '';
  const to = isDateISO(fd.get('to')) ? String(fd.get('to')) : '';
  if (from && to && to < from) { toast('The test period ends before it starts.', 'error'); return; }
  const strategyId = String(fd.get('strategyId') || '');
  if (strategyId && !state.strategies.find((s) => s.id === strategyId)) {
    toast('That playbook is no longer in the lab. Write it first.', 'error');
    return;
  }
  const record = {
    strategyId,
    pair: String(fd.get('pair') || '').slice(0, 12),
    from,
    to,
    sample,
    netCents: centsFrom(fd.get('net')),
    maxDDCents: Math.abs(centsFrom(fd.get('maxDD'))),
    avgR: numOrNull(fd.get('avgR')),
    costCents: Math.abs(centsFrom(fd.get('cost'))),
    currency: cur,
    note: String(fd.get('note') || '').trim().slice(0, 240),
    date: isDateISO(fd.get('date')) ? String(fd.get('date')) : todayISO()
  };
  const sName = (state.strategies.find((s) => s.id === strategyId) || {}).name;
  const existing = id ? state.backtests.find((b) => b.id === id) : null;
  if (existing) {
    Object.assign(existing, record);
    logAudit('strategy', `Edited test record · ${sample} trades${sName ? ` · ${sName}` : ''}`);
    commit('Test record updated.', 'strategy');
  } else {
    state.backtests.push({ id: uid('bt'), ...record, createdAt: new Date().toISOString() });
    logAudit('strategy', `Recorded test · ${sample} trades${sName ? ` · ${sName}` : ''} · ${money(record.netCents, { code: cur, sign: true })}`);
    commit(record.netCents <= 0
      ? 'Test logged. A negative sample is still evidence — it is what stops you scaling into it.'
      : 'Test logged.', 'strategy');
  }
}

function handleDeleteBacktest(id) {
  const b = state.backtests.find((x) => x.id === id);
  if (!b) return;
  const logged = state.btTrades.filter((t) => t.backtestId === id);
  confirmDialog({
    title: 'Delete this test record?',
    text: `${b.sample} trades of evidence come off the lab. ${logged.length ? `The ${logged.length} setup${logged.length === 1 ? '' : 's'} logged to it stay in the backtest lane — they just stop being grouped here.` : ''} If the numbers were wrong, edit the record instead of losing it.`,
    confirmLabel: 'Delete record',
    onConfirm: () => {
      state.backtests = state.backtests.filter((x) => x.id !== id);
      state.btTrades.forEach((t) => { if (t.backtestId === id) t.backtestId = ''; });
      logAudit('strategy', `Deleted test record (${b.sample} trades)`);
      commit('Test record deleted.', 'strategy', 'info');
    }
  });
}

function fillBacktestFromLog(id) {
  const b = state.backtests.find((x) => x.id === id);
  if (!b) { toast('That test record is no longer in the lab.', 'error'); return; }
  const rows = state.btTrades.filter((t) => t.backtestId === id);
  if (!rows.length) { toast('Nothing is logged to this record yet, so there is nothing to roll up.', 'error'); return; }
  const st = statsFor(rows);
  const dates = rows.map((t) => t.date).filter(isDateISO).sort();
  const from = b.from && isDateISO(b.from) ? b.from : (dates[0] || '');
  const to = b.to && isDateISO(b.to) ? b.to : (dates[dates.length - 1] || '');
  Object.assign(b, {
    sample: st.count,
    avgR: st.avgR,
    netCents: st.net,
    maxDDCents: st.maxDD,
    costCents: Math.abs(sum(rows, (t) => Number(t.feesCents) || 0)),
    from, to
  });
  state.backtests = normalizeState({ ...state, backtests: state.backtests }).backtests;
  logAudit('strategy', `Rolled up test record from ${st.count} logged setups`);
  commit(`Filled from ${st.count} logged setups: ${st.avgR == null ? '—' : `${st.avgR.toFixed(2)}R average`}.`, 'strategy');
}

function approveScale(accountId, toCents) {
  const acc = accountById(accountId);
  if (!acc) { toast('That account is no longer in the register.', 'error'); return; }
  const gates = scaleGates();
  const failing = gates.filter((g) => !g.pass);
  if (failing.length) {
    toast(`Locked by the gates: ${failing.map((g) => g.label).join(', ')}. Size follows the evidence, not the week.`, 'error');
    return;
  }
  const cur = accountCurrency(acc);
  const to = Math.round(Number(toCents) || 0);
  if (!(to > acc.sizeCents)) {
    toast('A scaling decision has to be bigger than the size you are already on.', 'error');
    return;
  }
  const riskNow = Math.round(acc.sizeCents * charter().riskPerTradePct / 100);
  const riskNext = Math.round(to * charter().riskPerTradePct / 100);
  confirmDialog({
    title: 'Log this scaling decision?',
    text: `${esc(acc.name)}: ${esc(money(acc.sizeCents, { code: cur }))} to ${esc(money(to, { code: cur }))}. 1R moves from ${esc(money(riskNow, { code: cur }))} to ${esc(money(riskNext, { code: cur }))}. All ${gates.length} gates pass today. The size itself only changes when you actually buy the bigger account.`,
    confirmLabel: 'Approve and log',
    danger: false,
    onConfirm: () => {
      state.scaleLog.push({
        id: uid('scale'),
        date: todayISO(),
        accountId: acc.id,
        fromCents: acc.sizeCents,
        toCents: to,
        currency: cur,
        note: '',
        gates: gates.map((g) => ({ label: g.label, pass: g.pass, detail: g.detail })),
        createdAt: new Date().toISOString()
      });
      logAudit('scale', `Approved scale on ${acc.name}: ${money(acc.sizeCents, { code: cur })} to ${money(to, { code: cur })}`);
      commit('Decision logged with the gates that justified it. Update the account size when the new one is paid for.', 'scale');
    }
  });
}

function handleDeleteScale(id) {
  const x = state.scaleLog.find((e) => e.id === id);
  if (!x) return;
  confirmDialog({
    title: 'Delete this decision?',
    text: `The ${esc(fmtDate(x.date))} entry for ${esc((accountById(x.accountId) || {}).name || 'a removed account')} goes. Deleted decisions look like decisions that were never made.`,

      logAudit('scale', 'Deleted a scaling decision from the log');

    }
  });
}

function saveGoal(form) {
  const fd = new FormData(form);
  const id = String(fd.get('id') || '');
  const name = String(fd.get('name') || '').trim();
  const targetCents = centsFrom(fd.get('target'));
  if (!name) { toast('Give the goal a name.', 'error'); return; }
  if (targetCents <= 0) { toast('Target must be greater than zero.', 'error'); return; }
  const savedCents = Math.max(0, centsFrom(fd.get('saved')));
  const type = GOAL_TYPES[String(fd.get('type'))] ? String(fd.get('type')) : 'purchase';
  const deadline = String(fd.get('deadline') || '');
  const note = String(fd.get('note') || '').slice(0, 300);
  const existing = id ? goalById(id) : null;
  if (existing) {
    const diff = savedCents - existing.savedCents;
    Object.assign(existing, { name: name.slice(0, 80), targetCents, savedCents, type, deadline, note });
    if (diff !== 0) {
      state.goalLog.unshift({
        id: uid('gl'), goalId: existing.id, date: todayISO(),
        amountCents: diff, note: 'Manual correction'
      });
    }
    logAudit('goal', `Updated goal ${existing.name}`);
    commit('Goal updated.', ui.page);
  } else {
    const goal = {
      id: uid('g'), name: name.slice(0, 80), type, targetCents, savedCents,
      deadline, note, createdAt: new Date().toISOString()
    };
    state.goals.push(goal);
    if (savedCents > 0) {
      state.goalLog.unshift({
        id: uid('gl'), goalId: goal.id, date: todayISO(),
        amountCents: savedCents, note: 'Opening balance'
      });
    }
    logAudit('goal', `Created goal ${goal.name} (${money(targetCents)})`);
    commit('Goal created.', ui.page);
  }
}

function downloadFile(filename, content, mime = 'text/plain;charset=utf-8') {
  try {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = filename;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    return true;
  } catch (e) {
    toast('Download failed in this browser. Try a different browser.', 'error');
    return false;
  }
}

function csvEscape(value) {
  if (value == null) return '';
  if (typeof value === 'number') return String(value);
  let s = String(value);
  if (/^[=+\-@\t\r]/.test(s)) s = "'" + s;
  if (/[",\n\r]/.test(s)) s = '"' + s.replace(/"/g, '""') + '"';
  return s;
}
function csvMoney(cents) { return (Number(cents || 0) / 100).toFixed(2); }
function csvRows(rows) {
  return '\ufeff' + rows.map((r) => r.map(csvEscape).join(',')).join('\r\n');
}

  if (downloadFile(`ledgerwise-fx-backup-${todayISO()}.json`, JSON.stringify(payload, null, 2), 'application/json')) {

    toast('Full backup downloaded. Keep it somewhere safe.', 'info');
  }
}

/* ---------------------------- MT5 report import ---------------------------- */

let pendingMt5Trades = null;

function mt5CellText(html) {
  return String(html || '')
    .replace(/<[^>]*>/g, ' ')
    .replace(/&nbsp;|&#160;/gi, ' ')
    .replace(/&amp;/gi, '&')
    .replace(/&lt;/gi, '<')
    .replace(/&gt;/gi, '>')
    .replace(/&quot;/gi, '"')
    .replace(/&#39;|&apos;/gi, "'")
    .replace(/\s+/g, ' ')
    .trim();
}

// Pull every table out of the report as arrays of cell text, no DOM needed.
// Real MT5 reports hide spacer cells (class="hidden") and merge cells with
// colspan, so cells are dropped/expanded to keep every row on the same grid.
function mt5ParseTables(text) {
  const tables = [];
  const tableRe = /<table\b[^>]*>([\s\S]*?)<\/table>/gi;
  let m;
  while ((m = tableRe.exec(text))) {
    const rows = [];
    const rowRe = /<tr\b[^>]*>([\s\S]*?)<\/tr>/gi;
    let r;
    while ((r = rowRe.exec(m[1]))) {
      const cells = [];
      const cellRe = /<t[dh]\b([^>]*)>([\s\S]*?)<\/t[dh]>/gi;
      let c;
      while ((c = cellRe.exec(r[1]))) {
        const attrs = c[1] || '';
        if (/class\s*=\s*"[^"]*\bhidden\b/i.test(attrs)) continue;
        const span = Math.max(1, parseInt(/colspan\s*=\s*"(\d+)"/i.exec(attrs)?.[1] || '1', 10) || 1);
        const txt = mt5CellText(c[2]);
        for (let i = 0; i < span; i++) cells.push(txt);
      }
      if (cells.some((x) => x !== '')) rows.push(cells);
    }
    if (rows.length) tables.push(rows);
  }
  return tables;
}

/* ---- Excel (.xlsx), old-Excel HTML (.xls) and CSV/TSV variants of the same report ---- */

function mt5DecodeBytes(u8) {
  let text;
  try { text = new TextDecoder('utf-8', { fatal: true }).decode(u8); }
  catch (e) { text = new TextDecoder('windows-1252').decode(u8); }
  if (text.charCodeAt(0) === 0xFEFF) text = text.slice(1);
  return text;
}

function mt5SplitRow(line, d) {
  const out = [];
  let cur = '';
  let quoted = false;
  const s = String(line);
  for (let i = 0; i < s.length; i++) {
    const ch = s[i];
    if (quoted) {
      if (ch === '"') {
        if (s[i + 1] === '"') { cur += '"'; i++; } else quoted = false;
      } else cur += ch;
    } else if (ch === '"') quoted = true;
    else if (ch === d) { out.push(cur); cur = ''; }
    else cur += ch;
  }
  out.push(cur);
  return out.map((x) => String(x).replace(/\s+/g, ' ').trim());
}

// Tab or semicolon or comma separated grid, quoted cells honoured.
function mt5ParseGrid(text) {
  const lines = String(text).split(/\r?\n/).filter((l) => l.replace(/["']/g, '').trim() !== '');
  if (lines.length < 2) return [];
  let best = 0;
  let delim = '';
  for (const d of ['\t', ';', ',']) {
    const n = mt5SplitRow(lines[0], d).length;
    if (n > best) { best = n; delim = d; }
  }
  if (best < 4) return [];
  const rows = lines.map((l) => mt5SplitRow(l, delim));
  const width = Math.max(...rows.map((r) => r.length));
  const grid = rows.map((r) => { while (r.length < width) r.push(''); return r; });
  // European Excel saves 0.29 as 0,29 when the delimiter is ; or tab. Without
  // this a KSh/USD figure would be read a hundred times too large.
  const decimalComma = delim !== ',' && grid.some((r) => r.some((c) => /^[+-]?\d{1,3}(?:[.\s]\d{3})*,\d+$/.test(c)));
  if (!decimalComma) return [grid];
  return [grid.map((r) => r.map((c) => /^[+-]?\d{1,3}(?:[.\s]\d{3})*,\d+$/.test(c)
    ? c.replace(/[.\s]/g, '').replace(',', '.')
    : c))];
}

function mt5Pad2(v) {
  const s = String(v);
  return s.length < 2 ? '0' + s : s;
}

function mt5SerialToText(n) {
  const ms = Math.round((n - 25569) * 86400000);
  const d = new Date(ms);
  if (!Number.isFinite(d.getTime())) return null;
  const day = d.getUTCDate();
  const time = mt5Pad2(d.getUTCHours()) + ':' + mt5Pad2(d.getUTCMinutes()) + ':' + mt5Pad2(d.getUTCSeconds());
  return `${d.getUTCFullYear()}.${mt5Pad2(d.getUTCMonth() + 1)}.${mt5Pad2(day)} ${time}`;
}

// Rewrite any date-looking cell to the shape the parsers expect: YYYY.MM.DD HH:MM:SS.
// Excel likes to re-render MT5 times as dd/mm/yyyy or as a serial number.
function mt5CanonicalDate(v) {
  const s = String(v == null ? '' : v).trim();
  if (!s) return null;
  let m = /^(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?(?:\s*([AP]M))?$/i.exec(s);
  if (m) {
    let h = m[4] == null ? null : Number(m[4]);
    if (m[7] && h != null) { if (/pm/i.test(m[7]) && h < 12) h += 12; if (/am/i.test(m[7]) && h === 12) h = 0; }
    return `${m[1]}.${mt5Pad2(m[2])}.${mt5Pad2(m[3])}` + (h == null ? '' : ` ${mt5Pad2(h)}:${mt5Pad2(m[5] || 0)}:${mt5Pad2(m[6] || 0)}`);
  }
  m = /^(\d{1,2})[.\/-](\d{1,2})[.\/-](\d{4})(?:\s+(\d{1,2}):(\d{2})(?::(\d{2}))?)?(?:\s*([AP]M))?$/i.exec(s);
  if (m) {
    const a = Number(m[1]);
    const b = Number(m[2]);
    const day = a > 12 ? a : b;
    const mon = a > 12 ? b : a;
    let h = m[4] == null ? null : Number(m[4]);
    if (m[7] && h != null) { if (/pm/i.test(m[7]) && h < 12) h += 12; if (/am/i.test(m[7]) && h === 12) h = 0; }
    return `${m[3]}.${mt5Pad2(mon)}.${mt5Pad2(day)}` + (h == null ? '' : ` ${mt5Pad2(h)}:${mt5Pad2(m[5] || 0)}:${mt5Pad2(m[6] || 0)}`);
  }
  if (/^\d{5}(\.\d+)?$/.test(s)) return mt5SerialToText(Number(s));
  return null;
}

// A bare 5-digit number is only a date when it sits under a time/date column,
// otherwise it is a price, a ticket or a balance.
function mt5IsSerialDate(s) {
  const m = /^(\d{5})(?:\.\d+)?$/.exec(s);
  if (!m) return false;
  const n = Number(m[1]);
  return n >= 20000 && n < 80000;
}

function mt5HasDateShape(s) {
  return /^\d{4}[.\/-]\d{1,2}[.\/-]\d{1,2}/.test(s) || /^\d{1,2}[.\/-]\d{1,2}[.\/-]\d{4}/.test(s);
}

function mt5NormalizeTables(tables) {
  return tables.map((rows) => {
    const headRow = rows.find((r) => r.some((c) => /time|date/i.test(String(c))));
    const dateCols = new Set();
    if (headRow) headRow.forEach((c, i) => { if (/time|date/i.test(String(c).toLowerCase())) dateCols.add(i); });
    return rows.map((r) => r.map((c, i) => {
      const s = String(c == null ? '' : c).trim();
      if (!s) return c;
      if (mt5IsSerialDate(s)) return dateCols.has(i) ? (mt5SerialToText(Number(s)) || c) : c;
      if (!mt5HasDateShape(s)) return c;
      return mt5CanonicalDate(s) || c;
    }));
  });
}

function mt5XmlText(s) {
  return String(s == null ? '' : s)
    .replace(/<[^>]*>/g, '')
    .replace(/&lt;/g, '<')
    .replace(/&gt;/g, '>')
    .replace(/&quot;/g, '"')
    .replace(/&#(\d+);/g, (m, c) => String.fromCodePoint(Number(c)))
    .replace(/&#x([0-9a-f]+);/gi, (m, c) => String.fromCodePoint(parseInt(c, 16)))
    .replace(/&apos;/g, "'")
    .replace(/&nbsp;/gi, ' ')
    .replace(/&amp;/g, '&')
    .replace(/\s+/g, ' ')
    .trim();
}

async function mt5ZipRead(buf) {
  const u8 = new Uint8Array(buf);
  const dv = new DataView(buf);
  if (u8.length < 22) throw new Error('empty');
  let eocd = -1;
  for (let i = u8.length - 22; i >= Math.max(0, u8.length - 66000); i--) {
    if (dv.getUint32(i, true) === 0x06054b50) { eocd = i; break; }
  }
  if (eocd === -1) throw new Error('no central directory');
  const count = dv.getUint16(eocd + 10, true);
  const dec = new TextDecoder('utf-8');
  let off = dv.getUint32(eocd + 16, true);
  const files = {};
  for (let n = 0; n < count; n++) {
    if (off + 46 > u8.length || dv.getUint32(off, true) !== 0x02014b50) break;
    const method = dv.getUint16(off + 10, true);
    const csize = dv.getUint32(off + 20, true);
    const nameLen = dv.getUint16(off + 28, true);
    const extraLen = dv.getUint16(off + 30, true);
    const cmtLen = dv.getUint16(off + 32, true);
    const lho = dv.getUint32(off + 42, true);
    const name = dec.decode(u8.subarray(off + 46, off + 46 + nameLen));
    if (lho + 30 <= u8.length) {
      const lnl = dv.getUint16(lho + 26, true);
      const lel = dv.getUint16(lho + 28, true);
      const from = lho + 30 + lnl + lel;
      files[name] = { method, data: u8.subarray(from, from + csize) };
    }
    off += 46 + nameLen + extraLen + cmtLen;
  }
  return files;
}

async function mt5EntryText(files, name) {
  const e = files[name];
  if (!e) return '';
  if (e.method === 0) return new TextDecoder('utf-8').decode(e.data);
  if (typeof DecompressionStream !== 'function') throw new Error('no-inflate');
  const body = new Blob([e.data]).stream().pipeThrough(new DecompressionStream('deflate-raw'));
  return new TextDecoder('utf-8').decode(await new Response(body).arrayBuffer());
}

function mt5SharedStrings(xml) {
  const out = [];
  const siRe = /<si(?:\s[^>]*)?>([\s\S]*?)<\/si>/gi;
  let m;
  while ((m = siRe.exec(xml))) {
    const tRe = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/gi;
    let s = '';
    let t;
    while ((t = tRe.exec(m[1]))) s += mt5XmlText(t[1]);
    out.push(s);
  }
  return out;
}

function mt5SheetRows(xml, shared) {
  const rows = [];
  const rowRe = /<row(?:\s[^>]*)?>([\s\S]*?)<\/row>/gi;
  let r;
  while ((r = rowRe.exec(xml))) {
    const cells = [];
    const cRe = /<c\b([^>]*?)(?:\/>|>([\s\S]*?)<\/c>)/gi;
    let c;
    while ((c = cRe.exec(r[1]))) {
      const attrs = c[1] || '';
      const body = c[2] || '';
      const ref = /\br\s*=\s*"([A-Za-z]+)/.exec(attrs);
      let idx = cells.length;
      if (ref) {
        let n = 0;
        for (const ch of ref[1].toUpperCase()) n = n * 26 + (ch.charCodeAt(0) - 64);
        idx = Math.max(0, n - 1);
      }
      const tm = /\bt\s*=\s*"([^"]+)"/.exec(attrs);
      const type = tm ? tm[1] : '';
      let val = '';
      if (type === 'inlineStr') {
        const t = /<t(?:\s[^>]*)?>([\s\S]*?)<\/t>/i.exec(body);
        val = t ? mt5XmlText(t[1]) : '';
      } else {
        const v = /<v(?:\s[^>]*)?>([\s\S]*?)<\/v>/i.exec(body);
        const raw = v ? v[1] : '';
        val = type === 's' ? (shared[Number(raw)] == null ? '' : shared[Number(raw)]) : mt5XmlText(raw);
      }
      while (cells.length < idx) cells.push('');
      cells.push(val);
    }
    if (cells.some((x) => x !== '')) rows.push(cells);
  }
  return rows;
}

// An .xlsx file is a zip of XML parts: shared strings plus one sheet per tab.
async function mt5TablesFromXlsx(buf) {
  const files = await mt5ZipRead(buf);
  const shared = mt5SharedStrings(await mt5EntryText(files, 'xl/sharedStrings.xml'));
  const sheets = Object.keys(files).filter((n) => /^xl\/worksheets\/[\w.-]+\.xml$/.test(n)).sort();
  const tables = [];
  for (const n of sheets) {
    const rows = mt5SheetRows(await mt5EntryText(files, n), shared);
    if (rows.length > 1) tables.push(rows);
  }
  return tables;
}

function mt5Num(v) {  if (v == null) return null;
  const n = parseFloat(String(v).replace(/[\s,']/g, ''));
  return Number.isFinite(n) ? n : null;
}

function mt5SymbolPair(sym) {
  const clean = String(sym || '').toUpperCase().replace(/[^A-Z]/g, '');
  for (const key of PAIR_OPTIONS) {
    if (key.replace('/', '') === clean) return key;
  }
  // Broker-suffixed symbols (USDCHF.x, XAUUSD.m) — try the first six letters.
  if (clean.length > 6) {
    const six = clean.slice(0, 6);
    for (const key of PAIR_OPTIONS) {
      if (key.replace('/', '') === six) return key;
    }
  }
  if (clean.length === 6) return clean.slice(0, 3) + '/' + clean.slice(3);
  return String(sym || '').trim();
}

function mt5DateTime(s) {
  const v = mt5CanonicalDate(s) || String(s || '');
  const m = /(\d{4})[.\/-](\d{1,2})[.\/-](\d{1,2})(?:\s+(\d{1,2}):(\d{2}))?/.exec(v);
  if (!m) return { date: null, hour: null, hm: '' };
  return {
    date: `${m[1]}-${mt5Pad2(m[2])}-${mt5Pad2(m[3])}`,
    hour: m[4] != null ? Number(m[4]) : null,
    hm: m[4] != null ? `${mt5Pad2(m[4])}:${m[5] != null ? mt5Pad2(m[5]) : '00'}` : ''
  };
}

function mt5Session(hour) {
  if (hour == null || !Number.isFinite(hour)) return 'Other';
  if (hour < 7) return 'Asia';
  if (hour < 12) return 'London';
  if (hour < 13) return 'London/NY overlap';
  if (hour < 17) return 'New York';
  return 'Other';
}

// A real MT5 report is one big table with section headers inside it
// (title rows, then "Positions", "Orders", "Deals"), so scan every row
// for the matching header, not just the first.
function mt5FindTable(tables, must) {
  for (const rows of tables) {
    for (let i = 0; i < rows.length; i++) {
      const head = rows[i].map((h) => String(h).toLowerCase().trim());
      if (must.every((m) => head.some((h) => h.includes(m)))) return { head, rows: rows.slice(i) };
    }
  }
  return null;
}

// Data rows always open with a "YYYY.MM.DD" timestamp; anything else means
// the section ended (next header, separator, or title row).
function mt5IsDataRow(cells) {
  const list = (cells || []).map((c) => String(c || '').trim());
  if (mt5HasDateShape(list[0])) return true;
  // Excel sometimes moves the ticket to the front, so a row still counts when
  // it carries both an open and a close timestamp anywhere in it.
  let hits = 0;
  for (const c of list) if (mt5HasDateShape(c)) hits++;
  return hits >= 2;
}

// Preferred source: the report's closed-positions table. One row = one trade.
function mt5ParsePositions(tables) {
  const found = mt5FindTable(tables, ['position', 'symbol', 'profit']);
  if (!found) return [];
  const { head, rows } = found;
  const col = (name, after = -1) => head.findIndex((h, i) => i > after && h.includes(name));
  const iPos = col('position');
  const iSym = col('symbol');
  const iType = col('type');
  const iVol = col('volume') !== -1 ? col('volume') : col('lots');
  const iSl = head.findIndex((h) => h.replace(/\s/g, '').startsWith('s/l'));
  const iTp = head.findIndex((h) => h.replace(/\s/g, '').startsWith('t/p'));
  const iComm = col('commission');
  const iSwap = col('swap');
  const iProfit = col('profit');
  const times = head.map((h, i) => (h.includes('time') ? i : -1)).filter((i) => i !== -1);
  const prices = head.map((h, i) => (h.includes('price') ? i : -1)).filter((i) => i !== -1);
  if (iPos === -1 || iSym === -1 || iType === -1 || iVol === -1 || times.length < 1 || prices.length < 1) return [];
  const out = [];
  for (const cells of rows.slice(1)) {
    if (!mt5IsDataRow(cells)) break;
    const type = String(cells[iType] || '').toLowerCase();
    if (!type.includes('buy') && !type.includes('sell')) continue;
    const sym = String(cells[iSym] || '').trim();
    if (!sym) continue;
    const lots = mt5Num(cells[iVol]);
    const entry = mt5Num(cells[prices[0]]);
    const exit = prices.length > 1 ? mt5Num(cells[prices[1]]) : null;
    const profit = iProfit !== -1 ? mt5Num(cells[iProfit]) : 0;
    if (lots == null || entry == null || exit == null || profit == null) continue;
    const sl = iSl !== -1 ? mt5Num(cells[iSl]) : null;
    const tp = iTp !== -1 ? mt5Num(cells[iTp]) : null;
    const comm = iComm !== -1 ? mt5Num(cells[iComm]) : 0;
    const swap = iSwap !== -1 ? mt5Num(cells[iSwap]) : 0;
    const open = mt5DateTime(cells[times[0]]);
    out.push({
      mt5Id: String(cells[iPos] || '').replace(/\D/g, '') || `${sym}-${open.date}-${out.length}`,
      pair: mt5SymbolPair(sym),
      direction: type.includes('buy') ? 'long' : 'short',
      lots,
      entry,
      exit,
      finalSl: sl != null && sl > 0 ? sl : null,
      tp: tp != null && tp > 0 ? tp : null,
      pnlCents: Math.round(profit * 100),
      feesCents: Math.round((Math.abs(comm || 0) + Math.abs(swap || 0)) * 100),
      open
    });
  }
  return out;
}

// Fallback: reconstruct round turns by netting the deals table per symbol.
function mt5ParseDeals(tables) {
  const found = mt5FindTable(tables, ['deal', 'symbol', 'direction']);
  if (!found) return [];
  const { head, rows } = found;
  const col = (name) => head.findIndex((h) => h.includes(name));
  const iTime = col('time');
  const iSym = col('symbol');
  const iType = col('type');
  const iDir = col('direction');
  const iVol = col('volume') !== -1 ? col('volume') : col('lots');
  const iPrice = col('price');
  const iComm = col('commission');
  const iSwap = col('swap');
  const iProfit = col('profit');
  if (iTime === -1 || iSym === -1 || iType === -1 || iDir === -1 || iVol === -1 || iPrice === -1) return [];
  const book = new Map();
  const out = [];
  for (const cells of rows.slice(1)) {
    if (!mt5IsDataRow(cells)) break;
    const type = String(cells[iType] || '').toLowerCase();
    if (!type.includes('buy') && !type.includes('sell')) continue;
    const sym = String(cells[iSym] || '').trim();
    const vol = mt5Num(cells[iVol]);
    const price = mt5Num(cells[iPrice]);
    if (!sym || vol == null || price == null) continue;
    const isIn = String(cells[iDir] || '').toLowerCase().includes('in') && !String(cells[iDir] || '').toLowerCase().includes('out');
    const comm = iComm !== -1 ? mt5Num(cells[iComm]) || 0 : 0;
    const swap = iSwap !== -1 ? mt5Num(cells[iSwap]) || 0 : 0;
    const profit = iProfit !== -1 ? mt5Num(cells[iProfit]) || 0 : 0;
    let pos = book.get(sym);
    if (!pos || pos.vol <= 0) {
      pos = { vol: 0, inCost: 0, inVol: 0, outCost: 0, outVol: 0, profit: 0, fees: 0, open: mt5DateTime(cells[iTime]) };
      book.set(sym, pos);
    }
    pos.fees += Math.abs(comm) + Math.abs(swap);
    pos.profit += profit;
    if (isIn) {
      pos.vol += vol;
      pos.inCost += vol * price;
      pos.inVol += vol;
    } else {
      pos.vol -= vol;
      pos.outCost += vol * price;
      pos.outVol += vol;
    }
    if (pos.inVol > 0 && pos.outVol > 0 && pos.vol <= 0.0000001) {
      const entry = pos.inCost / pos.inVol;
      const exit = pos.outCost / pos.outVol;
      const open = pos.open;
      out.push({
        mt5Id: `d:${sym}:${open.date}:${pos.inVol}:${pos.profit.toFixed(2)}`,
        pair: mt5SymbolPair(sym),
        direction: type.includes('buy') ? 'short' : 'long',
        lots: roundTo(pos.inVol, 3),
        entry: roundTo(entry, 6),
        exit: roundTo(exit, 6),
        finalSl: null,
        tp: null,
        pnlCents: Math.round(pos.profit * 100),
        feesCents: Math.round(pos.fees * 100),
        open
      });
      book.delete(sym);
    }
  }
  return out;
}

function pickMt5File() {

  }
  input.value = '';
  input.click();
}

async function handleMt5File(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try {
    const buf = await file.arrayBuffer();
    const u8 = new Uint8Array(buf);
    const at = (i) => (u8.length > i ? u8[i] : -1);
    let tables = [];
    let why = '';
    if (at(0) === 0x50 && at(1) === 0x4b) {
      try {
        tables = await mt5TablesFromXlsx(buf);
      } catch (zipErr) {
        why = zipErr && zipErr.message === 'no-inflate'
          ? 'This browser cannot unzip an xlsx workbook. Update the browser, or in Excel use File then Save As and pick CSV.'
          : 'That xlsx file could not be opened — it looks truncated or still locked by Excel. Close it in Excel and try again.';
      }
      if (!tables.length && !why) why = 'That workbook has no sheet with rows in it. Save the MT5 history tab itself, not an empty summary.';
    } else if (at(0) === 0xD0 && at(1) === 0xCF && at(2) === 0x11 && at(3) === 0xE0) {
      why = 'That is the old Excel 97-2003 binary format, which a browser cannot read. Open it in Excel, use File then Save As, pick CSV, then import that file.';
    } else {
      const text = mt5DecodeBytes(u8);
      tables = mt5ParseTables(text);
      if (!tables.length) tables = mt5ParseGrid(text);
      if (!tables.length) why = 'That file has no table in it. Use the report MT5 saves (html, htm or xls) or the sheet you saved from Excel as xlsx, csv or txt.';
    }
    if (why) { toast(why, 'error'); return; }
    tables = mt5NormalizeTables(tables);
    let raw = mt5ParsePositions(tables);
    if (!raw.length) raw = mt5ParseDeals(tables);
    if (!raw.length) {
      toast('No closed trades found in that sheet. In MT5: Toolbox, Account History, right-click, Save Detailed Report — keep the Positions or Deals table and import the file it saves.', 'error');
      return;
    }
    const existing = new Set(state.trades.map((t) => t.mt5Id).filter(Boolean));
    const seen = new Set();
    const fresh = raw.filter((r) => {
      const key = String(r.mt5Id);
      if (existing.has(key) || seen.has(key)) return false;
      seen.add(key);
      return true;
    });
    pendingMt5Trades = { fresh, skipped: raw.length - fresh.length };
    if (!fresh.length) {
      toast(`All ${raw.length} trades in that report are already in your ledger — nothing to import.`, 'info');
      return;
    }
    openMt5ImportModal();
  } catch (err) {
    toast('Could not read that file. Import the report MT5 saves, or the sheet you saved from Excel.', 'error');
  }
}

function openMt5ImportModal() {
  const accounts = activeAccounts();
  if (!accounts.length) {
    toast('Add an account before importing trades.', 'info');
    openAccountModal('');
    return;
  }
  const { fresh, skipped } = pendingMt5Trades;
  formModal({
    title: 'Import MT5 trades',
    sub: `${fresh.length} closed trade${fresh.length === 1 ? '' : 's'} found${skipped ? ` · ${skipped} already in the ledger and will be skipped` : ''}.`,
    fields: `
      <div class="form-grid">
        <div class="full"><div class="form-note" style="font-size:10.5px">Accepted: the MT5 history report (html, htm or the xls MT5 writes) or the same history saved from Excel as xlsx, csv or txt. Trades keep their P&amp;L, prices, lots, commission and open time. The stop MT5 shows goes to <b>Final stop</b>. R stays blank — add it when you review the trade.</div></div>
        <div class="field full">
          <label for="mt5-account">Import into account</label>
          <select class="select" id="mt5-account" name="accountId">${accounts.map((a) => `<option value="${a.id}">${esc(a.name)}</option>`).join('')}</select>
        </div>
      </div>`,
    submitLabel: `Import ${fresh.length} trade${fresh.length === 1 ? '' : 's'}`,
    formKey: 'mt5-import'
  });
}

function saveMt5Import(form) {
  const pending = pendingMt5Trades;
  pendingMt5Trades = null;
  closeModal();
  if (!pending || !pending.fresh.length) return;
  const accountId = String(new FormData(form).get('accountId') || '');
  if (!accountById(accountId)) { toast('Choose a valid account.', 'error'); return; }
  const now = new Date().toISOString();
  const records = pending.fresh.map((r) => ({
    id: uid('t'),
    accountId,
    date: r.open.date || todayISO(),
    pair: r.pair,
    direction: r.direction,
    entry: r.entry,
    exit: r.exit,
    sl: null,
    finalSl: r.finalSl,
    tp: r.tp,
    lots: r.lots,
    pnlCents: r.pnlCents,
    feesCents: r.feesCents,
    r: null,
    session: mt5Session(r.open.hour),
    startHM: String(r.open.hm || ''),
    // A report row is an outcome, not a decision. MT5 never tells you what you
    // checked before entry, so grade and plan stay unanswered instead of being
    // stamped with a flattering default.
    grade: '',
    plan: null,
    notes: `Imported from MT5 report · #${r.mt5Id}`,
    mt5Id: String(r.mt5Id),
    createdAt: now,
    updatedAt: now
  }));
  state.trades = state.trades.concat(records);
  logAudit('trade', `Imported ${records.length} trades from an MT5 report`);
  commit(`Imported ${records.length} trades from MT5.`, 'trades', 'success');
}

async function handleBackupFile(event) {
  const file = event.target.files && event.target.files[0];
  if (!file) return;
  try {
    const text = await file.text();
    const parsed = JSON.parse(text);
    const candidate = parsed && parsed.state ? parsed.state : parsed;
    if (!candidate || typeof candidate !== 'object' || !Array.isArray(candidate.trades)) {
      toast('That file is not a Ledgerwise backup.', 'error');
      return;
    }
    const next = normalizeState(candidate);
    next.settings.onboarded = true;
    const count = next.trades.length + next.expenses.length + next.payouts.length + next.accounts.length;
    confirmDialog({
      title: 'Restore this backup?',
      text: `The file contains ${next.trades.length} trades, ${next.accounts.length} accounts, ${next.payouts.length} payouts and ${next.expenses.length} expenses (${count} records). This replaces everything currently in the workspace.`,
      confirmLabel: 'Restore backup',
      onConfirm: () => {
        state = next;
        saveState();
        navigate('overview');
        toast('Backup restored.', 'info');
      }
    });
  } catch (err) {
    toast('Could not read that JSON file.', 'error');
  }
}

function wireEvents() {

  document.addEventListener('change', (e) => {

          state.settings.tradesPerPage = TRADE_PAGE_SIZES.includes(Number(el.value)) ? Number(el.value) : 10;
          saveState();
        }
        // A filter change that leaves you on page 9 of a view with 3 rows shows
        // an empty table, which reads as "my trades are gone".
        ui.trades.page = 1;
        renderApp('trades');
      }
      return;
    }
    const mc = e.target.closest('[data-act="money-cur"]');
    if (mc) {
      const form = mc.closest('form');

    const pa = e.target.closest('[data-act="payout-account"]');

      const form = pa.closest('form');

        if (split) split.value = acc.splitPct;
        const cur = accountCurrency(acc);
        const grossField = document.getElementById('po-gross');
        if (grossField) grossField.previousElementSibling.textContent = currencySymbol(cur);
        const feeField = document.getElementById('po-fee');
        if (feeField) feeField.previousElementSibling.textContent = currencySymbol(cur);

    const form = e.target.closest('form[data-form]');

      case 'welcome': welcomeSubmit(form, e.submitter); break;
      case 'cloud-auth': submitCloudAuth(form); break;
      case 'cloud-password-reset': submitCloudPasswordReset(form); break;
      case 'cloud-delete': submitCloudDelete(form); break;
      case 'trade': saveTrade(form); break;
      case 'mt5-import': saveMt5Import(form); break;
      case 'account': saveAccount(form); break;
      case 'risk-ladder': saveRiskLadder(form); break;

      case 'duty': saveDuty(form); break;
      case 'breach': saveBreach(form); break;
      case 'document': saveDocument(form); break;
      case 'strategy': saveStrategy(form); break;
      case 'backtest': saveBacktest(form); break;
      case 'bt-setup': saveBtTrade(form); break;
      case 'income': saveIncome(form); break;
      case 'expense': saveExpense(form); break;
      case 'currency-review': saveCurrencyReview(form); break;
      case 'budget-all': saveBudgetAll(form); break;
      case 'budget-one': saveBudgetOne(form); break;
      case 'goal': saveGoal(form); break;
      case 'contribution': saveContribution(form); break;
      case 'review': saveReview(form); break;
      case 'fear': saveFear(form); break;
      case 'watch': saveWatch(form); break;
      case 'watch-resolve': saveResolve(form); break;
      case 'wall-fix': saveWallFix(form); break;
      case 'week-plan': saveWeekPlan(form); break;

      case 'sim': runSimulation(form); break;
      case 'confirm': confirmSubmit(form); break;
      default: break;
    }
  });

  document.addEventListener('keydown', (e) => {
    if ((e.metaKey || e.ctrlKey) && String(e.key).toLowerCase() === 'k') {
      e.preventDefault();
      openPalette();
      return;
    }
    const backdrop = document.querySelector('.modal-backdrop');
    if (e.key === 'Escape' && document.body.classList.contains('nav-open')) {
      e.preventDefault();
      closeMobileNav();
      return;
    }
    if (!backdrop) return;
    if (e.key === 'Escape') {
      e.preventDefault();
      guardCloseModal();
      return;
    }
    if (e.key === 'Enter' && e.target && e.target.id === 'palette-search') {
      const first = document.querySelector('.palette-item');
      if (first) { e.preventDefault(); first.click(); }
      return;
    }
    if (e.key === 'Tab') {
      const nodes = [...backdrop.querySelectorAll('input:not([type="hidden"]), select, textarea, button, a[href]')]
        .filter((n) => !n.disabled && n.offsetParent !== null);
      if (!nodes.length) return;
      const first = nodes[0];
      const last = nodes[nodes.length - 1];
      if (e.shiftKey && document.activeElement === first) { e.preventDefault(); last.focus(); }
      else if (!e.shiftKey && document.activeElement === last) { e.preventDefault(); first.focus(); }
    }
  });

  const root = document.getElementById('modal-root');
  if (root) {
    let downOnBackdrop = false;
    root.addEventListener('pointerdown', (e) => {
      downOnBackdrop = !!(e.target.classList && e.target.classList.contains('modal-backdrop'));
    });
    root.addEventListener('click', (e) => {
      const onBackdrop = !!(e.target.classList && e.target.classList.contains('modal-backdrop'));
      // A text drag that starts inside a field and ends over the dimmed edge fires
      // its click on the backdrop, because that is where the two nodes meet. Closing
      // there threw away half-typed close-outs, so the press must start on the scrim.
      if (onBackdrop && downOnBackdrop) guardCloseModal();
      downOnBackdrop = false;
    });
    root.addEventListener('input', (e) => {
      const tag = e.target && e.target.tagName;
      if (tag === 'INPUT' || tag === 'TEXTAREA' || tag === 'SELECT') root.dataset.dirty = '1';
    });
  }

  document.addEventListener('paste', (e) => {
    const drop = document.querySelector('[data-drop-owner]');
    const items = e.clipboardData && e.clipboardData.items ? [...e.clipboardData.items] : [];
    const hit = items.find((it) => it.kind === 'file' && /^image\//.test(String(it.type || '')));
    if (!drop) {
      /* outside the evidence panel: only hijack a real picture, never a text paste */
      if (!hit) return;
      const t = e.target;
      if (t && (t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || t.isContentEditable)) return;
      const file = hit.getAsFile();
      if (!file) { toast('The clipboard picture could not be read.', 'error'); return; }
      e.preventDefault();
      pendingShotFile = file;
      openShotTargetModal();
      return;
    }
    if (!hit) { toast('Nothing picture-shaped on the clipboard. Copy the chart first, then paste.', 'error'); return; }
    const file = hit.getAsFile();
    if (!file) { toast('The clipboard picture could not be read.', 'error'); return; }
    e.preventDefault();
    const ownerId = drop.dataset.dropOwner;
    const slot = shotFirstFreeSlot(ownerId);
    if (!SHOT_SLOTS[slot]) { toast(`This trade already holds ${SHOTS_PER_TRADE} pictures — that is the cap. Delete one to make room.`, 'error'); return; }
    attachShot(ownerId, slot, file);
  });

  document.addEventListener('dragover', (e) => {
    const drop = e.target.closest ? e.target.closest('[data-drop-owner]') : null;
    if (drop) {
      e.preventDefault();
      drop.classList.add('over');
      return;
    }
    /* keep the browser from opening a chart file in the tab when it is dropped outside a slot */
    if (e.dataTransfer && [...(e.dataTransfer.types || [])].includes('Files')) e.preventDefault();
  });

  document.addEventListener('dragleave', (e) => {
    const drop = e.target.closest ? e.target.closest('[data-drop-owner]') : null;
    if (drop) drop.classList.remove('over');
  });

  document.addEventListener('drop', (e) => {
    const drop = e.target.closest ? e.target.closest('[data-drop-owner]') : null;
    if (!drop) {
      const loose = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
      if (!loose || !/^image\//.test(String(loose.type || ''))) return;
      e.preventDefault();
      pendingShotFile = loose;
      openShotTargetModal();
      return;
    }
    e.preventDefault();
    drop.classList.remove('over');
    const file = e.dataTransfer && e.dataTransfer.files ? e.dataTransfer.files[0] : null;
    if (!file) { toast('No file in what you dropped.', 'error'); return; }
    attachShot(drop.dataset.dropOwner, drop.dataset.dropSlot || 'extra', file);
  });

  window.addEventListener('hashchange', () => {
    closeMobileNav();
    renderApp(pageFromHash());
  });
}

function cloudKeyIsPublishable(key) {
  const value = String(key || '').trim();
  if (!value || /REPLACE_WITH/i.test(value)) return false;
  if (/^sb_secret_/i.test(value) || /service_role/i.test(value)) return false;
  if (value.startsWith('sb_publishable_')) return true;
  if (value.startsWith('eyJ')) {
    try {
      let body = value.split('.')[1].replace(/-/g, '+').replace(/_/g, '/');
      body += '='.repeat((4 - (body.length % 4)) % 4);
      return JSON.parse(atob(body)).role === 'anon';
    } catch (err) { return false; }
  }
  return false;
}

function cloudRedirectUrl() {

function cloudAuthParamsPresent() {
  const search = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  return search.has('code') || search.has('error') || hash.has('access_token') || hash.has('error');
}
function cloudCleanUrl() {
  const url = new URL(window.location.href);
  ['code', 'error', 'error_code', 'error_description'].forEach((key) => url.searchParams.delete(key));
  if (/#(access_token|refresh_token|expires_in|token_type|error|error_code|error_description)=/.test(url.hash)) url.hash = '';
  const next = `${url.pathname}${url.search}${url.hash}`;
  if (next !== `${window.location.pathname}${window.location.search}${window.location.hash}`) {
    window.history.replaceState(null, '', next);

function cloudReadAuthError() {
  const query = new URLSearchParams(window.location.search);
  const hash = new URLSearchParams(window.location.hash.replace(/^#/, ''));
  const code = query.get('error_code') || hash.get('error_code') || '';
  const raw = query.get('error_description') || query.get('error') || hash.get('error_description') || hash.get('error') || '';

  const combined = `${code} ${raw}`;
  if (query.has('error') || hash.has('error')) cloudCleanUrl();

  }
  const bar = document.getElementById('cloud-bar');
  if (bar) {
    const urgent = signedIn && ['error', 'conflict'].includes(cloud.status);
    bar.hidden = !urgent;
    bar.dataset.status = cloud.status;
    if (urgent) {
      const conflict = cloud.status === 'conflict';
      bar.innerHTML = `<div class="cloud-bar-main">${icon('alert', 14)}<span>${conflict
        ? 'A newer ledger was saved in another tab or on another device. Your changes here are not in the cloud yet.'
        : esc(cloud.lastError || 'Cloud save failed. Your changes are still in this browser.')}</span></div>
        <button type="button" class="btn-link" data-act="cloud-sync-now">${conflict ? 'Review' : 'Retry'}</button>`;
    } else {
      bar.innerHTML = '';
    }
  }
  document.querySelectorAll('[data-cloud-badge]').forEach((element) => {
    const badge = cloudStatusBadge();
    element.className = `badge badge-${badge.tone}`;
    element.textContent = badge.label;
  });
  document.querySelectorAll('[data-cloud-detail]').forEach((element) => { element.textContent = cloudStatusDetail(); });
  document.querySelectorAll('[data-cloud-email]').forEach((element) => {
    element.textContent = cloud.user && cloud.user.email ? cloud.user.email : '';
  });
  document.querySelectorAll('[data-cloud-save-now]').forEach((button) => {
    button.disabled = !signedIn || cloud.status === 'saving' || cloud.status === 'conflict';
  });
}
function cloudSetStatus(status, error) {
  const previous = cloud.status;
  cloud.status = status;
  if (status === 'error') cloud.lastError = error || cloud.lastError || 'Cloud save failed.';
  if (status === 'saved') cloud.lastError = '';
  renderCloudStatus();
  if (status === 'saved' && previous === 'error') toast('Back in sync. Your ledger is saved to the cloud.', 'success');
}

/* ---------------------------- boot and auth ---------------------------- */

function startCloudApp() {
  cloud.enabled = true;
  cloud.initialized = false;

  const authMessage = cloudReadAuthError();
  if (!isCloudConfigured()) {
    console.error('[Ledgerwise cloud] Supabase configuration is missing or invalid.');
    showAuthFatal('Cloud sign-in is not connected yet',
      'Supabase credentials have not been configured for this build. If you are the owner, connect the project before sharing this address.',
      { retry: false });
    return;
  }
  if (!window.supabase || typeof window.supabase.createClient !== 'function') {
    showAuthFatal('Secure sign-in could not load',
      'The sign-in library did not load. Check your internet connection or disable a content blocker, then try again.',
      { retry: true });
    return;
  }

  showAuthLoading();
  try {
    cloud.client = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY, {
      auth: { persistSession: true, autoRefreshToken: true, detectSessionInUrl: true, flowType: 'pkce' }
    });
  } catch (err) {
    console.error('[Ledgerwise cloud] Client could not start', err);
    showAuthFatal('Cloud sign-in could not start', 'Please try again in a moment.', { retry: true });
    return;
  }

  bindCloudLifecycle();

  cloud.client.auth.onAuthStateChange((event, session) => {
    if (event === 'PASSWORD_RECOVERY') {
      cloud.recoveryMode = true;
      if (session) { cloud.session = session; cloud.user = session.user; }
      window.setTimeout(() => showAuthPasswordReset(), 0);
      return;
    }
    if (event === 'SIGNED_OUT') {
      cloud.session = null;
      if (!cloud.deleting && !cloud.deleted) window.setTimeout(() => handleCloudSignedOut(), 0);
      return;
    }
    if (!session || !session.user) return;
    cloud.deleted = false;
    cloud.session = session;
    const user = session.user;
    const changedUser = cloud.user && cloud.user.id !== user.id;
    cloud.user = user;
    if (changedUser) {
      cloud.loadedUserId = null;
      cloud.openingUserId = null;
      cloud.revision = 0;
      cloud.hasLedger = false;
      cloud.localCandidate = null;
      cloudClearLocal();
      state = emptyState();
      closeModal();
    }
    if (event === 'SIGNED_IN' || event === 'INITIAL_SESSION' || event === 'USER_UPDATED') {
      if (cloud.loadedUserId !== user.id && cloud.openingUserId !== user.id) {
        window.setTimeout(() => cloudOpenSession(user), 0);
      } else {
        renderCloudStatus();
      }
    }
  });

  cloud.client.auth.getSession().then(({ data, error }) => {
    if (error) {
      console.error('[Ledgerwise cloud] Session could not be read', error);
      showAuthFatal('We couldn’t check your session', 'Check your connection, then try again.', { retry: true });
      return;
    }
    if (data && data.session && data.session.user) {
      cloud.user = data.session.user;
      cloud.session = data.session;
      if (cloud.recoveryMode) showAuthPasswordReset();
      else cloudOpenSession(data.session.user);
      return;
    }
    if (authMessage) { showAuthSignIn(authMessage); return; }
    if (cloudAuthParamsPresent()) {
      showAuthLoading('Completing your secure sign-in…');
      window.setTimeout(() => {
        if (!cloud.user) showAuthSignIn('The authentication link could not be completed. Please sign in again or request a password reset.');
      }, 7000);
      return;
    }
    showAuthSignIn();
  }).catch((err) => {
    console.error('[Ledgerwise cloud] Session check failed', err);
    showAuthFatal('We couldn’t reach your ledger', 'Check your internet connection, then try again.', { retry: true });
  });
}

async function cloudOpenSession(user) {
  if (!cloud.client || !user) return;
  if (cloud.openingUserId === user.id || cloud.loadedUserId === user.id) return;
  cloud.openingUserId = user.id;
  cloud.user = user;
  showAuthLoading('Opening your private ledger…');

  try {
    const row = await cloudFetchRow();
    if (!cloud.user || cloud.user.id !== user.id) return;

    if (row) {
      let restored;
      try {
        restored = normalizeState(row.data);
      } catch (err) {
        const invalid = new Error('CLOUD_LEDGER_INVALID');
        invalid.code = 'CLOUD_LEDGER_INVALID';
        throw invalid;
      }
      cloud.revision = Number(row.revision) || 0;
      cloud.hasLedger = true;
      cloud.lastSync = row.updated_at ? new Date(row.updated_at) : new Date();
      cloud.pending = false;
      cloud.conflict = false;
      cloud.localCandidate = null;
      cloud.applyingRemote = true;
      state = restored;
      cloudStoreLocal(restored);
      cloudWriteMeta();
      cloud.applyingRemote = false;
      cloud.loadedUserId = user.id;
      cloudSetStatus('saved');
      cloudHideAuth();
      cloudCleanUrl();
      enterCloudLedger();
    } else {
      cloud.revision = 0;
      cloud.hasLedger = false;
      cloud.lastSync = null;
      cloud.pending = false;
      cloud.conflict = false;
      cloud.localCandidate = cloudClaimLocal(user);
      if (cloud.localCandidate) {
        state = cloud.localCandidate;
        cloudSetStatus('local');
      } else {
        cloudClearLocal();
        state = emptyState();
        cloudSetStatus('idle');
      }
      cloud.loadedUserId = user.id;
      cloudHideAuth();
      cloudCleanUrl();
      enterCloudLedger();
      if (cloud.localCandidate) {
        toast('This device still holds an older ledger. Save now uploads it to your account.', 'info');
      }
    }
  } catch (err) {
    console.error('[Ledgerwise cloud] Ledger could not be opened', err);
    const message = cloudDataErrorText(err);
    cloud.lastError = message;
    cloud.loadedUserId = null;
    showAuthFatal('We couldn’t open your ledger', message, { retry: true, signOut: !!cloud.user });
  } finally {
    cloud.openingUserId = null;
  }
}

function enterCloudLedger() {
  renderApp(state && state.settings.onboarded ? pageFromHash() : 'overview');
  renderCloudStatus();
}

async function cloudFetchRow() {
  if (!cloud.client || !cloud.user) throw new Error('CLOUD_NOT_SIGNED_IN');
  const { data, error } = await cloud.client
    .from(CLOUD_TABLE)
    .select('data, revision, updated_at')
    .eq('user_id', cloud.user.id)
    .maybeSingle();
  if (error) throw error;
  return data;
}

/* ---------------------------- device ledger migration ---------------------------- */

function cloudClaimLocal(user) {
  let raw = '';
  try { raw = localStorage.getItem(DB_KEY) || ''; } catch (err) { return null; }
  if (!raw || !user) return null;
  const meta = cloudReadMeta();
  if (meta && meta.userId && meta.userId !== user.id) {
    cloudClearLocal();
    return null;
  }
  try {
    const candidate = normalizeState(JSON.parse(raw));
    const hasRecords = candidate.accounts.length || candidate.trades.length || candidate.payouts.length
      || candidate.incomes.length || candidate.expenses.length || candidate.goals.length;
    return hasRecords || candidate.settings.onboarded ? candidate : null;
  } catch (err) { return null; }
}

function cloudMigrationBanner() {
  const candidate = cloud.localCandidate;
  if (!candidate || !cloud.user) return '';
  const count = candidate.trades.length + candidate.payouts.length + candidate.incomes.length + candidate.expenses.length;
  return `<div class="cloud-migrate" role="region" aria-label="Ledger found on this device">
    <div class="cloud-migrate-title">${icon('history', 15)}<strong>Ledger found on this device</strong></div>
    <p>${esc(candidate.settings.name || 'Untitled workspace')} · ${esc(candidate.settings.currency)} · ${count} ${count === 1 ? 'record' : 'records'}. Upload it to your account so this history is not lost.</p>
    <div class="cloud-migrate-actions">
      <button type="button" class="btn btn-primary btn-sm" data-act="cloud-import-local">Add to my account</button>
      <button type="button" class="btn-link" data-act="cloud-download-local">Download a copy</button>
      <button type="button" class="btn-link" data-act="cloud-dismiss-local">Start blank</button>
    </div>
  </div>`;
}

async function cloudImportLocal() {
  if (!cloud.localCandidate || !cloud.user) return;
  cloudSetStatus('pending');
  const ok = await cloudFlush();
  if (ok) {
    cloud.localCandidate = null;
    logAudit('workspace', 'Imported the ledger from this browser into the cloud account.');
    saveState();
    toast('Your browser ledger is now saved to your private cloud account.', 'success');
    renderApp(ui.page);
  } else if (!cloud.conflict) {
    toast(cloud.lastError || 'Upload failed. Your ledger is still on this device.', 'error');
  }
}

function cloudDownloadLocal() {
  const candidate = cloud.localCandidate || state;
  if (!candidate) return;
  downloadFile(`ledgerwise-fx-device-backup-${todayISO()}.json`, JSON.stringify(candidate, null, 2), 'application/json');
  toast('Device ledger downloaded.');
}

function cloudDismissLocal() {
  if (!cloud.localCandidate) return;
  try {
    const raw = localStorage.getItem(DB_KEY);
    if (raw) localStorage.setItem(`${DB_KEY}_recovery_${Date.now()}`, raw);
  } catch (err) { /* storage may be full */ }
  cloud.localCandidate = null;
  cloudClearLocal();
  state = emptyState();
  cloudSetStatus('idle');
  saveState();
  renderApp('overview');
  toast('Starting blank. A recovery copy of the old device ledger is kept on this device.', 'info');
}

function handleCloudSignedOut() {
  if (cloud.deleting || cloud.deleted) return;
  if (cloud.timer) { window.clearTimeout(cloud.timer); cloud.timer = null; }
  cloud.session = null;
  cloud.user = null;
  cloud.loadedUserId = null;
  cloud.openingUserId = null;
  cloud.revision = 0;
  cloud.hasLedger = false;
  cloud.pending = false;
  cloud.flushing = null;
  cloud.conflict = false;
  cloud.status = 'idle';
  cloud.lastError = '';
  cloud.lastSync = null;
  cloud.localCandidate = null;
  cloudClearLocal();
  state = emptyState();
  closeModal();
  renderCloudStatus();
  showAuthSignIn(cloud.authMessage || 'You’ve been signed out. Enter your email to open your ledger again.');
  cloud.authMessage = '';
}

function cloudErrorTextForAuth(err) {
  const message = String(err && err.message ? err.message : '');
  const status = err && err.status;
  if (status === 429 || /rate limit|too many/i.test(message)) return 'Too many sign-in emails were requested. Wait a few minutes, then try again.';
  if (/email.*invalid|invalid.*email/i.test(message)) return 'That email address does not look right. Check it and try again.';
  if (/signups? not allowed|signup.*disabled/i.test(message)) return 'New account creation is disabled in Supabase. Enable email sign-ups in Authentication settings.';
  if (/password.*(weak|short|characters|length)|weak password/i.test(message)) return 'Choose a stronger password with at least 8 characters.';
  if (/failed to fetch|network|load failed/i.test(message)) return 'We couldn’t reach the cloud. Check your connection and try again.';
  if (/invalid login credentials/i.test(message)) return 'Email or password is incorrect. If this account was created with a magic link, choose “Forgot password?” to set a password first.';
  if (/email not confirmed/i.test(message)) return 'Please confirm your email first. Check your inbox, then sign in with your password.';
  if (/redirect_to.*not allowed|redirect url|not in allowlist|allowlist/i.test(message)) return 'That address is not allowed to sign in yet. Add it to Supabase → Authentication → URL Configuration → Redirect URLs.';
  if (/provider not enabled|oauth.*not.*allowed|is not enabled/i.test(message)) return 'Google sign-in is not enabled on this Supabase project yet. Turn it on under Authentication → Sign In / Up → Google.';
  return message || 'Authentication failed. Please try again.';
}

async function submitCloudAuth(form) {
  const email = cloudFormValue(form, 'email').trim().toLowerCase();
  const mode = cloudFormValue(form, 'authMode') || cloud.authMode || 'login';
  const password = cloudFormValue(form, 'password');
  const accepted = cloudFormChecked(form, 'terms');
  const submit = form.querySelector('button[type="submit"]');
  if (!cloud.client) { cloudFormError(form, 'Cloud sign-in is not available.'); return; }
  if (!navigator.onLine) { cloudFormError(form, 'You appear to be offline. Check your connection and try again.'); return; }
  if (!email || !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) { cloudFormError(form, 'Enter a valid email address.'); return; }
  if (mode !== 'forgot' && (!password || password.length < 8)) { cloudFormError(form, 'Use a password with at least 8 characters.'); return; }
  if (mode === 'signup' && !accepted) { cloudFormError(form, 'Please confirm you are 18 or older and accept the terms and privacy notice.'); return; }
  if (submit) {
    submit.disabled = true;
    submit.textContent = mode === 'signup' ? 'Creating account…' : mode === 'forgot' ? 'Sending reset link…' : 'Signing in…';
  }
  try {
    let result;
    if (mode === 'signup') {
      result = await cloud.client.auth.signUp({
        email, password,
        options: {
          emailRedirectTo: cloudRedirectUrl(),
          data: { product: 'Ledgerwise FX', terms_version: CLOUD_TERMS_VERSION, terms_accepted_at: new Date().toISOString() }
        }
      });
      if (result.error) throw result.error;
      cloud.pendingEmail = email;
      if (result.data && result.data.session) {
        cloud.session = result.data.session;
        cloud.user = result.data.user;
        cloud.deleted = false;
        await cloudOpenSession(result.data.user);
      } else {
        showAuthConfirmation(email);
      }
      return;
    }
    if (mode === 'forgot') {
      result = await cloud.client.auth.resetPasswordForEmail(email, { redirectTo: cloudRedirectUrl() });
      if (result.error) throw result.error;
      cloud.pendingEmail = email;
      showAuthConfirmation(email, '', 'reset');
      return;
    }
    result = await cloud.client.auth.signInWithPassword({ email, password });
    if (result.error) throw result.error;
    if (result.data && result.data.session && result.data.user) {
      cloud.session = result.data.session;
      cloud.user = result.data.user;
      cloud.deleted = false;
      await cloudOpenSession(result.data.user);

  }
}

async function submitCloudPasswordReset(form) {
  const password = cloudFormValue(form, 'password');
  const confirmPassword = cloudFormValue(form, 'confirmPassword');
  if (!password || password.length < 8) { cloudFormError(form, 'Use a password with at least 8 characters.'); return; }
  if (password !== confirmPassword) { cloudFormError(form, 'The passwords do not match.'); return; }
  const submit = form.querySelector('button[type="submit"]');
  if (submit) { submit.disabled = true; submit.textContent = 'Saving password…'; }
  try {
    const result = await cloud.client.auth.updateUser({ password });
    if (result.error) throw result.error;
    cloud.recoveryMode = false;
    if (result.data && result.data.user) {
      cloud.user = result.data.user;
      cloud.session = (await cloud.client.auth.getSession()).data.session;
      showAuthLoading('Password updated. Opening your ledger…');
      await cloudOpenSession(result.data.user);
    } else {
      showAuthSignIn('Your password was updated. Sign in with your new password.');
    }
  } catch (err) {
    console.error('[Ledgerwise cloud] Password reset failed', err);
    if (submit) { submit.disabled = false; submit.textContent = 'Save new password'; }
    cloudFormError(form, cloudErrorTextForAuth(err));
  }
}

/* ---------------------------- sync engine ---------------------------- */

function cloudLedgerChanged() {
  if (!cloud.enabled || !cloud.user || !cloud.loadedUserId || cloud.applyingRemote) return false;
  if (cloud.status === 'local') cloudSetStatus('pending');
  cloud.pending = true;
  if (cloud.status === 'conflict') { renderCloudStatus(); return true; }
  if (cloud.flushing) { renderCloudStatus(); return true; }
  cloudSetStatus('pending');
  if (cloud.timer) window.clearTimeout(cloud.timer);
  cloud.timer = window.setTimeout(() => {
    cloud.timer = null;
    cloudFlush();
  }, CLOUD_SYNC_DELAY);
  return true;
}

async function cloudWriteLedger(snapshot) {
  if (!cloud.client || !cloud.user) throw new Error('CLOUD_NOT_SIGNED_IN');
  if (new Blob([snapshot]).size > CLOUD_MAX_BYTES) {
    const err = new Error('Your ledger is too large for one cloud save. Export a JSON backup now.');
    err.code = 'LEDGER_TOO_LARGE';
    throw err;
  }
  const data = JSON.parse(snapshot);
  const expected = cloud.revision;

  if (expected === 0) {
    const { data: inserted, error } = await cloud.client
      .from(CLOUD_TABLE)
      .insert({ user_id: cloud.user.id, data, revision: 1 })
      .select('revision, updated_at')
      .single();
    if (error) {
      if (error.code === '23505') throw cloudConflictError(error);
      throw error;
    }
    cloud.revision = Number(inserted.revision) || 1;
    cloud.hasLedger = true;
    cloud.lastSync = inserted.updated_at ? new Date(inserted.updated_at) : new Date();
    cloudWriteMeta();
    return;
  }

  const { data: updated, error } = await cloud.client
    .from(CLOUD_TABLE)
    .update({ data, revision: expected + 1 })
    .eq('user_id', cloud.user.id)
    .eq('revision', expected)
    .select('revision, updated_at');
  if (error) throw error;
  if (!Array.isArray(updated) || updated.length === 0) throw cloudConflictError();
  cloud.revision = Number(updated[0].revision) || expected + 1;
  cloud.hasLedger = true;
  cloud.lastSync = updated[0].updated_at ? new Date(updated[0].updated_at) : new Date();
  cloudWriteMeta();
}

function cloudConflictError(cause) {
  const err = new Error('CLOUD_CONFLICT');
  err.conflict = true;
  if (cause) err.cause = cause;
  return err;
}

async function cloudFlush() {
  if (!cloud.user || !state || !cloud.client) return false;
  if (cloud.status === 'conflict') return false;

  if (cloud.flushing) {
    cloud.pending = true;
    try { await cloud.flushing; } catch (err) { /* reported by the owning call */ }
    if (cloud.timer) { window.clearTimeout(cloud.timer); cloud.timer = null; }
    return cloudFlush();
  }

  if (cloud.timer) { window.clearTimeout(cloud.timer); cloud.timer = null; }
  cloud.pending = false;
  cloudSetStatus('saving');
  const snapshot = JSON.stringify(state);

  const task = (async () => {
    try {
      await cloudWriteLedger(snapshot);
      return true;
    } catch (err) {
      console.error('[Ledgerwise cloud] Save failed', err);
      if (err && err.conflict) {
        cloud.conflict = true;
        cloud.pending = true;
        cloudSetStatus('conflict');
        openCloudConflictModal();
      } else {
        cloud.pending = true;
        cloudSetStatus('error', cloudDataErrorText(err));
      }
      return false;
    }
  })();

  cloud.flushing = task;
  const ok = await task;
  cloud.flushing = null;

  if (ok) {
    cloud.localCandidate = null;
    if (cloud.pending && cloud.timer === null && cloud.status !== 'conflict') {
      cloud.pending = false;
      cloudSetStatus('saving');
      cloud.timer = window.setTimeout(() => { cloud.timer = null; cloudFlush(); }, 150);
    } else if (!cloud.pending) {
      cloudSetStatus('saved');
    }
  }
  return ok;
}

function cloudDataErrorText(err) {
  const code = err && err.code;
  const message = String(err && err.message ? err.message : '');
  if (err && err.conflict) return 'This ledger changed somewhere else. Review the two copies before saving.';
  if (code === 'LEDGER_TOO_LARGE') return message;
  if (code === 'CLOUD_NOT_SIGNED_IN') return 'Your session has ended. Sign in again to continue syncing.';
  if (code === 'CLOUD_LEDGER_INVALID') return 'The cloud copy could not be read, so it was left untouched. Contact support before making changes.';
  if (code === '42P01' || /relation .*ledgers.* does not exist/i.test(message)) return `The ${CLOUD_TABLE} table is missing in this Supabase project. Run the Ledgerwise SQL in Supabase → SQL Editor, then reload.`;
  if (code === '42501' || /row-level security/i.test(message)) return 'Your account could not access this ledger. Sign out and sign in again.';
  if (code === '23514' || /check constraint/i.test(message)) return 'The cloud rejected this ledger because it is too large or not a valid ledger document. Export a backup now.';
  if (!navigator.onLine || /failed to fetch|networkerror|load failed/i.test(message)) {
    return 'You are offline or the cloud could not be reached. Your changes are still in this browser.';
  }
  return 'Cloud save failed. Your changes are still in this browser; try again.';
}

function cloudSyncNow() {
  if (!cloud.user) { showAuthSignIn('Sign in to continue.'); return; }
  if (cloud.conflict) { openCloudConflictModal(); return; }
  if (cloud.flushing) { toast('A cloud save is already in progress.', 'info'); return; }
  if (!cloud.pending && cloud.status === 'saved') { toast('Everything is saved to the cloud.', 'info'); return; }
  cloudFlush().then((ok) => {
    if (ok) {
      toast('Saved to your private cloud ledger.', 'success');
      if (cloud.localCandidate) { cloud.localCandidate = null; renderApp(ui.page); }
    } else if (!cloud.conflict) {
      toast(cloud.lastError || 'Still not saved. Check your connection.', 'error');
    }
  });
}

function cloudRetry() {
  if (!cloud.client) { window.location.reload(); return; }
  if (!cloud.user) {
    if (cloud.authMessage) showAuthSignIn(cloud.authMessage);
    else showAuthSignIn();
    return;
  }
  if (cloud.status === 'error' && cloud.loadedUserId === cloud.user.id) { cloudSyncNow(); return; }
  cloud.loadedUserId = null;
  cloud.openingUserId = null;
  cloudOpenSession(cloud.user);
}

function openCloudConflictModal() {
  openModal(modalShell({

    </div>

async function cloudResolveConflict() {
  if (!cloud.user) return;
  try {
    const row = await cloudFetchRow();
    if (!row) throw new Error('No cloud ledger was found. Reload the page to start again.');
    let restored;
    try {
      restored = normalizeState(row.data);
    } catch (err) {
      throw new Error('The cloud copy could not be read. Nothing was replaced.');
    }
    cloud.applyingRemote = true;
    state = restored;
    cloud.revision = Number(row.revision) || 0;
    cloud.lastSync = row.updated_at ? new Date(row.updated_at) : new Date();
    cloud.hasLedger = true;
    cloud.pending = false;
    cloud.conflict = false;
    cloud.localCandidate = null;
    cloudStoreLocal(restored);
    cloudWriteMeta();
    cloud.applyingRemote = false;
    cloud.loadedUserId = cloud.user.id;
    closeModal();
    enterCloudLedger();
    cloudSetStatus('saved');
    toast('Cloud version loaded. Your unsaved device copy was not uploaded.', 'info');
  } catch (err) {
    console.error('[Ledgerwise cloud] Conflict reload failed', err);
    toast(err.message || 'The cloud version could not be loaded. Try again.', 'error');
  }
}

/* ---------------------------- sign out and deletion ---------------------------- */

async function cloudRequestSignOut() {
  if (cloud.deleting) return;
  if (!cloud.user) { showAuthSignIn(); return; }
  if (cloud.conflict) { openCloudConflictModal(); return; }
  if (cloud.pending || cloud.flushing || cloud.status === 'local') {
    const ok = await cloudFlush();
    if (!ok) {
      toast(cloud.lastError || 'Your latest changes are not in the cloud yet. Try Save now before signing out.', 'error');
      return;
    }
  }
  cloud.authMessage = 'You’re signed out. Your cloud ledger is safe.';
  try {
    const { error } = await cloud.client.auth.signOut();
    if (error) throw error;
  } catch (err) {
    console.error('[Ledgerwise cloud] Sign out failed', err);
    toast('Could not sign out. Check your connection and try again.', 'error');
  }
}

async function submitCloudDelete(form) {
  const confirmation = cloudFormValue(form, 'confirmation').trim().toUpperCase();
  if (confirmation !== 'DELETE') { cloudFormError(form, 'Type DELETE exactly to confirm.'); return; }
  if (!cloud.client || !cloud.user) { cloudFormError(form, 'You are no longer signed in. Reload the page and try again.'); return; }
  const submit = form.querySelector('button[type="submit"]');
  if (submit) { submit.disabled = true; submit.textContent = 'Deleting your account…'; }
  if (cloud.timer) { window.clearTimeout(cloud.timer); cloud.timer = null; }
  cloud.pending = false;
  cloud.deleting = true;
  try {
    const { error } = await cloud.client.rpc('delete_my_account');
    if (error) throw error;
  } catch (err) {
    console.error('[Ledgerwise cloud] Account deletion failed', err);
    cloud.deleting = false;
    if (submit) { submit.disabled = false; submit.textContent = 'Delete account & ledger'; }
    const missing = err && (err.code === '42883' || /function .*delete_my_account.* does not exist/i.test(String(err.message || '')));
    cloudFormError(form, missing
      ? 'Account deletion is not available yet. Please contact support.'
      : 'Deletion could not be completed. Nothing else was changed. Check your connection and try again.');
    return;
  }
  try { await cloud.client.auth.signOut({ scope: 'local' }); } catch (err) { /* the account is already gone */ }
  cloudClearLocal();
  cloud.deleted = true;
  cloud.deleting = false;
  cloud.user = null;
  cloud.session = null;
  cloud.loadedUserId = null;
  cloud.revision = 0;
  cloud.hasLedger = false;
  cloud.pending = false;
  cloud.conflict = false;
  cloud.localCandidate = null;
  state = emptyState();
  closeModal();
  renderCloudStatus();
  showAuthDeleted();
}

async function cloudDeleteLedger() {
  if (!cloud.client || !cloud.user) throw new Error('Sign in again before erasing your ledger.');
  if (cloud.timer) { window.clearTimeout(cloud.timer); cloud.timer = null; }
  if (cloud.flushing) { try { await cloud.flushing; } catch (err) { /* deletion is explicit */ } }
  const { error } = await cloud.client.from(CLOUD_TABLE).delete().eq('user_id', cloud.user.id);
  if (error) {
    console.error('[Ledgerwise cloud] Ledger deletion failed', error);
    throw new Error('The cloud ledger could not be erased. Nothing was changed.');
  }
  cloud.revision = 0;
  cloud.hasLedger = false;
  cloud.lastSync = null;
  cloud.pending = false;
  cloud.conflict = false;
  cloud.localCandidate = null;
  cloudClearLocal();
  cloudSetStatus('idle');
}

    <p>These terms are governed by the laws of Kenya. Questions or complaints should be sent to the contact below.</p>
    ${cloudLegalContact()}
  </div>`;
}

function openCloudLegal(doc) {
  const isTerms = doc === 'terms';
  openModal(modalShell({
    title: isTerms ? 'Terms of use' : 'Privacy notice',
    sub: `Ledgerwise FX · version ${CLOUD_TERMS_VERSION}`,
    body: `<div class="modal-body">${isTerms ? cloudLegalTerms() : cloudLegalPrivacy()}</div>
      <div style="display:flex;justify-content:flex-end;padding:0 24px 22px"><button type="button" class="btn btn-ghost" data-act="close-modal">Close</button></div>`
  }));
}

/* ---------------------------- lifecycle ---------------------------- */

function bindCloudLifecycle() {
  if (cloud.initialized) return;
  cloud.initialized = true;

  window.addEventListener('online', () => {
    if (!cloud.user) return;
    if (cloud.status === 'error' || cloud.pending || cloud.status === 'local') {
      toast('Back online. Saving your ledger…', 'info');
      cloudFlush();
    }
  });

  window.addEventListener('offline', () => {
    if (!cloud.user) return;
    if (cloud.pending || cloud.flushing) {
      cloud.lastError = 'You are offline. Changes are kept in this browser and will sync when you reconnect.';
      renderCloudStatus();
    }
  });

  window.addEventListener('storage', (event) => {
    if (event.key !== CLOUD_META_KEY || !event.newValue || !cloud.user) return;
    try {
      const meta = JSON.parse(event.newValue);
      if (meta && meta.userId === cloud.user.id && Number(meta.revision) > cloud.revision) {
        if (cloud.timer) { window.clearTimeout(cloud.timer); cloud.timer = null; }
        cloud.conflict = true;
        cloud.pending = true;
        cloudSetStatus('conflict');
        renderCloudStatus();
        if (document.visibilityState === 'visible' && !document.querySelector('.modal-backdrop')) {
          openCloudConflictModal();
        }
      }
    } catch (err) { /* malformed companion data is ignored */ }
  });

  window.addEventListener('beforeunload', (event) => {
    if (cloud.user && (cloud.pending || cloud.flushing || cloud.status === 'conflict' || cloud.status === 'local')) {
      event.preventDefault();
      event.returnValue = '';
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && cloud.user && cloud.pending && !cloud.flushing) {
      cloudFlush();
    }
  });
}

/* ---------------------------- boot ---------------------------- */

function boot() {
  mountThemeCss();
  watchSystemTheme();
  wireEvents();
  state = emptyState();
  state.settings.theme = storedThemeHint();
  applyTheme();
  startCloudApp();
}

boot();
