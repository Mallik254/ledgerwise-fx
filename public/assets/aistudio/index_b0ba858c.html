      </div>
      ${watchTimeField('from', 'Window opens', w.from)}
      ${watchTimeField('to', 'Window closes', w.to)}
      <div class="field full">
        <label for="wa-trigger">The trigger — what has to be true <span class="req">*</span></label>
        <input class="input" id="wa-trigger" name="trigger" type="text" maxlength="140" required value="${fieldValue(w.trigger)}" placeholder="London BOS into the 1.1210 FVG, retrace holds, no red news for 15 minutes">
        <div class="hint">Write the condition you can check with your hand on the mouse. If it cannot be read off the chart, it is not a trigger.</div>
      </div>
      <div class="field">
        <label for="wa-r">What the plan pays, in R</label>
        <input class="input" id="wa-r" name="plannedR" type="number" step="0.1" min="0" max="20" value="${fieldValue(w.plannedR)}" placeholder="2">
        <div class="hint">The target at entry, not the outcome. It is what a miss gets priced against.</div>
      </div>
      <div class="field">
        <label for="wa-note">Anything else</label>
        <input class="input" id="wa-note" name="note" type="text" maxlength="140" value="${fieldValue(w.note)}" placeholder="Skip if the CPI print lands in this window">
      </div>
      ${checklistFieldsHTML({
        checks: Array.isArray(w.checks) ? w.checks : [],
        grade: w.grade || '',
        locked: false,
        autoMode: !existing || Array.isArray(w.checks),
        unit: 'confluence check'
      })}
      <div class="form-note">Times follow the clock on this laptop. Picking a session fills the standard window; change it if your desk hours differ. When the window closes, the app asks one question — took it, missed it, nothing came, not at the screen. That answer is the evidence.</div>
    </div>`;
  formModal({
    title: existing ? 'Edit the armed setup' : 'Arm a setup',
    sub: existing ? 'The window and the trigger, written before price decides.' : (preset && preset.label ? `One setup, one condition, one window. ${esc(preset.label)}.` : 'One setup, one condition, one window.'),

  if (form) {
    form.dataset.ckNew = existing ? '' : 'yes';

    wireChecklist(form);
    const sel = form.elements.namedItem('session');
    const from = form.elements.namedItem('from');
    const to = form.elements.namedItem('to');
    const dateEl = form.elements.namedItem('date');
    let touched = !!existing;
    [from, to].forEach((el) => { if (el) el.addEventListener('change', () => { touched = true; }); });
    if (sel) sel.addEventListener('change', () => {
      if (touched) return;
      const win2 = SESSION_UTC[sel.value];
      if (!win2) return;
      const day = (dateEl && dateEl.value) || todayISO();
      from.value = utcHMToLocal(day, win2[0]);
      to.value = utcHMToLocal(day, win2[1]);

}

function watchHM(value, fallback) {
  const v = String(value || '');
  return /^\d{2}:\d{2}$/.test(v) ? v : fallback;
}

function saveWatch(form) {
  const fd = new FormData(form);
  const id = String(fd.get('id') || '');
  const date = String(fd.get('date') || '');
  if (isNaN(parseISODate(date).getTime())) { toast('Pick the day the window belongs to.', 'error'); return; }
  const trigger = String(fd.get('trigger') || '').trim().slice(0, 140);
  if (!trigger) { toast('Write the trigger. A window with no condition is just watching television.', 'error'); return; }
  const pair = PAIR_OPTIONS.includes(String(fd.get('pair'))) ? String(fd.get('pair')) : watchLastPair();
  const direction = String(fd.get('direction')) === 'short' ? 'short' : 'long';
  const session = SESSIONS.includes(String(fd.get('session'))) ? String(fd.get('session')) : 'London';
  const from = watchHM(fd.get('from'), '');
  const to = watchHM(fd.get('to'), '');
  if (from && to && to <= from) { toast('The window closes before it opens — check the two times.', 'error'); return; }
  const rawR = String(fd.get('plannedR') || '').trim();
  const plannedR = rawR === '' ? null : roundTo(clamp(numFrom(rawR), 0, 20), 2);
  const note = String(fd.get('note') || '').trim().slice(0, 140);
  const existing = id ? state.watch.find((w) => w.id === id) : null;
  // The check is answered at arm time, when the result is genuinely unknown.
  // Everything later inherits that grade instead of inventing one.
  const ck = syncChecklist(form) || { grade: '', score: 0, total: 0, picked: [], mode: 'keep' };
  const grade = ck.grade;
  if (ck.mode === 'auto' && !existing && ck.score === 0 && checklistDef().on) {
    toast('Answer the confluence check first. An armed window with no conditions is a wish, not a plan.', 'error');
    const first = form.querySelector('input[name="ck"]');
    if (first) first.focus();
    return;
  }
  if (ck.mode === 'auto' && (grade === 'C' || grade === 'F') && form.dataset.ckConfirm !== 'yes') {
    askGradeConfirm(form, grade, ck, 'Arm');
    return;
  }
  // Arming is where the week's plan is checked, because that is the last
  // moment the decision is still cheap to change.
  const blockers = weekPlanBlockers({ pair, session, date, grade });
  if (blockers.length && String(fd.get('plan-override') || '') !== 'yes') { weekPlanRefuse(form, blockers); return; }
  if (existing) {
    Object.assign(existing, {
      date, pair, direction, session, from, to, trigger, plannedR, note,
      checks: ck.mode === 'auto' ? ck.picked : (existing.checks || []),
      checkScore: ck.mode === 'auto' ? ck.score : (existing.checkScore ?? null),
      checkTotal: ck.mode === 'auto' ? ck.total : (existing.checkTotal ?? null),
      grade: ck.mode === 'auto' ? grade : (existing.grade || '')
    });
    logAudit('watch', `Edited the armed ${pair} window ${from || '—'}–${to || '—'}`);
    commit(`Armed setup updated. ${pair}, ${trigger.slice(0, 40)}.`, 'watch');
    return;
  }
  const armed = {
    id: uid('watch'), date, pair, direction, session, from, to, trigger, plannedR, note,
    checks: ck.mode === 'auto' ? ck.picked : [],
    checkScore: ck.mode === 'auto' ? ck.score : null,
    checkTotal: ck.mode === 'auto' ? ck.total : null,
    grade,
    status: 'armed', reason: '', outcome: '', journal: null, createdAt: new Date().toISOString(), resolvedAt: ''
  };
  state.watch.push(armed);
  logAudit('watch', `Armed ${pair} ${direction} for ${date} ${from || '—'}–${to || '—'}`);
  const over = blockers.length ? ` · past ${blockers.length} ${blockers.length === 1 ? 'refusal' : 'refusals'}, written to the register` : '';
  if (blockers.length) weekPlanBreach(blockers, { date, accountId: '', note: `${pair} ${direction} armed outside the plan.` });
  commit(`${pair} armed${from && to ? ` for ${from}–${to}` : ''}. The window is on the clock now.${over}`, 'watch');
  // The chart is only worth anything if it is taken now, not reconstructed later.
  openEvidenceModal(armed.id);
}

  const prior = state.watch.filter((x) => x.id !== w.id && x.journal && x.journal.cond)

        ${armChart}
      </div>
      <div class="field full">

      <div class="field full" id="wr-missed" style="display:none">
        <div class="watch-missed-block">
          <div class="field">

          <div class="field">
            <label for="wr-outcome">What did price actually do?</label>
            <select class="select" id="wr-outcome" name="outcome">${outcomeOptions}</select>
            <div class="hint">Only a known outcome is priced. Guessing turns a lesson into a fantasy.</div>
          </div>
          <div class="field">
            <label for="wr-r">Target R from the plan</label>
            <input class="input" id="wr-r" name="plannedR" type="number" step="0.1" min="0" max="20" value="${fieldValue(w.plannedR)}" placeholder="2">
            <div class="hint">Used only when the answer above is that it hit your target.</div>
          </div>
        </div>
      </div>
      <div class="field full">
        <label for="wr-cond">One: what was the market actually doing?</label>
        <select class="select" id="wr-cond" name="cond">${Object.keys(CLOSEOUT_MARKET).map((k) => `<option value="${k}"${(w.journal && w.journal.cond) === k || (!w.journal && k === carryCond) ? ' selected' : ''}>${esc(CLOSEOUT_MARKET[k])}</option>`).join('')}</select>
        ${carryCond && !w.journal ? '<div class="hint">Filled from your last close-out because it was the same answer twice — change it if today was different.</div>' : '<div class="hint">One choice. It is what turns "the market was bad" into something you can check next week.</div>'}
      </div>
      <div class="field full" id="wr-taken" style="display:none">
        <div class="watch-missed-block">
          <div class="field">
            <label for="wr-exit">Two: why did the money come off the table?</label>
            <select class="select" id="wr-exit" name="exit">${Object.keys(CLOSEOUT_EXIT).map((k) => `<option value="${k}"${(w.journal && w.journal.exit) === k ? ' selected' : ''}>${esc(CLOSEOUT_EXIT[k])}</option>`).join('')}</select>
            <div class="hint">The exit you actually took, not the one the plan said.</div>
          </div>
          <div class="field">
            <label>Three: did you follow every rule you wrote before entry? <span class="req">*</span></label>
            <div class="watch-radio-col">
              ${Object.keys(CLOSEOUT_FOLLOWED).map((k) => `
              <label class="check">
                <input type="radio" name="followed" value="${k}"${w.journal && w.journal.followed === k ? ' checked' : ''}>
                <span><b>${esc(CLOSEOUT_FOLLOWED[k])}</b>${k === 'no' ? ' — it goes on the mistake wall' : ''}</span>
              </label>`).join('')}
            </div>
            <div class="hint">Neither is ticked for you. This is the answer the adherence number and the wall both read.</div>
          </div>
        </div>
      </div>
      <div class="field full">
        <label for="wr-note">One line about it</label>
        <input class="input" id="wr-note" name="note" type="text" maxlength="140" value="${fieldValue(w.note)}" placeholder="Chart was on the screen, phone was in my hand.">
      </div>
      <div class="form-note">Nobody is graded on this. The point of the reason is that fear and inattention need different fixes — one is a Fear Card, the other is a shorter watch list and a window that tells you when to sit down.</div>
    </div>`;
  formModal({
    title: 'Close out the window',
    sub: 'What happened, then three short answers. About sixty seconds.',
    fields, submitLabel: 'Record it', formKey: 'watch-resolve', wide: true,
    hidden: `<input type="hidden" name="id" value="${w.id}">`
  });
  const form = document.querySelector('[data-form="watch-resolve"]');
  if (form) {
    const missedBlock = form.querySelector('#wr-missed');
    const takenBlock = form.querySelector('#wr-taken');
    const reasonSel = form.elements.namedItem('reason');
    const hint = form.querySelector('#wr-reason-hint');
    const sync = () => {
      const picked = form.querySelector('input[name="status"]:checked');
      const v = picked ? picked.value : '';
      if (missedBlock) missedBlock.style.display = v === 'missed' ? '' : 'none';
      if (takenBlock) takenBlock.style.display = v === 'taken' ? '' : 'none';
    };
    form.querySelectorAll('input[name="status"]').forEach((r) => r.addEventListener('change', sync));
    if (reasonSel && hint) reasonSel.addEventListener('change', () => {
      hint.textContent = (MISS_REASONS[reasonSel.value] || MISS_REASONS.other).hint;
    });
    sync();
  }
  hydrateShots();
}

function saveResolve(form) {
  const fd = new FormData(form);
  const w = state.watch.find((x) => x.id === String(fd.get('id') || ''));
  if (!w) { toast('That armed setup is no longer in the list.', 'error'); return; }
  const status = String(fd.get('status') || '');
  if (!WATCH_STATUS[status] || status === 'armed') { toast('Pick what happened in the window.', 'error'); return; }
  const rawR = String(fd.get('plannedR') || '').trim();
  const note = String(fd.get('note') || '').trim().slice(0, 140);
  // The third answer is the one the adherence number and the mistake wall both
  // read, so it is asked for rather than assumed — and it is never pre-ticked.
  const cond = CLOSEOUT_MARKET[String(fd.get('cond'))] ? String(fd.get('cond')) : '';
  const exitKey = CLOSEOUT_EXIT[String(fd.get('exit'))] ? String(fd.get('exit')) : '';
  const followedRaw = String(fd.get('followed') || '');
  if (status === 'taken' && followedRaw !== 'yes' && followedRaw !== 'no') {
    toast('Answer the third question first: did you follow every rule you wrote before entry? The adherence number and the mistake wall are both built from that answer, so it is not left blank.', 'error');
    const jump = form.querySelector('input[name="followed"]');
    if (jump) { jump.scrollIntoView({ block: 'center' }); jump.focus(); }
    return;
  }
  w.status = status;
  w.note = note;
  w.plannedR = rawR === '' ? w.plannedR : roundTo(clamp(numFrom(rawR), 0, 20), 2);
  w.resolvedAt = new Date().toISOString();
  w.journal = { cond, exit: status === 'taken' ? exitKey : '', followed: status === 'taken' ? followedRaw : '', at: new Date().toISOString() };
  if (status === 'missed') {
    w.reason = MISS_REASONS[String(fd.get('reason'))] ? String(fd.get('reason')) : 'other';
    w.outcome = MISS_OUTCOMES[String(fd.get('outcome'))] ? String(fd.get('outcome')) : 'unknown';
  } else {
    w.reason = '';
    w.outcome = '';
  }
  const label = WATCH_STATUS[status].label;
  logAudit('watch', `Closed out ${w.pair} ${w.date} as ${label}`);
  const brokeRule = status === 'taken' && w.journal.followed === 'no';
  const extra = status === 'missed' && (w.reason === 'fear' || w.reason === 'focus')
    ? ' The row now offers a fear card for it.'
    : status === 'taken' ? ' Log the trade from the row when you are ready.' : '';
  const wall = brokeRule ? ' You said a rule broke — it sits on the Day sheet until you write the one line.' : '';
  commit(`${w.pair} closed out as ${label.toLowerCase()}.${extra}${wall}`, 'watch');
  // The picture of what price did after the window is worth ten lines of note,
  // and it is the one thing that cannot be recalled later — so it is asked for
  // while the chart is still on the screen.
  if ((status === 'taken' || status === 'missed') && !shotsOf(w.id).some((s) => s.slot === 'after')) {
    openEvidenceModal(w.id, 'after');
  }
}

function handleDeleteWatch(id) {
  const w = state.watch.find((x) => x.id === id);
  if (!w) return;
  confirmDialog({
    title: 'Delete this armed setup?',
    text: `${esc(w.pair)} · ${esc(w.date)} ${esc(w.from || '—')}–${esc(w.to || '—')}${w.status !== 'armed' ? `, already closed out as ${esc(WATCH_STATUS[w.status].label.toLowerCase())}` : ''}. The trigger and the answer go with it.`,
    confirmLabel: 'Delete it',
    onConfirm: () => {
      const shots = shotsOf(id);
      state.watch = state.watch.filter((x) => x.id !== id);
      state.shots = state.shots.filter((s) => s.owner !== id);
      shots.forEach((s) => { shotRemove(s.id).catch(() => {}); cloudShotForget(s); });
      logAudit('watch', `Deleted armed ${w.pair} for ${w.date}${shots.length ? `, taking ${shots.length} arm-time picture${shots.length === 1 ? '' : 's'} with it` : ''}`);
      commit(shots.length
        ? `Armed setup deleted and ${shots.length} picture${shots.length === 1 ? '' : 's'} removed from this laptop.`
        : 'Armed setup deleted.', 'watch', 'info');
    }
  });
}

/* ============================================================
   LEDGERWISE FX — evidence shots
   Chart pictures live in IndexedDB, never in the ledger blob: two
   screenshots would eat the whole localStorage quota and every cloud
   sync would carry them. state.shots keeps only the caption.
   ============================================================ */

const SHOT_DB_NAME = 'ledgerwise_fx_shots';
const SHOT_STORE = 'shots';
let shotDbPromise = null;

function shotDb() {
  if (shotDbPromise) return shotDbPromise;
  shotDbPromise = new Promise((resolve, reject) => {
    if (typeof indexedDB === 'undefined' || !indexedDB) { reject(new Error('this browser has no picture storage')); return; }
    const req = indexedDB.open(SHOT_DB_NAME, 1);
    req.onupgradeneeded = () => {
      const db = req.result;
      if (!db.objectStoreNames.contains(SHOT_STORE)) db.createObjectStore(SHOT_STORE, { keyPath: 'id' });
    };
    req.onsuccess = () => resolve(req.result);
    req.onerror = () => reject(req.error || new Error('picture storage refused to open'));
    req.onblocked = () => reject(new Error('close the other Ledgerwise tab first, then try again'));
  });
  return shotDbPromise;
}

function shotRequest(mode, fn) {
  return shotDb().then((db) => new Promise((resolve, reject) => {
    const t = db.transaction(SHOT_STORE, mode);
    let result;
    try { result = fn(t.objectStore(SHOT_STORE)); } catch (err) { reject(err); return; }
    t.oncomplete = () => resolve(result && result.result !== undefined ? result.result : undefined);
    t.onerror = () => reject(t.error || new Error('picture storage write failed'));
    t.onabort = () => reject(t.error || new Error('picture storage write aborted'));
  }));
}

function shotPut(rec) { return shotRequest('readwrite', (st) => st.put(rec)); }
function shotGet(id) { return shotRequest('readonly', (st) => st.get(id)); }
function shotRemove(id) { return shotRequest('readwrite', (st) => st.delete(id)); }

/* ------------------------------------------------------------
   Cloud picture sync. IndexedDB stays the cache, so the app opens
   with no network; the cloud copy is what makes a picture readable
   on a second laptop. Objects live at <user-id>/<trade-id>/<shot-id>.jpg
   and the bucket policy only ever matches your own user id.
   ------------------------------------------------------------ */

const SHOT_BUCKET = 'lw-shots-fx';

function shotSyncWanted() {
  return state.settings.shotsCloud === true;
}

function shotSyncReady() {
  return shotSyncWanted() && !!cloud.user && !!cloud.user.id && !!cloud.client
    && !!(cloud.client.storage && typeof cloud.client.storage.from === 'function');
}

function shotFolderPath(ownerId, shotId) {
  if (!cloud.user || !cloud.user.id) return '';
  return `${cloud.user.id}/${ownerId}/${shotId}.jpg`;
}

function dataUrlToBlob(dataUrl) {
  const comma = String(dataUrl).indexOf(',');
  const bin = atob(String(dataUrl).slice(comma + 1));
  const bytes = new Uint8Array(bin.length);
  for (let i = 0; i < bin.length; i += 1) bytes[i] = bin.charCodeAt(i);
  return new Blob([bytes], { type: 'image/jpeg' });
}

function blobToDataUrl(blob) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result || ''));
    fr.onerror = () => reject(fr.error || new Error('the downloaded picture could not be read'));
    fr.readAsDataURL(blob);
  });
}

function cloudShotUpload(path, dataUrl) {
  return cloud.client.storage.from(SHOT_BUCKET)
    .upload(path, dataUrlToBlob(dataUrl), { contentType: 'image/jpeg', upsert: true })
    .then((res) => !res.error);
}

function cloudShotDownload(path) {
  return cloud.client.storage.from(SHOT_BUCKET).download(path).then((res) => {
    if (res.error || !res.data) return '';
    return blobToDataUrl(res.data);
  });
}

function cloudShotRemove(path) {
  return cloud.client.storage.from(SHOT_BUCKET).remove([path]).then(() => true).catch(() => false);
}

// A picture with a recorded path is forgotten even when sync is switched off:
// otherwise turning the switch off would strand his old charts in storage forever.
function cloudShotForget(meta) {
  if (!meta || !meta.remote) return Promise.resolve(false);
  if (!cloud.user || !cloud.client || !cloud.client.storage) return Promise.resolve(false);
  return cloudShotRemove(meta.remote);
}

// Runs after the local write succeeds, so a failed upload never loses the picture.
function syncShotUp(meta, dataUrl) {
  if (shotSyncReady()) {
    const path = meta.remote || shotFolderPath(meta.owner, meta.id);
    if (!path) return Promise.resolve('signin');
    meta.remote = path;
    return cloudShotUpload(path, dataUrl)
      .then((ok) => { meta.up = ok; if (ok) saveState(); return ok ? 'up' : 'down'; })
      .catch(() => { meta.up = false; return 'down'; });
  }
  return Promise.resolve(shotSyncWanted() ? 'signin' : 'off');
}

function cloudShotPull(meta) {
  if (!shotSyncReady() || !meta.remote) return Promise.resolve('');
  return cloudShotDownload(meta.remote)
    .then((dataUrl) => {
      if (!/^data:image\/jpeg/.test(dataUrl)) return '';
      meta.up = true;
      return shotPut({
        id: meta.id, owner: meta.owner, slot: meta.slot, dataUrl,
        w: meta.w, h: meta.h, bytes: meta.bytes, at: meta.at
      }).then(() => dataUrl, () => dataUrl);
    })
    .catch(() => '');
}

function shotWaiting() {
  return state.shots.filter((s) => !s.up && !s.gone).length;
}

function shotLost() {
  return state.shots.filter((s) => s.gone).length;
}

function shotSyncLine() {
  if (!cloud.user) return 'You are not signed in, so these pictures live on this laptop only.';
  if (shotSyncWanted()) {
    const waiting = shotWaiting();
    const lost = shotLost();
    return `Picture sync is on, so each chart is also saved to your own cloud folder and any laptop of yours signed in here can load it.${waiting ? ` ${waiting} picture${waiting === 1 ? '' : 's'} still only on this laptop.` : ' All of them have a cloud copy.'}${lost ? ` ${lost} listed picture${lost === 1 ? '' : 's'} no longer have a file here to send.` : ''}`;
  }
  return 'Picture sync is off, so these stay on this laptop and a second device cannot load them. Turn it on below to change that.';
}

function shotMissingReason(meta) {
  if (meta && meta.remote) {
    if (!cloud.user) return 'Sign in and this picture comes down from your own cloud folder.';
    if (!shotSyncWanted()) return 'Picture sync is switched off. Turn it on and this loads from your cloud folder.';
    return 'This picture did not download. Check the connection, then open it again.';
  }
  if (meta) return 'Not on this laptop and never uploaded, so there is nothing to show. The caption stays in the ledger.';
  return 'That picture is no longer in the index.';
}

function handleShotsCloud(on) {
  if (!on) {
    state.settings.shotsCloud = false;
    logAudit('settings', 'Turned off chart picture sync');
    saveState();
    renderApp(ui.page);
    toast('Picture sync off. New charts stay on this laptop; copies already in your cloud folder are still listed in Settings.', 'info');
    return;
  }
  if (!cloud.user) { toast('Sign in first — the pictures need your own cloud folder.', 'error'); return; }
  confirmDialog({
    title: 'Sync chart pictures to your cloud?',
    text: 'Each picture stays on this laptop and also gets a copy in a private folder that only your sign-in can open. That is the change: the charts leave this machine. A TradingView or MT5 frame often shows your account number or balance, so crop those out before you attach if you would rather they were not stored.',
    confirmLabel: 'Turn picture sync on',
    onConfirm: () => {
      state.settings.shotsCloud = true;
      logAudit('settings', 'Turned on chart picture sync to private cloud storage');
      saveState();
      renderApp(ui.page);
      const waiting = shotWaiting();
      toast(waiting ? `Picture sync on. New charts upload as you attach them, and ${waiting} already here still need their first upload.` : 'Picture sync on. New charts upload as you attach them.', 'success');
    }
  });
}

function purgeCloudShots() {
  const rows = state.shots.filter((s) => s.remote);
  if (!rows.length) { toast('There are no cloud copies of anything on this laptop.', 'info'); return; }
  if (!cloud.user || !cloud.client || !cloud.client.storage) {
    toast('Sign in to delete the cloud copies — the storage rules only let your own account remove them.', 'error');
    return;
  }
  confirmDialog({
    title: 'Delete every cloud copy?',
    text: `${rows.length} picture${rows.length === 1 ? '' : 's'} leave your cloud folder. Everything on this laptop stays, so nothing you can see today disappears.`,
    confirmLabel: 'Delete cloud copies',
    onConfirm: () => cloud.client.storage.from(SHOT_BUCKET).remove(rows.map((s) => s.remote))
      .then((res) => {
        if (res.error) throw res.error;
        rows.forEach((s) => { s.remote = ''; s.up = false; });
        logAudit('shot', `Removed ${rows.length} cloud picture copy${rows.length === 1 ? '' : 's'}`);
        saveState();
        renderApp(ui.page);
        toast('Cloud copies deleted. The pictures on this laptop are untouched.', 'success');
      })
      .catch(() => { toast('The cloud refused the delete. Your sign-in may have expired — sign out and back in, then try again.', 'error'); })
  });
}

// Settings -> the card that decides where chart pictures are stored.
function shotSyncCardHTML() {
  const total = state.shots.length;
  const cloudRows = state.shots.filter((s) => s.remote);
  const upRows = cloudRows.filter((s) => s.up);
  const waiting = shotWaiting();
  const upBytes = upRows.reduce((a, s) => a + (Number(s.bytes) || 0), 0);
  const on = shotSyncWanted();
  const signedIn = !!cloud.user;
  const lines = `
    <div class="storage-line"><span>Pictures on this laptop</span><b>${total} · ${shotBytesLabel(shotBytesTotal())}</b></div>
    <div class="storage-line"><span>Copies in your cloud folder</span><b>${upRows.length}${upRows.length ? ` · ${shotBytesLabel(upBytes)}` : ''}</b></div>
    <div class="storage-line"><span>Waiting to be sent</span><b>${waiting}</b></div>
    ${shotLost() ? `<div class="storage-line"><span>Listed but no file here</span><b>${shotLost()}</b></div>` : ''}
    <div class="storage-line"><span>Sync</span><b>${on ? (signedIn ? 'On — uploading to your folder' : 'On — needs a sign-in') : 'Off — this laptop only'}</b></div>`;
  const buttons = `
    <div class="grid grid-2 mt-14">
      <button class="btn btn-sm btn-ghost" data-act="${on ? 'shots-cloud-off' : 'shots-cloud-on'}">${icon(on ? 'lock' : 'upload', 13)} ${on ? 'Turn off picture sync' : 'Turn on picture sync'}</button>
      <button class="btn btn-sm btn-ghost" data-act="shots-backfill"${on && signedIn && waiting ? '' : ' disabled'} title="${!on ? 'Turn picture sync on first' : signedIn ? 'Nothing on this laptop is waiting' : 'Sign in with your ledger account first'}">${icon('refresh', 13)} Upload the ${waiting || 'pending'} here</button>
      ${cloudRows.length ? `<button class="btn btn-sm btn-ghost" data-act="shots-purge">${icon('trash', 13)} Delete all cloud copies</button>` : ''}
    </div>`;
  const note = on
    ? `Each new chart is written to ${SHOT_BUCKET} under your own user id, and the database rule lets only that id read it. Your publishable key alone cannot list or open these files. The JSON backup still carries only the caption and the size, so a backup file on its own is never the pictures.`
    : `Nothing leaves this laptop while this is off, and a second laptop shows each picture as unavailable. Turning it on writes new charts into your own private storage folder; the pictures already on this laptop need one upload from you, using the button above.`;
  return `
        <section class="card">
          <div class="card-head">
            <div><div class="card-title">Chart pictures</div><div class="card-sub">Where the before and after screenshots live, and what another laptop can load.</div></div>
            <span class="badge ${on && signedIn ? 'badge-mint' : 'badge-muted'} no-dot">${on ? (signedIn ? 'Syncing' : 'Needs sign-in') : 'Local only'}</span>
          </div>
          ${lines}
          ${buttons}
          <div class="form-note mt-14" style="font-size:10.5px">${note}</div>
          ${signedIn ? '' : '<div class="form-note form-note amber mt-14" style="font-size:10.5px">Picture sync needs the same sign-in as the ledger. Sign in above and this works on every laptop you use.</div>'}
        </section>`;
}

function backfillShots() {
  if (!shotSyncReady()) {
    toast('Picture sync needs a sign-in and the switch turned on in Settings.', 'error');
    return Promise.resolve();
  }
  const queue = state.shots.filter((s) => !s.up && !s.gone);
  if (!queue.length) {
    toast('Nothing to upload — every picture on this laptop already has a cloud copy.', 'info');
    return Promise.resolve();
  }
  let done = 0;
  let lost = 0;
  let refused = 0;
  toast(`Uploading ${queue.length} picture${queue.length === 1 ? '' : 's'} to your cloud folder...`, 'info');
  return queue.reduce((chain, meta) => chain.then(() => shotGet(meta.id).then((rec) => {
    if (!rec || !rec.dataUrl) { meta.gone = true; lost += 1; return; }
    return syncShotUp(meta, rec.dataUrl).then((r) => { if (r === 'up') done += 1; else refused += 1; });
  }).catch(() => { refused += 1; })), Promise.resolve())
    .then(() => {
      saveState();
      renderApp(ui.page);
      const bits = [`${done} picture${done === 1 ? '' : 's'} uploaded`];
      if (lost) bits.push(`${lost} have no file on this laptop`);
      if (refused) bits.push(`${refused} the cloud refused`);
      toast(bits.join(', ') + '.', lost || refused ? 'info' : 'success');
    });
}

function shotsOf(ownerId) {
  return state.shots.filter((s) => s.owner === ownerId)
    .sort((a, b) => String(a.slot).localeCompare(String(b.slot)) || String(a.at).localeCompare(String(b.at)));
}

// A chart can belong to a logged trade or to an armed window. The point of the
// arm-time picture is that it is taken before there is any trade to attach it to.
function shotOwnerOf(ownerId) {
  const t = state.trades.find((x) => x.id === ownerId);
  if (t) return { kind: 'trade', rec: t };
  const w = state.watch.find((x) => x.id === ownerId);
  if (w) return { kind: 'watch', rec: w };
  return null;
}

function shotOwnerNoun(ownerId) {
  const o = shotOwnerOf(ownerId);
  return o ? (o.kind === 'watch' ? 'armed window' : 'trade') : 'record';
}

function shotSlotLabel(slotKey, ownerId) {
  const kind = (shotOwnerOf(ownerId) || {}).kind;
  if (kind === 'watch' && slotKey === 'before') return 'Chart at arm time';
  return (SHOT_SLOTS[slotKey] || SHOT_SLOTS.extra).label;
}

function shotSlotHint(slotKey, ownerId) {
  const kind = (shotOwnerOf(ownerId) || {}).kind;
  if (kind === 'watch' && slotKey === 'before') return 'What you see now, levels drawn, before price decides. This is the picture that proves the trigger was real.';
  if (kind === 'watch' && slotKey === 'after') return 'The same chart when the window closed — the result, not the memory of it.';
  return (SHOT_SLOTS[slotKey] || SHOT_SLOTS.extra).hint;
}

function shotBytesTotal() {
  return state.shots.reduce((a, s) => a + (Number(s.bytes) || 0), 0);
}

function shotBytesLabel(bytes) {
  const b = Number(bytes) || 0;
  if (b >= 1048576) return `${(b / 1048576).toFixed(1)} MB`;
  if (b >= 1024) return `${Math.round(b / 1024)} KB`;
  return `${b} B`;
}

function shotsCountHTML(ownerId) {
  const n = shotsOf(ownerId).length;
  return `<button class="btn btn-sm btn-ghost" data-act="evidence" data-id="${ownerId}">${icon('camera', 13)} Evidence${n ? ` (${n})` : ''}</button>`;
}

// A pasted or dropped chart has to land somewhere even when the evidence modal
// was never found, so the picture is held here while he picks the trade.
let pendingShotFile = null;

function openShotTargetModal() {
  const rows = [...state.trades].sort((a, b) => String(b.date).localeCompare(String(a.date))
    || String(b.id).localeCompare(String(a.id))).slice(0, 12);
  if (!rows.length) { toast('No trades to attach a chart to yet. Log the trade first.', 'error'); return; }
  const picking = !!pendingShotFile;
  const body = `
    <div class="modal-body">
      <div class="tiny muted" style="margin-bottom:10px">${picking ? 'The chart is held for a moment. Which trade does it belong to?' : 'Pick the trade, then paste, drop or choose the chart in its evidence panel.'}</div>
      <div class="side-list">

// Resized to a JPEG data URL before it is stored: a raw MT5 PNG is often
// 2 MB, which is 10x the size for the same readable chart.
function compressShot(file) {
  return new Promise((resolve, reject) => {
    if (!file || !/^image\//.test(String(file.type || ''))) { reject(new Error('that is not a picture file')); return; }
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      URL.revokeObjectURL(url);
      const srcW = Math.max(1, img.naturalWidth || 0);
      const scale = Math.min(1, SHOT_MAX_EDGE / srcW);
      const w = Math.max(1, Math.round(srcW * scale));
      const h = Math.max(1, Math.round(Math.max(1, img.naturalHeight || 0) * scale));
      let dataUrl = '';
      try {
        const canvas = document.createElement('canvas');
        canvas.width = w;
        canvas.height = h;
        const ctx = canvas.getContext('2d');
        ctx.fillStyle = cssToken('--frame', '#12151a');
        ctx.fillRect(0, 0, w, h);
        ctx.drawImage(img, 0, 0, w, h);
        dataUrl = canvas.toDataURL('image/jpeg', 0.72);
      } catch (err) { dataUrl = ''; }
      if (!/^data:image\/jpeg/.test(dataUrl)) { reject(new Error('this browser could not resize the picture')); return; }
      resolve({ dataUrl, w, h, bytes: Math.round((dataUrl.length - 23) * 0.75) });
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('that picture could not be read')); };
    img.src = url;
  });
}

function shotFirstFreeSlot(ownerId) {
  const mine = shotsOf(ownerId);
  const used = mine.map((s) => s.slot);
  if (!used.includes('before')) return 'before';
  if (!used.includes('after')) return 'after';
  return mine.length < SHOTS_PER_TRADE ? 'extra' : '';
}

function attachShot(ownerId, slot, file) {
  const holder = shotOwnerOf(ownerId);
  if (!holder) { toast(`That ${shotOwnerNoun(ownerId)} is no longer in the app.`, 'error'); return Promise.resolve(); }
  const owner = holder.rec;
  const isWatch = holder.kind === 'watch';
  const noun = isWatch ? 'armed window' : 'trade';
  if (shotsOf(ownerId).length >= SHOTS_PER_TRADE) {
    toast(`This ${noun} already holds ${SHOTS_PER_TRADE} pictures — that is the cap. Delete one to make room.`, 'error');
    return Promise.resolve();
  }
  if (!SHOT_SLOTS[slot]) {
    toast('That slot is not open here. Use the arm-time or after-picture slot.', 'error');
    return Promise.resolve();
  }
  return compressShot(file).then((shot) => {
    const slotName = shotSlotLabel(slot, ownerId);
    const rec = {
      id: uid('shot'), owner: ownerId, slot, dataUrl: shot.dataUrl,
      w: shot.w, h: shot.h, bytes: shot.bytes, at: new Date().toISOString()
    };
    return shotPut(rec).then(() => {
      const meta = {
        id: rec.id, owner: ownerId, slot, bytes: rec.bytes, w: rec.w, h: rec.h,
        label: slotName, at: rec.at, remote: '', up: false
      };
      state.shots.push(meta);
      logAudit('shot', `Attached ${slotName.toLowerCase()} for ${owner.pair} on ${fmtDateShort(owner.date)}`);
      saveState();
      renderApp(ui.page);
      openEvidenceModal(ownerId);
      const label = slotName;
      return syncShotUp(meta, shot.dataUrl).then((result) => {
        if (result === 'up') {
          toast(`${label} attached (${shotBytesLabel(shot.bytes)}). Saved here and in your own cloud folder.`, 'success');
        } else if (result === 'down') {
          toast(`${label} attached (${shotBytesLabel(shot.bytes)}). Stored here; the cloud copy failed, so it is marked local only.`, 'info');
        } else if (result === 'signin') {
          toast(`${label} attached (${shotBytesLabel(shot.bytes)}). Sync is on but you are signed out, so this one is on this laptop only.`, 'info');
        } else {
          toast(`${label} attached (${shotBytesLabel(shot.bytes)}). It stays on this laptop until you turn picture sync on.`, 'success');
        }
        if (result !== 'off' && document.querySelector(`[data-drop-owner="${ownerId}"]`)) openEvidenceModal(ownerId);
      });
    });
  }).catch((err) => {
    toast((err && err.message) ? err.message : 'The picture could not be stored.', 'error');
  });
}

function hydrateShots(root) {
  const scope = root || document;
  const imgs = [...scope.querySelectorAll('img[data-shot]')].filter((el) => !el.dataset.shotDone);
  if (!imgs.length) return;
  imgs.forEach((el) => { el.dataset.shotDone = '1'; });
  const readOne = (el) => shotGet(el.dataset.shot)
    .then((rec) => {
      if (rec && rec.dataUrl) return rec.dataUrl;
      const meta = state.shots.find((s) => s.id === el.dataset.shot);
      if (meta && !meta.remote) meta.gone = true;
      return meta && meta.remote ? cloudShotPull(meta) : '';
    })
    .catch(() => '');
  Promise.all(imgs.map((el) => readOne(el).then((dataUrl) => ({ el, dataUrl })))).then((list) => {
    list.forEach((pair) => {
      if (!pair || !document.contains(pair.el)) return;
      if (pair.dataUrl) { pair.el.src = pair.dataUrl; return; }
      const div = document.createElement('div');
      div.className = 'shot-missing';
      div.textContent = shotMissingReason(state.shots.find((s) => s.id === pair.el.dataset.shot));
      pair.el.replaceWith(div);
    });
  });
}

// The arm-time chart stays owned by the window it was taken in, so nothing has
// to be re-uploaded when the window becomes a trade — it is surfaced from here.
function watchEvidenceForTrade(t) {
  const wid = String(t.watchId || '');
  if (!wid) return '';
  const w = state.watch.find((x) => x.id === wid);
  if (!w) return '';
  const n = shotsOf(wid).length;
  return `
    <div class="tiny" style="margin-top:8px">
      Carried from the window you armed · ${esc(fmtDateShort(w.date))} ${esc(w.from || '')}–${esc(w.to || '')}${w.plannedR ? ` · planned <b>${fmtR(w.plannedR)}</b>` : ''}.
      ${n ? `<button class="btn-link" data-act="evidence" data-id="${wid}" style="font-size:11px;margin-left:6px">${icon('camera', 12)} Open its ${n} picture${n === 1 ? '' : 's'}</button>`
        : '<span class="muted"> · no chart was attached at arm time.</span>'}
    </div>`;
}

// The planned-versus-recorded gap: the window carries what the plan was worth,
// the trade carries what it actually paid. Nothing here is guessed.
function watchPlanCompareHTML(t) {
  const planned = Number(t.plannedR);
  if (!Number.isFinite(planned) || planned <= 0) return 'Armed from a window, but no target R was written on it — so there is nothing to compare against.';
  const made = Number(t.r);
  if (t.r == null || !Number.isFinite(made)) return `Planned <b>${fmtR(planned)}</b> in the window. Fill the exit and the gap appears here.`;
  const gap = roundTo(made - planned, 2);
  const tail = gap < 0 ? 'left on the table' : gap > 0 ? 'paid more than the plan asked for' : 'exactly the plan';
  return `Planned <b>${fmtR(planned)}</b> · recorded <b>${fmtR(made)}</b> · gap <b>${gap >= 0 ? '+' : ''}${gap.toFixed(2)}R</b> — ${tail}.`;
}

function openShotViewer(shotId) {
  const meta = state.shots.find((s) => s.id === shotId);
  if (!meta) { toast('That picture is no longer in the index.', 'error'); return; }
  const holder = shotOwnerOf(meta.owner);
  const t = holder ? holder.rec : null;
  shotGet(shotId).then((rec) => (rec && rec.dataUrl ? rec.dataUrl : cloudShotPull(meta))).then((dataUrl) => {
    const body = `
      <div class="modal-body">
        ${dataUrl
          ? `<div class="shot-viewer"><img src="${dataUrl}" alt="${esc(meta.label)} chart picture"></div>`
          : `<div class="shot-missing" style="height:180px">${esc(shotMissingReason(meta))}</div>`}
        <div class="tiny muted" style="margin-top:12px">${esc(meta.label)} · ${meta.w}×${meta.h} · ${shotBytesLabel(meta.bytes)} · ${esc(fmtDate(meta.at ? meta.at.slice(0, 10) : ''))}${t ? ` · ${esc(t.pair)} ${fmtDateShort(t.date)}` : ''}</div>
        <div class="modal-actions">
          <div class="left">${dataUrl ? `<button class="btn btn-sm btn-ghost" data-act="shot-delete" data-id="${shotId}">${icon('trash', 13)} Delete</button>` : ''}</div>
          <button class="btn btn-ghost" type="button" data-act="close-modal">Close</button>
        </div>
      </div>`;
    openModal(modalShell({ title: 'Evidence picture', sub: '', body, wide: true }));
  }).catch(() => {
    toast('Browser storage refused to open. Close other Ledgerwise tabs and try again.', 'error');
  });
}

function handleDeleteShot(shotId) {
  const meta = state.shots.find((s) => s.id === shotId);
  if (!meta) { toast('That picture is already gone.', 'info'); return; }
  const ownerId = meta.owner;
  const hasRemote = !!meta.remote;
  const modalOpen = !!document.querySelector('.modal-body [data-shot], .modal-body [data-drop-owner], .modal-body [data-act="shot-delete"]');
  const holder = shotOwnerOf(ownerId);
  const who = holder ? `${esc(holder.rec.pair)} ${fmtDateShort(holder.rec.date)}` : `this ${shotOwnerNoun(ownerId)}`;
  confirmDialog({
    title: 'Delete this picture?',
    text: `${esc(meta.label)} for ${who}. The file leaves this laptop${hasRemote ? ' and your cloud folder' : ''}; nothing else changes.`,
    confirmLabel: 'Delete picture',
    onConfirm: () => {
      state.shots = state.shots.filter((s) => s.id !== shotId);
      logAudit('shot', `Deleted ${meta.label.toLowerCase()} picture`);
      saveState();
      shotRemove(shotId).catch(() => {});
      if (hasRemote) cloudShotForget(meta);
      renderApp(ui.page);
      if (modalOpen) openEvidenceModal(ownerId);
      toast(hasRemote ? 'Picture deleted here and from your cloud folder.' : 'Picture deleted from this laptop.', 'info');
    }
  });
}

  const tone = over ? 'bad' : ratio >= 0.85 ? 'warn' : '';
  return `
    <div class="budget-row">
      <div class="budget-icon">${icon(c.icon || 'bag', 15)}</div>
      <div class="budget-bar">
        <div class="budget-name">${esc(c.name)} ${over ? '<span class="badge badge-rose no-dot">Over</span>' : ''}</div>
        <div class="budget-bar-top">
          <span class="${over ? 'over' : ''}">${hMoney(row.spent)} ${limit > 0 ? `of ${hMoney(limit)}` : 'spent'}</span>

/* ============================ RISK LAB ============================ */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function simulateDesk(cfg, seed = 20261023) {
  const runs = clamp(Math.round(Number(cfg.runs) || 400), 50, 2000);
  const trades = clamp(Math.round(Number(cfg.trades) || 100), 10, 500);
  const winRate = clamp(Number(cfg.winRate) || 0, 0, 100) / 100;
  const winR = Math.max(0.05, Number(cfg.winR) || 1);
  const lossR = Math.max(0.05, Number(cfg.lossR) || 1);
  const risk = clamp(Number(cfg.riskPct) || 0.5, 0.05, 10) / 100;
  const rand = mulberry32(seed);
  const endings = [];
  const drawdowns = [];
  let ruinCount = 0;
  let profitable = 0;
  for (let r = 0; r < runs; r++) {
    let eq = 1;
    let peak = 1;
    let maxDd = 0;
    for (let i = 0; i < trades; i++) {
      const win = rand() < winRate;
      eq *= (1 + risk * (win ? winR : -lossR));
      peak = Math.max(peak, eq);
      maxDd = Math.max(maxDd, (peak - eq) / peak);
      if (eq <= 0.9) break;
    }
    const endingPct = (eq - 1) * 100;
    endings.push(endingPct);
    drawdowns.push(maxDd * 100);
    if (maxDd >= 0.1) ruinCount += 1;
    if (eq > 1) profitable += 1;
  }
  endings.sort((a, b) => a - b);
  drawdowns.sort((a, b) => a - b);
  const quantile = (arr, q) => arr[clamp(Math.floor(q * (arr.length - 1)), 0, arr.length - 1)];
  return {
    cfg: { ...cfg, runs, trades },
    endings,
    drawdowns,
    medianEnd: quantile(endings, 0.5),
    p05: quantile(endings, 0.05),
    p95: quantile(endings, 0.95),
    avgEnd: avg(endings),
    avgDd: avg(drawdowns),
    probProfit: profitable / runs,
    probDd10: ruinCount / runs,
    worstDd: drawdowns[drawdowns.length - 1]
  };
}

function sizerModel() {
  const r = ui.risk;
  const acc = r.accountId ? accountById(r.accountId) : null;
  const metric = acc ? calcAccount(acc) : null;
  const base = metric ? Math.max(0, metric.equity) : 5000000;
  const info = pairInfo(r.pair);
  const riskPct = clamp(Number(r.riskPct) || 0, 0.01, 10);
  const riskCents = Math.round(base * riskPct / 100);
  const entry = Number(r.entry) || 0;
  const sl = Number(r.sl) || 0;
  const stopPips = entry && sl ? Math.abs(entry - sl) / info.pip : 0;
  const pipValue = pipValueUsd(r.pair, entry || info.base);
  const lots = stopPips > 0 ? riskCents / (stopPips * pipValue) / 100 : 0;
  const perPipCents = lots * pipValue * 100;
  const dailyRoom = metric && metric.dailyLimitCents > 0 ? metric.dailyRemainingCents : null;
  const maxLotsDaily = dailyRoom != null && stopPips > 0 ? dailyRoom / (stopPips * pipValue) / 100 : null;
  const exceedsDaily = dailyRoom != null && riskCents > dailyRoom;
  return {
    acc, metric, base, riskPct, riskCents, entry, sl, stopPips, lots,
    pipValue, perPipCents, dailyRoom, maxLotsDaily, exceedsDaily,
    pctOfEquity: base > 0 ? riskCents / base : 0
  };
}

/* ============================ FEAR CARDS ============================ */

function fearMonthKey() {
  const mk = String(ui.fearMonth || '');
  return /^\d{4}-\d{2}$/.test(mk) ? mk : currentMonthKey();
}
function fearCardsForMonth(mk) {
  return state.fearCards
    .filter((c) => monthKeyOf(c.date) === mk)
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || String(b.createdAt || '').localeCompare(String(a.createdAt || '')));
}
function fearSummaryForMonth(mk) {
  const list = fearCardsForMonth(mk);
  const totalR = sum(list, (c) => Number(c.costR) || 0);
  const worst = list.reduce((m, c) => ((Number(c.costR) || 0) > (m ? Number(m.costR) || 0 : -1) ? c : m), null);
  const types = {};
  list.forEach((c) => { types[c.type] = (types[c.type] || 0) + (Number(c.costR) || 0); });
  return { list, totalR, count: list.length, worst, types };
}
function fearImportForMonth(mk) {
  return state.fearImports
    .filter((p) => p.month === mk)
    .sort((a, b) => String(b.importedAt).localeCompare(String(a.importedAt)))[0] || null;
}
function fmtR(n) {
  const v = Number(n) || 0;
  return `${v % 1 === 0 ? v.toFixed(0) : v.toFixed(1)}R`;
}

function b64urlEncode(str) {
  const bytes = new TextEncoder().encode(str);
  let bin = '';
  bytes.forEach((b) => { bin += String.fromCharCode(b); });
  return btoa(bin).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
}
function b64urlDecode(str) {
  const s = String(str || '').replace(/-/g, '+').replace(/_/g, '/');
  const padded = s + '='.repeat((4 - (s.length % 4)) % 4);
  const bin = atob(padded);
  const bytes = Uint8Array.from(bin, (ch) => ch.charCodeAt(0));
  return new TextDecoder().decode(bytes);
}
function fearSeal(body) {
  let h = 0x811c9dc5;
  const s = String(body) + '|ledgerwise-fear-v1';
  for (let i = 0; i < s.length; i++) {
    h ^= s.charCodeAt(i);
    h = Math.imul(h, 0x01000193) >>> 0;
  }
  return h.toString(36);
}
function fearCardPayload(mk) {
  const sm = fearSummaryForMonth(mk);
  const types = {};
  Object.keys(sm.types).forEach((k) => { if (FEAR_TYPES[k] && sm.types[k] > 0) types[k] = roundTo(sm.types[k], 2); });
  return {
    v: 1,
    n: String(state.settings.name || 'Trader').slice(0, 40),
    m: mk,
    r: roundTo(sm.totalR, 2),
    c: sm.count,
    w: roundTo(sm.worst ? sm.worst.costR : 0, 2),
    wt: sm.worst ? sm.worst.type : '',
    t: types
  };
}
function fearCardText(mk) {
  const sm = fearSummaryForMonth(mk);
  const name = String(state.settings.name || 'Trader');
  const lines = [`FEAR CARD · ${name.toUpperCase()} · ${monthLabel(mk)}`];
  if (!sm.count) {
    lines.push('No fear events logged this month.');
  } else {
    lines.push(`Fear cost: ${fmtR(sm.totalR)} across ${sm.count} event${sm.count === 1 ? '' : 's'}`);
    if (sm.worst) lines.push(`Biggest single: ${FEAR_TYPES[sm.worst.type].label} — ${fmtR(sm.worst.costR)}`);
    const parts = Object.keys(sm.types)
      .filter((k) => sm.types[k] > 0)
      .sort((a, b) => sm.types[b] - sm.types[a])
      .map((k) => `${FEAR_TYPES[k].label} ${fmtR(sm.types[k])}`);
    if (parts.length) lines.push(parts.join(' · '));
  }
  lines.push('');
  const body = b64urlEncode(JSON.stringify(fearCardPayload(mk)));
  lines.push(`Code: FWC1.${body}.${fearSeal(body)}`);
  return lines.join('\n');
}

function parseFearCard(text) {
  const m = String(text || '').match(FEAR_CARD_RE);
  if (!m) return { error: 'No card code found. Paste the whole message — it must include "Code: FWC1."' };
  let data;
  try { data = JSON.parse(b64urlDecode(m[1])); }
  catch (e) { return { error: 'That code is damaged. Ask your partner to copy the card again.' }; }
  if (!m[2]) return { error: 'That card has no seal, so its numbers cannot be trusted as sent. Ask them to copy the card again from the app.' };
  if (fearSeal(m[1]) !== m[2]) return { error: 'That card changed on the way here — the seal no longer matches the numbers. Ask them to copy and send it again.' };
  if (!data || data.v !== 1) return { error: 'That is not a version-1 fear card.' };
  const name = String(data.n || '').trim().slice(0, 40);
  if (!name) return { error: 'The card does not name a trader.' };
  const month = String(data.m || '');
  if (!/^\d{4}-\d{2}$/.test(month)) return { error: 'The card does not carry a valid month.' };
  const costR = Number(data.r);
  if (!Number.isFinite(costR) || costR < 0 || costR > 100000) return { error: 'The card total is out of range.' };
  const count = Number(data.c);
  if (!Number.isFinite(count) || count < 0 || count > 10000) return { error: 'The card event count is out of range.' };
  const worstR = Number(data.w);
  const types = {};
  if (data.t && typeof data.t === 'object') {
    Object.keys(data.t).forEach((k) => {
      const v = Number(data.t[k]);
      if (FEAR_TYPES[k] && Number.isFinite(v) && v >= 0 && v <= 100000) types[k] = roundTo(v, 2);
    });
  }
  return {
    card: {
      name,
      month,
      costR: roundTo(costR, 2),
      count: Math.round(count),
      worstR: Number.isFinite(worstR) ? roundTo(clamp(worstR, 0, 100000), 2) : 0,
      worstType: FEAR_TYPES[data.wt] ? data.wt : '',
      types
    }
  };
}
async function copyPlainText(text) {
  try { await navigator.clipboard.writeText(text); return true; } catch (e) {}
  try {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.setAttribute('readonly', '');
    ta.style.position = 'fixed';
    ta.style.opacity = '0';
    document.body.appendChild(ta);
    ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}

function fearVerdict(mk, mine, partner) {
  const month = esc(monthLabel(mk));
  if (!partner) {
    const who = esc(state.settings.partnerName || 'your partner');
    return `No card from ${who} for ${month} yet. Copy yours, send it over, then paste whatever comes back. Same month, same scale.`;
  }
  const diff = partner.costR - mine.totalR;
  const both = `You both paid that bill in ${month} — <b>${esc(partner.name)}</b> at <b>${fmtR(partner.costR)}</b>, you at <b>${fmtR(mine.totalR)}</b>. Fear is doing the same job to both of you; the plan is what moves it.`;
  if (Math.abs(diff) < 0.05) {
    return `Even in ${month}: <b>${fmtR(mine.totalR)}</b> each. Nothing to prove and nothing to hide — that is the whole point of sending the card.`;
  }
  return both;
}

          <div class="form-note mt-14" style="font-size:10.5px">
            ${sim.probDd10 > 0.25
              ? 'A drawdown this likely should change position size, not just mindset. Lower risk % and simulate again.'

          </div>
          ${simGradeLoaderHTML()}
        </section>

        <section class="card">
          <div class="card-head">
            <div><div class="card-title">Risk rules</div><div class="card-sub">The checklist before any entry.</div></div>
          </div>
          <div class="side-list">

            <div class="side-list-row"><div class="k">${icon('check', 13)} A loss cannot trigger a breach</div></div>
            <div class="side-list-row"><div class="k">${icon('check', 13)} Setup grade justifies the risk</div></div>
          </div>
        </section>
      </div>
    </div>`;
}

function payoutProjectionFromUI() {
  return projectPayouts({
    sizeCents: Math.round(ui.growth.size * 100),
    monthlyReturnPct: ui.growth.monthlyReturn,
    splitPct: ui.growth.split,
    withdrawPct: ui.growth.withdraw,
    months: ui.growth.months
  });
}
function compoundProjectionFromUI() {
  return compoundProjection({
    initialCents: Math.round(ui.growth.initial * 100),
    monthlyCents: Math.round(ui.growth.monthly * 100),
    annualPct: ui.growth.annual,
    years: ui.growth.years
  });
}
function ladderCapital() {
  return requiredFundedCapital({
    targetMonthlyCents: Math.round(ui.growth.targetMonthly * 100),
    monthlyReturnPct: ui.growth.monthlyReturn,
    splitPct: ui.growth.split
  });
}

function drawGrowthCharts() {
  const payoutEl = document.getElementById('growth-chart');
  if (payoutEl) {

    drawBarChart(payoutEl, proj.rows.map((r) => ({ label: 'M' + r.month, values: [r.cumulativeCents] })), {
      height: 220,
      series: [{ key: 'cumulative', label: 'Cumulative payout', color: 'var(--mint)' }],
      aria: 'Cumulative payout projection by month'
    });
  }
  const compEl = document.getElementById('compound-chart');
  if (compEl) {
    const proj = compoundProjectionFromUI();
    drawLineChart(compEl, proj.rows.map((r, i) => ({
      label: i === 0 ? 'Now' : 'Y' + r.year,
      value: r.balanceCents,
      title: `Year ${r.year}: ${money(r.balanceCents)}`
    })), { height: 190, color: 'var(--sky)', aria: 'Compounding balance projection' });
  }
}

let pendingConfirm = null;

function openModal(html) {
  const root = document.getElementById('modal-root');
  modalLastFocus = document.activeElement;
  root.innerHTML = html;
  root.dataset.dirty = '';
  root.dataset.warned = '';
  document.body.classList.add('modal-open');
  const first = root.querySelector('input:not([type="hidden"]):not([disabled]), select, textarea, button.btn-primary') || root.querySelector('button');
  setTimeout(() => { if (first) first.focus(); }, 30);
}

function closeModal() {
  const root = document.getElementById('modal-root');
  if (!root.innerHTML) return;
  root.innerHTML = '';
  document.body.classList.remove('modal-open');
  if (modalLastFocus && document.contains(modalLastFocus)) {
    try { modalLastFocus.focus(); } catch (e) {}
  }
  modalLastFocus = null;
  pendingConfirm = null;
}

function guardCloseModal() {
  const root = document.getElementById('modal-root');
  // Escape and a click past the edge are both reflexes. On a form that already has
  // typing in them they are a deleted close-out, so the first one only warns.
  if (root && root.dataset.dirty === '1' && root.dataset.warned !== '1') {
    root.dataset.warned = '1';
    toast('Nothing discarded — this form has typing in it. Press Escape or click the dim edge again to throw it away.', 'error');
    return false;
  }
  closeModal();
  return true;
}

/* ----------------------- pre-trade checklist ----------------------- */

// The conditions live in settings so they can be rewritten without touching
// code. Anything malformed falls back to the defaults rather than blanking the
// check, because an empty checklist silently means every trade grades F.
const GRADE_ORDER = { A: 0, B: 1, C: 2, F: 3, '—': 4 };

function gradeRows(st) {
  return Object.values(st.byGrade).filter((r) => r.count)
    .sort((a, b) => (GRADE_ORDER[a.key] ?? 9) - (GRADE_ORDER[b.key] ?? 9) || b.count - a.count);
}

// Win rate as a bar, expectancy as a number. Putting them side by side is the
// point: a 50% win rate against a 1R target is still a losing bucket.
function gradeSplitHTML(st, opts = {}) {
  const rows = gradeRows(st);
  if (!rows.length) {
    return `<div class="tiny muted">Nothing graded yet${opts.bt ? ' in this backtest' : ''}. The grade comes from the confluence check, so it appears once a trade has been logged through one.</div>`;
  }
  const weak = rows.filter((r) => r.key === 'C' || r.key === 'F');
  const weakCount = sum(weak, (r) => r.count);
  const weakNet = sum(weak, (r) => r.net);
  const ungraded = rows.filter((r) => r.key === '—');
  const unitOf = (n) => (opts.unit || 'trades').replace(/s$/, '') + (n === 1 ? '' : 's');
  return `
    ${rows.map((r) => {
      const decided = r.wins + r.losses;
      const wr = decided ? (r.wins / decided) * 100 : null;
      const exp = r.count ? r.net / r.count : 0;
      const avgR = r.rCount ? r.rTotal / r.rCount : null;
      return `
        <div class="ck-grade-row">
          <div class="k">${gradeBadge(r.key)} <span class="muted tiny">${r.count} ${unitOf(r.count)}</span></div>
          <div class="v ${r.net >= 0 ? 'pos' : 'neg'}">${money(r.net, { sign: true })} <span class="muted">· ${wr == null ? 'no decision' : pctRatio(wr / 100, 0)}</span></div>
        </div>
        <div class="progress thin" style="margin:2px 0 7px"><span style="width:${clamp(wr == null ? 0 : wr, 0, 100).toFixed(1)}%;background:${r.key === 'A' ? 'var(--mint)' : r.key === 'B' ? 'var(--sky)' : 'var(--rose)'}"></span></div>
        <div class="tiny muted" style="margin-bottom:8px">Expectancy ${money(exp, { sign: true })} per ${opts.bt ? 'setup' : 'trade'}${avgR == null ? ' · R not measured' : ` · ${avgR > 0 ? '+' : ''}${avgR.toFixed(2)}R average`}</div>`;
    }).join('')}
    ${weakCount ? `<div class="plan-room${weakNet < 0 ? ' is-shut' : ''}" style="margin-top:10px">
        <span>${weakCount} ${unitOf(weakCount)} graded C or F</span>
        <b>${money(weakNet, { sign: true })}</b>
      </div>
      <div class="tiny muted" style="margin-top:6px">C and F are the grades the check itself calls weak, so this is the cheapest line on the page to fix. Read the count next to each grade before believing the percentage — these buckets are small.</div>` : ''}
    ${ungraded.length ? '<div class="tiny muted" style="margin-top:6px">Rows marked — were logged before the check existed or imported from MT5, where no pre-trade condition is recorded. They sit outside every grade average rather than being guessed at.</div>' : ''}`;
}

// The simulation only means something if its inputs are honest. These buttons
// load one grade's real record into the win rate and the two R figures, so the
// paths being run are the grade, not a hopeful guess.
function gradeSimFill(grade) {
  const rows = state.trades.filter((t) => (t.grade || '') === grade);
  if (!rows.length) return { error: `No ${grade}-grade trade in the ledger yet, so there is nothing to load.` };
  const st = statsFor(rows);
  const decided = st.wins.length + st.losses.length;
  if (!decided) return { error: `None of the ${rows.length} ${grade}-grade trades has closed yet.` };
  const winRs = st.wins.map((t) => Number(t.r)).filter((v) => Number.isFinite(v) && v > 0);
  const lossRs = st.losses.map((t) => Number(t.r)).filter((v) => Number.isFinite(v) && v < 0);
  if (!winRs.length || !lossRs.length) {
    return { error: `${grade}-grade trades have ${winRs.length ? 'no measured loss' : 'no measured win'} in R — R needs a stop recorded on the trade, so this bucket cannot drive the simulation yet.` };
  }
  return {
    winRate: clamp(Math.round((st.wins.length / decided) * 100), 1, 99),
    winR: roundTo(sum(winRs, (v) => v) / winRs.length, 2),
    lossR: roundTo(Math.abs(sum(lossRs, (v) => v) / lossRs.length), 2),
    count: rows.length,
    net: st.net
  };
}

function simGradeLoaderHTML() {
  const rows = GRADES.map((g) => ({ g, fill: gradeSimFill(g) })).filter((r) => state.trades.some((t) => (t.grade || '') === r.g));
  if (!rows.length) return '<div class="tiny muted" style="margin-top:12px">No graded trades yet, so the simulation has no history to load. Log a trade through the checklist and this fills in.</div>';
  return `

      <div class="card-title" style="font-size:12px">Run one grade&rsquo;s own history</div>

        : `<button class="btn btn-sm btn-ghost grade-chip" type="button" data-act="sim-grade" data-grade="${esc(r.g)}">
            ${gradeBadge(r.g)} <span>${r.fill.winRate}% win · ${r.fill.winR}R / ${r.fill.lossR}R</span>

}

function checklistSettingsCard() {
  const def = checklistDef();
  const graded = state.trades.filter((t) => t.checkTotal).length;
  return `
    <section class="card">
      <div class="card-head">

      </div>

function checklistDef() {
  const raw = state.settings && state.settings.checklist ? state.settings.checklist : null;
  const stored = raw && Array.isArray(raw.items)
    ? raw.items.map((it, i) => ({
        id: String((it && it.id) || `ck${i + 1}`).slice(0, 20),
        text: String((it && it.text) || '').slice(0, 150)
      })).filter((it) => it.text)
    : [];
  return {
    on: !(raw && raw.on === false),
    items: stored.length ? stored : CHECKLIST_DEFAULTS.map((c) => ({ ...c }))
  };
}

// Bands are counted by conditions *missing*, not by a fixed score, so the rule
// still means the same thing after the list is edited to five or eight items.
function gradeFromScore(score, total) {
  if (total <= 0) return '';
  const missing = Math.max(0, total - clamp(Number(score) || 0, 0, total));
  if (missing === 0) return 'A';
  if (missing === 1) return 'B';
  if (missing === 2) return 'C';
  return 'F';
}

function gradeBadge(g) {
  if (!g) return '<span class="badge badge-muted no-dot">—</span>';
  return `<span class="badge ${g === 'A' ? 'badge-mint' : (g === 'C' || g === 'F') ? 'badge-rose' : 'badge-muted'} no-dot">${esc(g)}</span>`;
}

// What this grade has actually done in his own book. The warning is a fact
// about the setup, read back from the ledger — never a verdict on the trader.
function gradeHistoryLine(grade, list = state.trades) {
  const rows = list.filter((t) => (t.grade || '') === grade);
  if (!rows.length) return `No ${grade}-grade trade in your log yet, so this grade has no history to compare against.`;
  const st = statsFor(rows);
  const decided = st.wins.length + st.losses.length;
  return `Your own log: ${rows.length} ${grade}-grade ${rows.length === 1 ? 'trade' : 'trades'} · ${decided ? `${st.wins.length}W ${st.losses.length}L (${pctRatio(st.winRate, 0)})` : 'none decided a winner'} · ${money(st.net, { sign: true })}.`;
}

// 'locked' = graded at arm time, 'auto' = the check decides, 'keep' = an old
// row whose grade was typed by hand and must not be overwritten by silence.
function checklistMode(form) {
  if (form.dataset.ckMode) return form.dataset.ckMode;
  const mode = form.dataset.ckLocked === 'yes' ? 'locked'
    : form.dataset.ckChecks ? 'auto'
    : form.dataset.ckNew === 'yes' ? 'auto' : 'keep';
  form.dataset.ckMode = mode;
  return mode;
}

function checklistPicked(form) {
  return Array.from(form.querySelectorAll('input[name="ck"]')).filter((el) => el.checked).map((el) => el.value);
}

// Any tick ends the "keep the old hand-typed grade" state, and clears a
// confirmation that was given for a different grade.
function wireChecklist(form) {
  if (!form) return;
  form.querySelectorAll('input[name="ck"]').forEach((el) => {
    el.addEventListener('change', () => {
      if (form.dataset.ckMode === 'keep') form.dataset.ckMode = 'auto';
      form.dataset.ckConfirm = '';
      form.dataset.ckConfirmText = '';
      syncChecklist(form);
    });
  });
  syncChecklist(form);
}

// Recomputes the visible grade and the hidden fields the save path reads.
function syncChecklist(form) {
  if (!form) return null;
  const box = form.querySelector('.ck-live');
  if (!box) return null;
  const def = checklistDef();
  const locked = form.dataset.ckLocked === 'yes';
  const mode = checklistMode(form);
  const total = def.items.length;
  const picked = checklistPicked(form);
  const missing = def.items.filter((it) => !picked.includes(it.id));
  const score = total - missing.length;
  const keeping = mode === 'keep' && !picked.length;
  // An untouched check is not an F, it is an unanswered question. F is what
  // three or more missed conditions say once he has actually answered.
  const unanswered = score === 0 && mode !== 'locked';
  const grade = keeping
    ? (form.elements.namedItem('grade') ? form.elements.namedItem('grade').value : '')
    : unanswered ? '' : gradeFromScore(score, total);
  const gradeInput = form.elements.namedItem('grade');
  if (gradeInput) gradeInput.value = grade || '';
  const totalInput = form.elements.namedItem('checkTotal');
  if (totalInput) totalInput.value = String(total);
  const weak = grade === 'C' || grade === 'F';
  const shortNames = (arr) => esc(arr.map((m) => String(m.text).split(' — ')[0]).join(', '));
  box.innerHTML = `    <div class="ck-line">
      ${gradeBadge(grade)}
      <span class="ck-score">${keeping ? `grade carried from the old record, typed by hand` : `${score} of ${total} held${grade ? ` — ${GRADE_WORDS[grade] || ''}` : ' — the check is unanswered, so there is no grade yet'}`}</span>
    </div>
    ${unanswered && mode !== 'keep' ? '<div class="ck-note">Tick what was actually true before entry. If nothing was, that is an F and the ledger says so — which is the point of asking before the result exists.</div>' : ''}
    ${locked ? `<div class="ck-note">Scored when you armed the window, before price moved. Locked, so the result cannot reach back and change the grade.${missing.length ? ` Conditions that did not hold: ${shortNames(missing)}.` : ''}</div>` : ''}
    ${keeping ? `<div class="ck-note">This record predates the checklist, so it keeps the grade it was given (${esc(grade || 'none')}). Tick what actually held and from now on the grade is calculated, not remembered.</div>` : ''}
    ${!keeping && !locked && missing.length && score > 0 ? `<div class="ck-note">Not held: ${shortNames(missing)}.</div>` : ''}
    ${weak ? `<div class="ck-warn">
        <b>${esc(grade)} grade — ${score} of ${total} conditions.</b> ${esc(gradeHistoryLine(grade))}
        ${locked ? '' : `<span class="ck-warn-sub">Taking it stays your call. What changes is that the grade is written before the outcome exists, and the second press is the record that you saw it coming.</span>`}
      </div>` : ''}
    ${form.dataset.ckConfirm === 'yes' && form.dataset.ckConfirmText ? `<div class="ck-confirm">${form.dataset.ckConfirmText}</div>` : ''}`;
  return { grade, score, total, picked, mode };
}

// A weak grade is allowed into the ledger, but not on a reflex. The first
// press only shows what is about to be recorded; the second records it.
function askGradeConfirm(form, grade, ck, verb = 'Log') {
  form.dataset.ckConfirm = 'yes';
  const box = form.querySelector('.ck-live');
  if (box) {
    const row = document.createElement('div');
    row.className = 'ck-confirm';
    row.innerHTML = `<b>Nothing was saved yet.</b> The check is doing its job: it is telling you the grade while the result is still unknown, which is the only moment the number means anything.
      Press again and this ${verb === 'Arm' ? 'window goes on the clock' : 'goes into the ledger'} as a <b>${esc(grade)}</b> at ${ck.score} of ${ck.total} conditions — and it stays a ${esc(grade)} when the analytics read it back, win or lose.`;
    box.appendChild(row);
    form.dataset.ckConfirmText = row.innerHTML;
    row.scrollIntoView({ block: 'nearest' });
  }
  const btn = form.querySelector('.modal-actions button[type="submit"]');
  if (btn) {
    btn.classList.remove('btn-primary');
    btn.classList.add('btn-danger');
    btn.textContent = `${verb} it as ${grade} — press again`;
  }
  toast(`${grade} grade — ${ck.score} of ${ck.total}. Press the button again to ${verb.toLowerCase()} it anyway.`, 'info');
}

function checklistFieldsHTML(opts = {}) {
  const def = checklistDef();
  if (!def.on) {
    return `
      <div class="field">
        <label for="tr-grade">Setup grade</label>
        <select class="select" id="tr-grade" name="grade">${GRADES.map((g) => `<option value="${g}"${g === (opts.grade || 'A') ? ' selected' : ''}>${g}</option>`).join('')}</select>
        <div class="hint">The checklist is switched off, so this grade is typed by hand — after the trade closed, which is when a grade stops being evidence. <button class="btn-link" type="button" data-act="checklist-edit" style="font-size:11px">Switch it back on</button></div>
      </div>`;
  }
  const pickedIds = opts.checks || [];
  const total = def.items.length;
  const score = def.items.filter((it) => pickedIds.includes(it.id)).length;
  const grade = (opts.locked || (opts.autoMode && score > 0)) ? gradeFromScore(score, total) : (opts.grade || '');
  const locked = opts.locked ? ' disabled' : '';
  return `
    <div class="field full ck-wrap">
      <div class="ck-head">
        <label>Setup confluence — ${total}-point check <span class="req">*</span></label>
        <button class="btn-link" type="button" data-act="checklist-edit" style="font-size:11px">${icon('edit', 12)} Edit these conditions</button>
      </div>
      <div class="ck-grid">
        ${def.items.map((it, i) => `
          <label class="check ck-item">
            <input type="checkbox" name="ck" value="${esc(it.id)}"${pickedIds.includes(it.id) ? ' checked' : ''}${locked}>
            <span><b>C${i + 1}</b> ${esc(it.text)}</span>
          </label>`).join('')}
      </div>
      <input type="hidden" name="grade" value="${esc(grade)}">

}

// The open editor form is the draft: add and remove re-render it, so whatever
// he has typed in the other rows has to survive the click.
function checklistDraft() {
  const form = document.querySelector('[data-form="checklist"]');
  if (!form) return null;
  const texts = Array.from(form.querySelectorAll('input[name="cktext"]'));
  const ids = Array.from(form.querySelectorAll('input[name="ckid"]'));
  const on = form.elements.namedItem('on');
  return {
    on: on ? on.checked : true,
    items: texts.map((el, i) => ({ id: ids[i] ? ids[i].value : `ck${i + 1}`, text: el.value }))
  };
}

function openChecklistEditor(draft) {
  const def = draft || checklistDraft() || checklistDef();
  const items = def.items.slice(0, 10);
  const fields = `
    <div class="form-grid">
      <div class="field full">
        <div class="ck-head">
          <label>Conditions in the check</label>
          <button class="btn btn-sm btn-ghost" type="button" data-act="checklist-add">${icon('plus', 12)} Add a condition</button>
        </div>
        <div class="ck-edit-list">
          ${items.map((it, i) => `
            <div class="ck-edit-row">
              <span class="ck-edit-n">C${i + 1}</span>
              <input class="input" name="cktext" type="text" maxlength="150" value="${fieldValue(it.text)}" placeholder="e.g. HTF alignment — the 4H trend agrees">
              <input type="hidden" name="ckid" value="${esc(it.id)}">
              <button class="btn-icon danger" type="button" data-act="checklist-del" data-id="${esc(it.id)}" aria-label="Remove condition" ${items.length <= 2 ? 'disabled' : ''}>${icon('trash', 13)}</button>
            </div>`).join('')}
        </div>
        <div class="hint">Word each one so price or a calendar can answer it. "Good setup" is not a condition; "1H candle closed above the Asia high" is. The grade bands follow the count: all held = A, one missing = B, two missing = C, three or more missing = F. Two conditions is the floor, ten the ceiling. Trades already logged keep the grade they were given, so editing this list never rewrites history.</div>
      </div>
      <div class="field full">
        <label class="check"><input type="checkbox" name="on" value="yes"${def.on ? ' checked' : ''}><span>Use the checklist to set the grade automatically</span></label>
        <div class="hint">Off means the grade goes back to being typed by hand after the trade closes — and a grade typed after the result is an opinion about the result, not about the setup.</div>
      </div>
    </div>`;
  formModal({
    title: 'The checklist is yours',
    sub: 'The conditions that have to be true before entry. Rewrite them in your own words; the grade follows whatever list you keep.',
    fields, submitLabel: 'Save the checklist', formKey: 'checklist'
  });
  if (draft && draft.items.length && !draft.items[draft.items.length - 1].text) {
    const rows = document.querySelectorAll('[data-form="checklist"] input[name="cktext"]');
    const last = rows[rows.length - 1];
    if (last) setTimeout(() => last.focus(), 30);
  }
}

function saveChecklist(form) {
  const fd = new FormData(form);
  const texts = fd.getAll('cktext');
  const ids = fd.getAll('ckid');
  const items = texts.map((t, i) => ({ id: String(ids[i] || `ck${i + 1}`), text: String(t || '').trim().slice(0, 150) })).filter((it) => it.text);
  if (!items.length) { toast('Keep at least one condition, or the check has nothing to score.', 'error'); return; }
  if (items.length > 10) { toast('Ten conditions is the ceiling — past that nobody ticks anything honestly.', 'error'); return; }
  state.settings.checklist = { on: fd.get('on') === 'yes', items };
  commit('Checklist saved. New trades grade themselves against these conditions.', 'settings');
}

function tradeCalcHTML(form) {
  if (!form) return '';
  const get = (n) => { const el = form.elements.namedItem(n); return el ? el.value : ''; };
  const pair = get('pair') || 'EUR/USD';
  const direction = get('direction') || 'long';
  const entry = numOrNull(get('entry'));
  const exit = numOrNull(get('exit'));
  const sl = numOrNull(get('sl'));
  const tp = numOrNull(get('tp'));
  const lots = numFrom(get('lots'));
  const tm = tradeMath({ pair, direction, entry, exit, sl, tp, lots });
  const estimate = tm.estimateCents;
  const entered = centsFrom(get('pnl'));
  const isUSD = currencyInfo().code === 'USD';
  const estimateText = estimate == null ? '—' : isUSD ? money(estimate, { sign: true }) : usdMoney(estimate);
  const riskText = tm.riskCents == null ? '—' : isUSD ? money(tm.riskCents) : usdMoney(tm.riskCents).replace(/^[+−]/, '');
  const pipValueText = isUSD ? '$' + tm.pipValue.toFixed(2) : usdMoney(Math.round(tm.pipValue * 100)).replace(/^[+−]/, '');
  const diff = estimate != null && entered !== 0 && Math.abs(entered - estimate) > Math.max(100, Math.abs(estimate) * 0.05);
  const info = pairInfo(pair);
  const tinyStop = !tm.stopError && tm.riskPips != null && tm.riskPips > 0 && tm.riskPips < 5;
  return `
    <div class="calc-preview">
      <div><div class="k">Pips</div><div class="v ${tm.pips == null ? '' : tm.pips >= 0 ? 'pos' : 'neg'}">${tm.pips == null ? '—' : tm.pips.toFixed(1)}</div></div>
      <div><div class="k">Stop distance</div><div class="v ${tm.stopError || tinyStop ? 'neg' : ''}">${tm.riskPips == null ? '—' : tm.riskPips.toFixed(1)}</div><div class="s">${tm.riskPips == null ? 'enter a stop' : 'pips'}</div></div>
      <div><div class="k">R multiple</div><div class="v ${tm.r == null ? '' : tm.r >= 0 ? 'pos' : 'neg'}">${tm.r == null ? '—' : rLabel(tm.r)}</div><div class="s">${tm.riskCents == null ? 'no lot size' : '1R ≈ ' + riskText}</div></div>
      <div><div class="k">${isUSD ? 'Price-based estimate' : 'USD estimate'}</div><div class="v ${estimate == null ? '' : estimate >= 0 ? 'pos' : 'neg'}">${estimateText}</div></div>
    </div>
    ${tm.stopError ? `<div class="form-note rose" style="font-size:10.5px">${tm.stopError} R was not calculated. A long needs the stop below entry; a short needs it above.</div>` : ''}
    ${tinyStop ? `<div class="form-note amber" style="font-size:10.5px">The initial stop is only ${tm.riskPips.toFixed(1)} pips from entry. Check the price scale: 20 pips on ${esc(pair)} is ${(20 * info.pip).toFixed(info.digits)} in price, not 20. If this is the moved stop, put it in Final stop and enter the stop you had at entry.</div>` : ''}
    <div class="form-note full" style="font-size:10.5px;display:flex;justify-content:space-between;gap:10px;align-items:center">
      <span>${diff && isUSD
        ? 'Recorded P&amp;L differs from the price-based estimate. That is valid if spread, commission, partials or slippage explain it.'
        : `Estimate uses ${pipValueText}/pip per 1.00 lot at this entry price. ${isUSD
          ? 'Your broker&rsquo;s actual P&amp;L is the number that counts.'
          : `Convert to ${currencyInfo().code} before recording; nothing is converted automatically.`}`}</span>
      ${estimate != null && isUSD ? '<button type="button" class="btn-link" data-act="trade-estimate" style="font-size:10.5px;white-space:nowrap">Use estimate</button>' : ''}
    </div>`;
}
